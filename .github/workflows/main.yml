          // ---------- قفل دلخواه: رمز عبور یا الگو ----------
          final customLock = ValueNotifier<String>('none'); // none | pin | pattern
          String _lockHash = '', _lockSalt = '';

          String _hashSecret(String salt, String secret) =>
              sha256.convert(utf8.encode('$salt|$secret')).toString();

          Future<void> loadCustomLock() async {
            try {
              final p = await SharedPreferences.getInstance();
              _lockHash = p.getString('cl_hash') ?? '';
              _lockSalt = p.getString('cl_salt') ?? '';
              final t = p.getString('cl_type') ?? 'none';
              customLock.value = _lockHash.isEmpty ? 'none' : t;
            } catch (_) {}
          }

          Future<void> setCustomLock(String type, String secret) async {
            _lockSalt = '${DateTime.now().microsecondsSinceEpoch}${math.Random.secure().nextInt(1 << 30)}';
            _lockHash = _hashSecret(_lockSalt, secret);
            customLock.value = type;
            try {
              final p = await SharedPreferences.getInstance();
              await p.setString('cl_hash', _lockHash);
              await p.setString('cl_salt', _lockSalt);
              await p.setString('cl_type', type);
            } catch (_) {}
          }

          Future<void> clearCustomLock() async {
            _lockHash = '';
            _lockSalt = '';
            customLock.value = 'none';
            try {
              final p = await SharedPreferences.getInstance();
              await p.remove('cl_hash');
              await p.remove('cl_salt');
              await p.remove('cl_type');
            } catch (_) {}
          }

          bool verifyCustomLock(String secret) =>
              _lockHash.isNotEmpty && _hashSecret(_lockSalt, secret) == _lockHash;

          class PatternPad extends StatefulWidget {
            final ValueChanged<List<int>> onDone;
            final bool error;
            const PatternPad({super.key, required this.onDone, this.error = false});
            @override
            State<PatternPad> createState() => _PatternPadState();
          }

          class _PatternPadState extends State<PatternPad> {
            static const double sz = 270;
            final List<int> sel = [];
            Offset? cur;

            Offset _center(int i) {
              const cell = sz / 3;
              return Offset((i % 3) * cell + cell / 2, (i ~/ 3) * cell + cell / 2);
            }

            void _hit(Offset p) {
              for (var i = 0; i < 9; i++) {
                if (!sel.contains(i) && (p - _center(i)).distance < 34) sel.add(i);
              }
            }

            @override
            Widget build(BuildContext context) {
              final col = widget.error ? cPay : Theme.of(context).colorScheme.primary;
              return GestureDetector(
                onPanStart: (d) => setState(() {
                  sel.clear();
                  cur = d.localPosition;
                  _hit(cur!);
                }),
                onPanUpdate: (d) => setState(() {
                  cur = d.localPosition;
                  _hit(cur!);
                }),
                onPanEnd: (_) {
                  final s = List<int>.from(sel);
                  setState(() => cur = null);
                  if (s.isNotEmpty) widget.onDone(s);
                  Future.delayed(const Duration(milliseconds: 350), () {
                    if (mounted) setState(sel.clear);
                  });
                },
                child: CustomPaint(
                  size: const Size(sz, sz),
                  painter: _PatternPainter(List<int>.from(sel), cur, _center, col),
                ),
              );
            }
          }

          class _PatternPainter extends CustomPainter {
            final List<int> sel;
            final Offset? cur;
            final Offset Function(int) center;
            final Color col;
            _PatternPainter(this.sel, this.cur, this.center, this.col);

            @override
            void paint(Canvas canvas, Size size) {
              final line = Paint()
                ..color = col.withValues(alpha: .7)
                ..strokeWidth = 5
                ..strokeCap = StrokeCap.round;
              for (var i = 0; i + 1 < sel.length; i++) {
                canvas.drawLine(center(sel[i]), center(sel[i + 1]), line);
              }
              if (sel.isNotEmpty && cur != null) canvas.drawLine(center(sel.last), cur!, line);
              for (var i = 0; i < 9; i++) {
                final on = sel.contains(i);
                canvas.drawCircle(center(i), on ? 14 : 9,
                    Paint()..color = on ? col : Colors.grey.withValues(alpha: .6));
                if (on) {
                  canvas.drawCircle(center(i), 26,
                      Paint()
                        ..color = col.withValues(alpha: .25)
                        ..style = PaintingStyle.stroke
                        ..strokeWidth = 3);
                }
              }
            }

            @override
            bool shouldRepaint(covariant _PatternPainter o) => true;
          }

          class CustomLockScreen extends StatefulWidget {
            final VoidCallback onUnlocked;
            final VoidCallback? onDeviceAuth;
            final bool allowForgot;
            const CustomLockScreen(
                {super.key, required this.onUnlocked, this.onDeviceAuth, this.allowForgot = false});
            @override
            State<CustomLockScreen> createState() => _CustomLockScreenState();
          }

          class _CustomLockScreenState extends State<CustomLockScreen> {
            final pass = TextEditingController();
            String? err;
            int fails = 0;
            DateTime? until;
            bool forgot = false;

            bool get isPin => customLock.value == 'pin';

            @override
            void dispose() {
              pass.dispose();
              super.dispose();
            }

            void _check(String secret) {
              final now = DateTime.now();
              if (until != null && now.isBefore(until!)) {
                setState(() => err = 'تلاش‌های ناموفق زیاد بود؛ کمی بعد دوباره امتحان کنید');
                return;
              }
              if (verifyCustomLock(secret)) {
                widget.onUnlocked();
                return;
              }
              fails++;
              pass.clear();
              setState(() {
                if (fails >= 5) {
                  until = now.add(const Duration(seconds: 30));
                  fails = 0;
                  err = 'پنج بار اشتباه بود؛ ۳۰ ثانیه صبر کنید';
                } else {
                  err = isPin ? 'رمز اشتباه است' : 'الگو اشتباه است';
                }
              });
            }

            Future<void> _forgot() async {
              await clearCustomLock();
              try {
                await store.clear();
                await sb.auth.signOut();
              } catch (_) {}
              widget.onUnlocked();
            }

            @override
            Widget build(BuildContext context) {
              return SafeArea(
                child: Center(
                  child: SingleChildScrollView(
                    padding: const EdgeInsets.all(24),
                    child: Column(mainAxisSize: MainAxisSize.min, children: [
                      const Icon(Icons.lock_outline, size: 64, color: cBrand),
                      const SizedBox(height: 12),
                      const Text('حساب‌یار قفل است',
                          style: TextStyle(fontSize: 20, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 20),
                      if (forgot) ...[
                        const Text(
                            'با خروج از حساب، قفل دلخواه برداشته می‌شود و باید دوباره با ایمیل و رمز حساب وارد شوید. اطلاعات شما در سرور می‌ماند. ادامه می‌دهید؟',
                            textAlign: TextAlign.center),
                        const SizedBox(height: 12),
                        FilledButton(onPressed: _forgot, child: const Text('خروج از حساب و برداشتن قفل')),
                        TextButton(
                            onPressed: () => setState(() => forgot = false), child: const Text('انصراف')),
                      ] else ...[
                        if (isPin) ...[
                          TextField(
                            controller: pass,
                            obscureText: true,
                            textAlign: TextAlign.center,
                            onSubmitted: _check,
                            decoration: const InputDecoration(
                                border: OutlineInputBorder(), hintText: 'رمز عبور برنامه'),
                          ),
                          const SizedBox(height: 12),
                          FilledButton(onPressed: () => _check(pass.text), child: const Text('ورود')),
                        ] else
                          PatternPad(error: err != null, onDone: (s) => _check(s.join('-'))),
                        if (err != null) ...[
                          const SizedBox(height: 12),
                          Text(err!, style: const TextStyle(color: cPay)),
                        ],
                        if (widget.onDeviceAuth != null) ...[
                          const SizedBox(height: 12),
                          TextButton.icon(
                              onPressed: widget.onDeviceAuth,
                              icon: const Icon(Icons.fingerprint),
                              label: const Text('استفاده از اثر انگشت / قفل گوشی')),
                        ],
                        if (widget.allowForgot)
                          TextButton(
                              onPressed: () => setState(() => forgot = true),
                              child: const Text('رمز یا الگو را فراموش کرده‌ام')),
                      ],
                    ]),
                  ),
                ),
              );
            }
          }

          Future<bool> verifyCurrentLock(BuildContext c) async {
            if (customLock.value == 'none') return true;
            final ok = await Navigator.push<bool>(
                c,
                MaterialPageRoute(
                    builder: (_) => Scaffold(
                          appBar: AppBar(title: const Text('تأیید قفل فعلی')),
                          body: Builder(
                              builder: (ctx) =>
                                  CustomLockScreen(onUnlocked: () => Navigator.pop(ctx, true))),
                        )));
            return ok == true;
          }

          Future<void> startLockSetup(BuildContext c, String type) async {
            if (!await verifyCurrentLock(c) || !c.mounted) return;
            await Navigator.push(c, MaterialPageRoute(builder: (_) => LockSetupPage(type)));
          }

