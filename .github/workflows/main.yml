                          icon: const Icon(Icons.restart_alt),
                          label: const Text('بازنشانی چیدمان')),
                    ]),
                  ]),
                );

            Widget _pill(Color c, bool horizontal) => Center(
                  child: Container(
                    width: horizontal ? 36 : 6,
                    height: horizontal ? 6 : 36,
                    decoration: BoxDecoration(color: c, borderRadius: BorderRadius.circular(3)),
                  ),
                );

            // کادر در حالت ویرایش: جابه‌جایی با کشیدن، تغییر اندازه با دستگیره‌ها
            Widget _editable(BuildContext c, String k, double w, Widget content) {
              final pc = Theme.of(c).colorScheme.primary;
              void move(DragUpdateDetails d) {
                final r = uiStyles.rect(k);
                final nx = (r[0] + d.delta.dx / w).clamp(0.0, math.max(0.0, 1 - r[2])).toDouble();
                final ny = math.max(0.0, r[1] + d.delta.dy);
                uiStyles.setRect(k, [nx, ny, r[2], r[3]], save: false);
              }

              void resize(DragUpdateDetails d, {bool dw = false, bool dh = false}) {
                final r = uiStyles.rect(k);
                var nw = r[2], nh = r[3];
                if (dw) nw = (r[2] + d.delta.dx / w).clamp(.25, math.max(.25, 1 - r[0])).toDouble();
                if (dh) nh = (r[3] + d.delta.dy).clamp(56.0, 500.0).toDouble();
                uiStyles.setRect(k, [r[0], r[1], nw, nh], save: false);
              }

              return Stack(children: [
                Positioned.fill(
                  child: GestureDetector(
                    behavior: HitTestBehavior.opaque,
                    onPanUpdate: move,
                    onPanEnd: (_) => uiStyles.flush(),
                    child: AbsorbPointer(child: content),
                  ),
                ),
                Positioned.fill(
                  child: IgnorePointer(
                    child: DecoratedBox(
                      decoration: BoxDecoration(
                          borderRadius: BorderRadius.circular(22),
                          border: Border.all(color: pc, width: 2)),
                    ),
                  ),
                ),
                Positioned(
                  right: 0,
                  top: 18,
                  bottom: 34,
                  width: 26,
                  child: GestureDetector(
                    behavior: HitTestBehavior.opaque,
                    onPanUpdate: (d) => resize(d, dw: true),
                    onPanEnd: (_) => uiStyles.flush(),
                    child: _pill(pc, false),
                  ),
                ),
                Positioned(
                  left: 18,
                  right: 34,
                  bottom: 0,
                  height: 26,
                  child: GestureDetector(
                    behavior: HitTestBehavior.opaque,
                    onPanUpdate: (d) => resize(d, dh: true),
                    onPanEnd: (_) => uiStyles.flush(),
                    child: _pill(pc, true),
                  ),
                ),
                Positioned(
                  right: 0,
                  bottom: 0,
                  width: 34,
                  height: 34,
                  child: GestureDetector(
                    behavior: HitTestBehavior.opaque,
                    onPanUpdate: (d) => resize(d, dw: true, dh: true),
                    onPanEnd: (_) => uiStyles.flush(),
                    child: Container(
                      decoration: BoxDecoration(
                          color: pc,
                          borderRadius: const BorderRadius.only(
                              topLeft: Radius.circular(12), bottomRight: Radius.circular(20))),
                      child: const Icon(Icons.open_in_full, size: 16, color: Colors.white),
                    ),
                  ),
                ),
              ]);
            }

            // بوم آزاد سه کادر خانه: هر کادر x, y, عرض و ارتفاع مستقل دارد
            Widget _canvas(BuildContext c, int rec, int pay, int net) {
              return LayoutBuilder(builder: (c, bc) {
                final w = bc.maxWidth;
                var bottom = 0.0;
                final kids = <Widget>[];
                for (final k in const ['hero', 'loans', 'cheques']) {
                  final r = uiStyles.rect(k);
                  bottom = math.max(bottom, r[1] + r[3]);
                  final content = k == 'hero' ? _hero(c, rec, pay, net) : _bigFor(c, k);
                  kids.add(Positioned(
                    left: r[0] * w,
                    top: r[1],
                    width: r[2] * w,
                    height: r[3],
                    child: editing
                        ? _editable(c, k, w, content)
                        : HoldDetector(onHold: _enterEdit, child: content),
                  ));
                }
                return SizedBox(height: bottom, child: Stack(clipBehavior: Clip.none, children: kids));
              });
            }

            @override
            Widget build(BuildContext context) {
              return ListenableBuilder(
                listenable: Listenable.merge([store, unit, calendarMode, uiStyles]),
                builder: (c, _) {
                  final open = store.accs.where((a) => !a.settled).toList();
                  final rec = open.where((a) => a.isRec).fold<int>(0, (s, a) => s + a.remaining);
                  final pay = open.where((a) => !a.isRec).fold<int>(0, (s, a) => s + a.remaining);
                  final net = rec - pay;
                  final notes = _noteItems(c);

                  final rows = store.contacts.map((p) => MapEntry(p, netOf('${p['id']}'))).toList()
                    ..sort((x, y) => y.value.abs().compareTo(x.value.abs()));

                  final tt = Theme.of(c).textTheme;
                  return GlassBg(
                    keys: const ['home_hero', 'home_loans', 'home_cheques'],
                    child: RefreshIndicator(
                    onRefresh: store.load,
                    child: ListView(
                      physics: editing
                          ? const NeverScrollableScrollPhysics()
                          : const AlwaysScrollableScrollPhysics(),
                      padding: const EdgeInsets.fromLTRB(16, 12, 16, 100),
                      children: [
                        Row(children: [
                          Container(
                            width: 44,
                            height: 44,
                            decoration: BoxDecoration(
                                color: _kNavy.withValues(alpha: .12),
                                borderRadius: BorderRadius.circular(12)),
                            child: const Icon(Icons.calendar_month_rounded, color: _kNavy),
                          ),
                          const SizedBox(width: 10),
                          Expanded(
                              child: Text(_today(),
                                  maxLines: 1,
                                  overflow: TextOverflow.ellipsis,
                                  style: tt.titleSmall?.copyWith(fontWeight: FontWeight.bold))),
                          _topBtn(
                              c,
                              'پیام جدید',
                              Stack(clipBehavior: Clip.none, children: [
                                const Icon(Icons.notifications_none_rounded, size: 22),
                                if (notes.isNotEmpty)
                                  Positioned(
                                      top: -1,
                                      right: -1,
                                      child: Container(
                                          width: 9,
                                          height: 9,
                                          decoration: const BoxDecoration(
                                              color: Color(0xFFE5484D), shape: BoxShape.circle))),
                              ]),
                              () => _notes(c, notes)),
                          const SizedBox(width: 8),
                          _topBtn(
                              c,
                              'ذخیره آنلاین',
                              saving
                                  ? const SizedBox(
                                      width: 18, height: 18, child: CircularProgressIndicator(strokeWidth: 2))
                                  : const Icon(Icons.sync_rounded, size: 22),
                              saving ? null : () => _save(c)),
                        ]),
                        const SizedBox(height: 14),
                        offlineBanner(c),
                        if (editing) _editBar(c),
                        _canvas(c, rec, pay, net),
                        const SizedBox(height: 14),
                        if (rows.isEmpty) emptyBox('شخصی ثبت نشده است'),
                        ...rows.map((e) {
                          final p = e.key, n = e.value;
                          final col = n > 0 ? _kBlue : (n < 0 ? _kRose : Colors.grey);
                          final name = '${p['name']}';
                          return cardBox(
