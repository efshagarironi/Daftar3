          class _DashboardPageState extends State<DashboardPage> {
            bool saving = false;
            bool editing = false;
            DateTime? _editAt;

            bool get _recentEdit =>
                _editAt != null && DateTime.now().difference(_editAt!).inMilliseconds < 900;

            VoidCallback _guard(VoidCallback f) => () {
                  if (_recentEdit) return;
                  f();
                };

            void _enterEdit() {
              if (editing) return;
              setState(() {
                editing = true;
                _editAt = DateTime.now();
              });
            }

            static const _wd = ['دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنجشنبه', 'جمعه', 'شنبه', 'یکشنبه'];

            String _today() {
              final n = DateTime.now();
              return isJalali ? '${_wd[n.weekday - 1]} ${fmtDate(n)}' : fmtDate(n);
            }

            void _open(BuildContext c, Widget page) =>
                Navigator.push(c, MaterialPageRoute(builder: (_) => page));

            // لیست طلب‌ها یا بدهی‌ها
            void _list(BuildContext c, String type) => _open(
                c,
                GlassFrame(
                    keys: const ['acc_search', 'acc_chip', 'acc_card'],
                    child: Scaffold(
                  appBar: AppBar(title: Text(type == 'rec' ? 'طلبکاری‌ها' : 'بدهکاری‌ها')),
                  floatingActionButton: FloatingActionButton.extended(
                      onPressed: () => openAccountForm(c),
                      icon: const Icon(Icons.add),
                      label: const Text('ثبت حساب')),
                  body: SafeArea(child: AccountsPage(initType: type)),
                )));

            Future<void> _save(BuildContext c) async {
              if (saving) return;
              setState(() => saving = true);
              final ok = await run(c, () async {
                await createBackup();
                await pruneBackups(30);
              }, reload: false);
              if (!mounted) return;
              setState(() => saving = false);
              if (ok) toast(context, 'نسخه پشتیبان ابری ساخته شد');
            }

            // یادآوری‌ها: سررسید حساب‌ها، اقساط وام و چک‌ها (تا ۱۴ روز آینده و معوق)
            List<Widget> _noteItems(BuildContext c) {
              final today = _today0();
              bool soon(DateTime? d) => d != null && d.difference(today).inDays <= 14;
              final items = <Widget>[];
              final dueAccs = store.accs.where((a) => !a.settled && soon(a.due)).toList()
                ..sort((x, y) => x.due!.compareTo(y.due!));
              for (final a in dueAccs) {
                items.add(AccTile(a));
              }
              for (final l in store.loans) {
                final i = l.next;
                if (i != null && soon(Loan.dueOf(i))) {
                  final isLate = Loan.dueOf(i)!.isBefore(today);
                  items.add(card(
                    c,
                    Row(children: [
                      Icon(Icons.event_note, color: isLate ? cPay : cLoan),
                      const SizedBox(width: 12),
                      Expanded(
                          child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                        Text('قسط ${faDigits('${i['number']}')} — ${l.title}',
                            maxLines: 1, overflow: TextOverflow.ellipsis),
                        Text('${isLate ? 'معوق از' : 'سررسید'}: ${fmtDate(Loan.dueOf(i)!)}',
                            style: TextStyle(fontSize: 12, color: isLate ? cPay : null)),
                      ])),
                      Text(money(Loan.amt(i)), style: const TextStyle(fontWeight: FontWeight.bold)),
                    ]),
                    onTap: () => _open(c, LoanDetailPage(l.id)),
                  ));
                }
              }
              for (final x in store.cheques) {
                if (x.pending && !x.guarantee && soon(x.due)) {
                  items.add(card(
                    c,
                    Row(children: [
                      Icon(Icons.receipt_long, color: x.overdue ? cPay : cWarn),
                      const SizedBox(width: 12),
                      Expanded(
                          child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                        Text(
                            '${x.received ? 'چک دریافتی' : 'چک پرداختی'}${x.who.isEmpty ? '' : ' — ${x.who}'}',
                            maxLines: 1,
                            overflow: TextOverflow.ellipsis),
                        Text('${x.overdue ? 'سررسید گذشته' : 'سررسید'}: ${fmtDate(x.due!)}',
                            style: TextStyle(fontSize: 12, color: x.overdue ? cPay : null)),
                      ])),
                      Text(money(x.amount), style: const TextStyle(fontWeight: FontWeight.bold)),
                    ]),
                    onTap: () => _open(c, ChequeDetailPage(x.id)),
                  ));
                }
              }
              return items;
            }

