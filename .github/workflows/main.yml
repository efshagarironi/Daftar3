          /// نگه‌داشتن انگشت (پیش‌فرض ۲ ثانیه) روی ویجت
          class HoldDetector extends StatefulWidget {
            final Widget child;
            final VoidCallback onHold;
            final Duration duration;
            const HoldDetector(
                {super.key,
                required this.child,
                required this.onHold,
                this.duration = const Duration(seconds: 2)});
            @override
            State<HoldDetector> createState() => _HoldDetectorState();
          }

          class _HoldDetectorState extends State<HoldDetector> {
            Timer? _t;
            Offset? _p0;

            @override
            void dispose() {
              _t?.cancel();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Listener(
                behavior: HitTestBehavior.translucent,
                onPointerDown: (e) {
                  _p0 = e.position;
                  _t?.cancel();
                  _t = Timer(widget.duration, widget.onHold);
                },
                onPointerMove: (e) {
                  if (_p0 != null && (e.position - _p0!).distance > 14) _t?.cancel();
                },
                onPointerUp: (_) => _t?.cancel(),
                onPointerCancel: (_) => _t?.cancel(),
                child: widget.child,
              );
            }
          }

