name: Build HesabYar APK

# حساب‌یار: ساخت خودکار پروژه Flutter + APK (فقط همین یک فایل لازم است)
# مسیر فایل در ریپازیتوری: .github/workflows/main.yml
# پیش‌نیاز: در Settings > Secrets and variables > Actions دو Secret بسازید:
#   SUPABASE_URL  و  SUPABASE_ANON_KEY
# کلید امضا داخل همین فایل است؛ نیازی به Secret اضافه نیست.
# (فقط anon key؛ هرگز service_role را اینجا نگذارید)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter project and write source files
        run: |
          set -euo pipefail
          flutter create --org com.hesabyar --project-name hesabyar --platforms android .
          rm -rf test
          mkdir -p supabase
          cat > pubspec.yaml <<'PUBSPEC_EOF'
          name: hesabyar
          description: Debt and receivables manager with cloud backup
          publish_to: none
          version: 1.0.0+1
          environment:
            sdk: ">=3.3.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            supabase_flutter: ^2.8.0
            google_fonts: ^6.2.1
            shared_preferences: ^2.3.2
            path_provider: ^2.1.4
            share_plus: ^10.1.4
            crypto: ^3.0.5
            local_auth: ^2.3.0
          dev_dependencies:
            flutter_test:
              sdk: flutter
          flutter:
            uses-material-design: true
          PUBSPEC_EOF
          cat > lib/main.dart <<'MAIN_EOF'
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:flutter_localizations/flutter_localizations.dart';
          import 'package:google_fonts/google_fonts.dart';
          import 'package:supabase_flutter/supabase_flutter.dart';
          import 'data.dart';
          import 'screens.dart';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setEnabledSystemUIMode(SystemUiMode.edgeToEdge);
            await loadCalendarPref();
            await loadLockPref();
            await loadCustomLock();
            await uiStyles.load();
            if (kConfigured) {
              await Supabase.initialize(url: kUrl, anonKey: kKey);
            }
            runApp(const HesabYarApp());
          }

          class HesabYarApp extends StatelessWidget {
            const HesabYarApp({super.key});

            ThemeData _theme(Brightness b) {
              final cs = ColorScheme.fromSeed(
                  seedColor: const Color(0xFF0E7C86), brightness: b);
              final base = ThemeData(useMaterial3: true, colorScheme: cs);
              return base.copyWith(
                textTheme: GoogleFonts.vazirmatnTextTheme(base.textTheme),
                scaffoldBackgroundColor:
                    b == Brightness.light ? const Color(0xFFF3F7F8) : null,
                appBarTheme: const AppBarTheme(
                    scrolledUnderElevation: 0, backgroundColor: Colors.transparent),
              );
            }

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'حساب‌یار',
                debugShowCheckedModeBanner: false,
                locale: const Locale('fa'),
                supportedLocales: const [Locale('fa')],
                localizationsDelegates: const [
                  GlobalMaterialLocalizations.delegate,
                  GlobalWidgetsLocalizations.delegate,
                  GlobalCupertinoLocalizations.delegate,
                ],
                theme: _theme(Brightness.light),
                darkTheme: _theme(Brightness.dark),
                builder: (context, child) =>
                    AppLockGate(child: child ?? const SizedBox.shrink()),
                home: const Root(),
              );
            }
          }

          class Root extends StatelessWidget {
            const Root({super.key});

            @override
            Widget build(BuildContext context) {
              if (!kConfigured) return const SetupPage();
              return StreamBuilder<AuthState>(
                stream: sb.auth.onAuthStateChange,
                builder: (context, snap) {
                  final s = sb.auth.currentSession;
                  if (s == null) return const AuthPage();
                  return Home(key: ValueKey(s.user.id));
                },
              );
            }
          }
          MAIN_EOF
          cat > lib/data.dart <<'DATA_EOF'
          import 'dart:convert';
          import 'dart:typed_data';
          import 'package:crypto/crypto.dart';
          import 'package:flutter/foundation.dart';
          import 'package:local_auth/local_auth.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:supabase_flutter/supabase_flutter.dart';
          import 'screens.dart';

          const kUrl = String.fromEnvironment('SUPABASE_URL');
          const kKey = String.fromEnvironment('SUPABASE_ANON_KEY');
          bool get kConfigured => kUrl.isNotEmpty && kKey.isNotEmpty;
          SupabaseClient get sb => Supabase.instance.client;
          String uid() => sb.auth.currentUser!.id;

          final unit = ValueNotifier<String>('تومان');
          String profileName = '';

          // ---------- calendar (jalali / gregorian) ----------
          // نوع تقویم پیش‌فرض: 'jalali' (شمسی) یا 'gregorian' (میلادی). روی همین دستگاه ذخیره می‌شود.
          final calendarMode = ValueNotifier<String>('jalali');
          bool get isJalali => calendarMode.value == 'jalali';

          Future<void> loadCalendarPref() async {
            try {
              final p = await SharedPreferences.getInstance();
              final v = p.getString('calendar');
              if (v == 'jalali' || v == 'gregorian') calendarMode.value = v!;
            } catch (_) {}
          }

          Future<void> setCalendar(String v) async {
            calendarMode.value = v;
            store.refreshUI();
            try {
              final p = await SharedPreferences.getInstance();
              await p.setString('calendar', v);
            } catch (_) {}
          }

          // ---------- app lock (قفل ورود: رمز / الگو / اثر انگشت / چهره‌ی خود دستگاه) ----------
          final appLockEnabled = ValueNotifier<bool>(false);
          final lockDelay = ValueNotifier<int>(0); // ثانیه؛ 0 = بلافاصله بعد از خروج از برنامه
          final LocalAuthentication _la = LocalAuthentication();
          bool authBusy = false; // هنگام نمایش پنجرهٔ تأیید هویت، قفل خودکار نباید فعال شود

          Future<void> loadLockPref() async {
            try {
              final p = await SharedPreferences.getInstance();
              appLockEnabled.value = p.getBool('app_lock') ?? false;
              lockDelay.value = p.getInt('lock_delay') ?? 0;
            } catch (_) {}
          }

          Future<void> setAppLock(bool v) async {
            appLockEnabled.value = v;
            try {
              final p = await SharedPreferences.getInstance();
              await p.setBool('app_lock', v);
            } catch (_) {}
          }

          Future<void> setLockDelay(int sec) async {
            lockDelay.value = sec;
            try {
              final p = await SharedPreferences.getInstance();
              await p.setInt('lock_delay', sec);
            } catch (_) {}
          }

          Future<bool> deviceCanLock() async {
            try {
              return await _la.isDeviceSupported();
            } catch (_) {
              return false;
            }
          }

          Future<bool> authenticateUser(String reason) async {
            authBusy = true;
            try {
              return await _la.authenticate(
                localizedReason: reason,
                options: const AuthenticationOptions(biometricOnly: false, stickyAuth: true),
              );
            } catch (_) {
              return false;
            } finally {
              authBusy = false;
            }
          }
          const jalaliMonths = [
            'فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور',
            'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'
          ];

          // تبدیل میلادی ← شمسی؛ خروجی [سال، ماه، روز]
          List<int> toJalali(DateTime d) {
            const gdm = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
            final gy = d.year, gm = d.month, gd = d.day;
            final gy2 = gm > 2 ? gy + 1 : gy;
            var days = 355666 +
                (365 * gy) +
                ((gy2 + 3) ~/ 4) -
                ((gy2 + 99) ~/ 100) +
                ((gy2 + 399) ~/ 400) +
                gd +
                gdm[gm - 1];
            var jy = -1595 + (33 * (days ~/ 12053));
            days %= 12053;
            jy += 4 * (days ~/ 1461);
            days %= 1461;
            if (days > 365) {
              jy += (days - 1) ~/ 365;
              days = (days - 1) % 365;
            }
            int jm, jd;
            if (days < 186) {
              jm = 1 + days ~/ 31;
              jd = 1 + days % 31;
            } else {
              jm = 7 + (days - 186) ~/ 30;
              jd = 1 + (days - 186) % 30;
            }
            return [jy, jm, jd];
          }

          // تبدیل شمسی ← میلادی (DateTime در نیمه‌شب)
          DateTime jalaliToDate(int jy0, int jm, int jd) {
            final jy = jy0 + 1595;
            var days = -355668 +
                (365 * jy) +
                ((jy ~/ 33) * 8) +
                (((jy % 33) + 3) ~/ 4) +
                jd +
                (jm < 7 ? (jm - 1) * 31 : ((jm - 7) * 30) + 186);
            var gy = 400 * (days ~/ 146097);
            days %= 146097;
            if (days > 36524) {
              days -= 1;
              gy += 100 * (days ~/ 36524);
              days %= 36524;
              if (days >= 365) days += 1;
            }
            gy += 4 * (days ~/ 1461);
            days %= 1461;
            if (days > 365) {
              gy += (days - 1) ~/ 365;
              days = (days - 1) % 365;
            }
            var gd = days + 1;
            final leap = (gy % 4 == 0 && gy % 100 != 0) || gy % 400 == 0;
            final sal = [0, 31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
            var gm = 0;
            while (gm < 13 && gd > sal[gm]) {
              gd -= sal[gm];
              gm++;
            }
            return DateTime(gy, gm, gd);
          }

          int jalaliMonthLength(int jy, int jm) {
            if (jm <= 6) return 31;
            if (jm <= 11) return 30;
            final j = toJalali(jalaliToDate(jy, 12, 30));
            return (j[0] == jy && j[1] == 12 && j[2] == 30) ? 30 : 29;
          }

          // ---------- formatting ----------
          String faDigits(String s) {
            var o = s;
            for (var i = 0; i < 10; i++) {
              o = o.replaceAll('$i', String.fromCharCode(0x06F0 + i));
            }
            return o;
          }

          int? parseAmount(String s) {
            var t = s.trim();
            for (var i = 0; i < 10; i++) {
              t = t
                  .replaceAll(String.fromCharCode(0x06F0 + i), '$i')
                  .replaceAll(String.fromCharCode(0x0660 + i), '$i');
            }
            t = t.replaceAll(RegExp(r'[,،٬\s]'), '');
            return int.tryParse(t);
          }

          String group(int v) => v
              .toString()
              .replaceAllMapped(RegExp(r'\B(?=(\d{3})+(?!\d))'), (m) => '٬');
          String money(int v) => '${faDigits(group(v))} ${unit.value}';
          String _p2(int n) => n.toString().padLeft(2, '0');
          String ymd(DateTime d) => '${d.year}-${_p2(d.month)}-${_p2(d.day)}';
          String fmtDate(DateTime d) {
            if (isJalali) {
              final j = toJalali(d);
              return faDigits('${j[0]}/${_p2(j[1])}/${_p2(j[2])}');
            }
            return faDigits('${d.year}/${_p2(d.month)}/${_p2(d.day)}');
          }

          // ---------- model ----------
          class Acc {
            final Map<String, dynamic> m;
            Acc(this.m);
            String get id => m['id'] as String;
            String get contactId => m['contact_id'] as String;
            String get title => (m['title'] ?? '') as String;
            bool get isRec => m['type'] == 'receivable';
            int get principal => (m['principal_amount'] as num).toInt();
            List<dynamic> get txs => (m['transactions'] as List<dynamic>?) ?? [];
            int get paid => txs.fold<int>(0, (s, t) => s + (t['amount'] as num).toInt());
            int get remaining => principal - paid;
            bool get settled => remaining <= 0;
            String get who => ((m['contacts'] as Map?)?['name'] ?? '') as String;
            DateTime? get due =>
                m['due_at'] == null ? null : DateTime.tryParse(m['due_at'] as String);
            DateTime? get opened => DateTime.tryParse(
                (m['opened_at'] ?? m['created_at'] ?? '') as String);
          }

          // ---------- store (online-first, read-only offline cache) ----------
          class Store extends ChangeNotifier {
            List<Map<String, dynamic>> rawAccs = [];
            List<Map<String, dynamic>> contacts = [];
            List<Map<String, dynamic>> rawLoans = [];
            List<Map<String, dynamic>> rawCheques = [];
            bool loading = false;
            bool offline = false;
            List<Acc> get accs => rawAccs.map(Acc.new).toList();
            List<Loan> get loans => rawLoans.map(Loan.new).toList();
            List<Cheque> get cheques => rawCheques.map(Cheque.new).toList();

            void refreshUI() => notifyListeners();

            Future<void> load() async {
              loading = true;
              notifyListeners();
              final p = await SharedPreferences.getInstance();
              final key = 'cache_${uid()}';
              try {
                final c = await sb
                    .from('contacts')
                    .select()
                    .isFilter('archived_at', null)
                    .order('name');
                final a = await sb
                    .from('accounts')
                    .select('*, contacts(name), transactions(id,amount,transaction_date,note)')
                    .order('created_at', ascending: false);
                contacts = List<Map<String, dynamic>>.from(c);
                rawAccs = List<Map<String, dynamic>>.from(a);
                // وام و چک: اگر جدول‌ها هنوز در Supabase ساخته نشده باشند، بقیهٔ برنامه عادی کار می‌کند
                try {
                  final l = await sb
                      .from('loans')
                      .select('*, loan_installments(*)')
                      .order('created_at', ascending: false);
                  rawLoans = List<Map<String, dynamic>>.from(l);
                } catch (_) {
                  rawLoans = [];
                }
                try {
                  final h = await sb
                      .from('cheques')
                      .select('*, contacts(name)')
                      .order('created_at', ascending: false);
                  rawCheques = List<Map<String, dynamic>>.from(h);
                } catch (_) {
                  rawCheques = [];
                }
                offline = false;
                await p.setString(
                    key, jsonEncode({'c': contacts, 'a': rawAccs, 'l': rawLoans, 'h': rawCheques}));
              } catch (e) {
                offline = true;
                final s = p.getString(key);
                if (s != null) {
                  final j = jsonDecode(s);
                  contacts = List<Map<String, dynamic>>.from(j['c']);
                  rawAccs = List<Map<String, dynamic>>.from(j['a']);
                  rawLoans = List<Map<String, dynamic>>.from(j['l'] ?? []);
                  rawCheques = List<Map<String, dynamic>>.from(j['h'] ?? []);
                }
              }
              loading = false;
              notifyListeners();
            }

            Future<void> clear() async {
              rawAccs = [];
              rawLoans = [];
              rawCheques = [];
              contacts = [];
              final p = await SharedPreferences.getInstance();
              for (final k in p.getKeys().where((k) => k.startsWith('cache_')).toList()) {
                await p.remove(k);
              }
              notifyListeners();
            }
          }

          final store = Store();

          Future<void> loadProfile() async {
            try {
              final r = await sb.from('profiles').select().maybeSingle();
              if (r != null) {
                unit.value = (r['currency_unit'] ?? 'تومان') as String;
                profileName = (r['display_name'] ?? '') as String;
              }
            } catch (_) {}
          }

          // ---------- backup ----------
          Future<List<Map<String, dynamic>>> fetchAll(String table) async {
            final out = <Map<String, dynamic>>[];
            var from = 0;
            while (true) {
              final r = await sb
                  .from(table)
                  .select()
                  .order('created_at')
                  .order('id')
                  .range(from, from + 999);
              out.addAll(List<Map<String, dynamic>>.from(r));
              if (r.length < 1000) break;
              from += 1000;
            }
            return out;
          }

          Future<List<Map<String, dynamic>>> fetchAllSafe(String table) async {
            try {
              return await fetchAll(table);
            } catch (_) {
              return [];
            }
          }

          Future<Map<String, dynamic>> snapshot() async {
            final data = {
              'contacts': await fetchAll('contacts'),
              'accounts': await fetchAll('accounts'),
              'transactions': await fetchAll('transactions'),
              'loans': await fetchAllSafe('loans'),
              'loan_installments': await fetchAllSafe('loan_installments'),
              'cheques': await fetchAllSafe('cheques'),
            };
            final checksum = sha256.convert(utf8.encode(jsonEncode(data))).toString();
            return {
              'app': 'hesabyar',
              'format_version': 1,
              'created_at': DateTime.now().toUtc().toIso8601String(),
              'checksum': checksum,
              'data': data,
            };
          }

          Future<void> createBackup() async {
            final snap = await snapshot();
            final bytes = Uint8List.fromList(utf8.encode(jsonEncode(snap)));
            final path = '${uid()}/backup_${DateTime.now().toUtc().millisecondsSinceEpoch}.json';
            await sb.storage.from('backups').uploadBinary(path, bytes,
                fileOptions: const FileOptions(contentType: 'application/json'));
            await sb.from('backup_records').insert({
              'user_id': uid(),
              'storage_path': path,
              'format_version': 1,
              'file_size': bytes.length,
              'checksum': snap['checksum'],
              'status': 'ok',
            });
          }

          Future<Map<String, dynamic>> readBackup(String path) async {
            final bytes = await sb.storage.from('backups').download(path);
            final j = jsonDecode(utf8.decode(bytes)) as Map<String, dynamic>;
            if (j['format_version'] != 1 || j['data'] == null) {
              throw 'فرمت فایل پشتیبان پشتیبانی نمی‌شود';
            }
            final sum = sha256.convert(utf8.encode(jsonEncode(j['data']))).toString();
            if (sum != j['checksum']) throw 'فایل پشتیبان خراب یا دستکاری شده است';
            return j;
          }

          Future<void> pruneBackups(int keep) async {
            final r = await sb
                .from('backup_records')
                .select('id,storage_path')
                .order('created_at', ascending: false)
                .range(keep, keep + 200);
            final old = List<Map<String, dynamic>>.from(r);
            if (old.isEmpty) return;
            await sb.storage
                .from('backups')
                .remove(old.map((e) => e['storage_path'] as String).toList());
            await sb
                .from('backup_records')
                .delete()
                .inFilter('id', old.map((e) => e['id']).toList());
          }

          Future<void> autoBackupIfDue() async {
            try {
              final p = await SharedPreferences.getInstance();
              if (!(p.getBool('auto_backup') ?? false)) return;
              final r = await sb
                  .from('backup_records')
                  .select('created_at')
                  .order('created_at', ascending: false)
                  .limit(1);
              if (r.isNotEmpty) {
                final last = DateTime.parse(r.first['created_at'] as String).toLocal();
                if (DateTime.now().difference(last).inHours < 24) return;
              }
              await createBackup();
              await pruneBackups(10);
            } catch (_) {}
          }
          DATA_EOF
          cat > lib/screens.dart <<'SCREENS_EOF'
          import 'dart:convert';
          import 'dart:async';
          import 'dart:io';
          import 'dart:math' as math;
          import 'dart:ui' show ImageFilter;
          import 'package:crypto/crypto.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:share_plus/share_plus.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:supabase_flutter/supabase_flutter.dart';
          import 'data.dart';

          const cRec = Color(0xFF16A37F);
          const cPay = Color(0xFFE5484D);
          const cBrand = Color(0xFF0E7C86);

          // ---------- helpers ----------
          void toast(BuildContext c, String m) => ScaffoldMessenger.of(c).showSnackBar(
              SnackBar(content: Text(m), behavior: SnackBarBehavior.floating));

          Future<bool> confirm(BuildContext c, String title, String body,
                  {String ok = 'تأیید'}) async =>
              await showDialog<bool>(
                  context: c,
                  builder: (ctx) => AlertDialog(
                        title: Text(title),
                        content: Text(body),
                        actions: [
                          TextButton(
                              onPressed: () => Navigator.pop(ctx, false),
                              child: const Text('انصراف')),
                          FilledButton(
                              onPressed: () => Navigator.pop(ctx, true), child: Text(ok)),
                        ],
                      )) ??
              false;

          InputDecoration deco(String l, {IconData? icon}) => InputDecoration(
                labelText: l,
                prefixIcon: icon == null ? null : Icon(icon),
                filled: true,
                border: OutlineInputBorder(
                    borderRadius: BorderRadius.circular(16), borderSide: BorderSide.none),
              );

          Future<bool> run(BuildContext c, Future<void> Function() f,
              {bool reload = true}) async {
            final m = ScaffoldMessenger.of(c);
            void msg(String t) => m.showSnackBar(
                SnackBar(content: Text(t), behavior: SnackBarBehavior.floating));
            try {
              await f();
              if (reload) await store.load();
              return true;
            } on PostgrestException catch (e) {
              msg('خطا: ${e.message}');
            } on AuthException catch (e) {
              msg(e.message);
            } on StorageException catch (e) {
              msg('خطای فضای ذخیره: ${e.message}');
            } catch (e) {
              msg(e is String ? e : 'اتصال برقرار نیست یا خطایی رخ داد');
            }
            return false;
          }

          Widget card(BuildContext c, Widget child,
              {VoidCallback? onTap, EdgeInsets pad = const EdgeInsets.all(16)}) {
            return Padding(
              padding: const EdgeInsets.only(bottom: 12),
              child: Material(
                color: Theme.of(c).colorScheme.surfaceContainerLow,
                borderRadius: BorderRadius.circular(20),
                child: InkWell(
                  borderRadius: BorderRadius.circular(20),
                  onTap: onTap,
                  child: Padding(padding: pad, child: child),
                ),
              ),
            );
          }

          Widget sec(BuildContext c, String t) => Padding(
                padding: const EdgeInsets.fromLTRB(4, 16, 4, 8),
                child: Text(t,
                    style: Theme.of(c)
                        .textTheme
                        .titleMedium
                        ?.copyWith(fontWeight: FontWeight.bold)),
              );

          Widget emptyBox(String t) => Padding(
                padding: const EdgeInsets.all(32),
                child: Center(child: Text(t, textAlign: TextAlign.center)),
              );

          Color accColor(Acc a) => a.isRec ? cRec : cPay;

          // ---------- date pickers (follow the default calendar) ----------
          Future<DateTime?> pickDate(BuildContext c, DateTime init, {String help = 'انتخاب تاریخ'}) {
            if (isJalali) {
              return showDialog<DateTime>(
                  context: c, builder: (_) => JalaliPickerDialog(initial: init, help: help));
            }
            return showDatePicker(
                context: c,
                initialDate: init,
                firstDate: DateTime(2000),
                lastDate: DateTime(2100),
                helpText: help);
          }

          Future<DateTimeRange?> pickRange(BuildContext c) async {
            if (!isJalali) {
              return showDateRangePicker(
                  context: c, firstDate: DateTime(2000), lastDate: DateTime(2100));
            }
            final s = await pickDate(c, DateTime.now(), help: 'تاریخ شروع');
            if (s == null || !c.mounted) return null;
            final e = await pickDate(c, s, help: 'تاریخ پایان');
            if (e == null) return null;
            return e.isBefore(s) ? DateTimeRange(start: e, end: s) : DateTimeRange(start: s, end: e);
          }

          class JalaliPickerDialog extends StatefulWidget {
            final DateTime initial;
            final String help;
            const JalaliPickerDialog({super.key, required this.initial, required this.help});
            @override
            State<JalaliPickerDialog> createState() => _JalaliPickerDialogState();
          }

          class _JalaliPickerDialogState extends State<JalaliPickerDialog> {
            late int y, m; // ماه در حال نمایش
            late int sy, sm, sd; // روز انتخاب‌شده

            @override
            void initState() {
              super.initState();
              final j = toJalali(widget.initial);
              sy = y = j[0];
              sm = m = j[1];
              sd = j[2];
            }

            void _shift(int delta) {
              var nm = m + delta, ny = y;
              if (nm > 12) {
                nm = 1;
                ny++;
              } else if (nm < 1) {
                nm = 12;
                ny--;
              }
              setState(() {
                y = ny;
                m = nm;
              });
            }

            @override
            Widget build(BuildContext context) {
              final cs = Theme.of(context).colorScheme;
              final t = toJalali(DateTime.now());
              final len = jalaliMonthLength(y, m);
              // شنبه = ستون اول
              final offset = (jalaliToDate(y, m, 1).weekday + 1) % 7;
              final y0 = (t[0] - 60 < y ? t[0] - 60 : y), y1 = (t[0] + 40 > y ? t[0] + 40 : y);
              const wd = ['ش', 'ی', 'د', 'س', 'چ', 'پ', 'ج'];
              final cells = <Widget>[
                for (var i = 0; i < offset; i++) const SizedBox.shrink(),
                for (var day = 1; day <= len; day++)
                  Padding(
                    padding: const EdgeInsets.all(2),
                    child: InkWell(
                      customBorder: const CircleBorder(),
                      onTap: () => setState(() {
                        sy = y;
                        sm = m;
                        sd = day;
                      }),
                      child: Container(
                        alignment: Alignment.center,
                        decoration: BoxDecoration(
                          shape: BoxShape.circle,
                          color: (y == sy && m == sm && day == sd) ? cs.primary : null,
                          border: (y == t[0] && m == t[1] && day == t[2] && !(y == sy && m == sm && day == sd))
                              ? Border.all(color: cs.primary)
                              : null,
                        ),
                        child: Text(faDigits('$day'),
                            style: TextStyle(
                                color: (y == sy && m == sm && day == sd) ? cs.onPrimary : null)),
                      ),
                    ),
                  ),
              ];
              return AlertDialog(
                title: Text(widget.help),
                content: SizedBox(
                  width: double.maxFinite,
                  child: SingleChildScrollView(
                    child: Column(mainAxisSize: MainAxisSize.min, children: [
                      Row(children: [
                        IconButton(icon: const Icon(Icons.chevron_left), onPressed: () => _shift(-1)),
                        Expanded(
                          child: Row(mainAxisAlignment: MainAxisAlignment.center, children: [
                            DropdownButton<int>(
                              value: m,
                              underline: const SizedBox.shrink(),
                              items: [
                                for (var i = 1; i <= 12; i++)
                                  DropdownMenuItem(value: i, child: Text(jalaliMonths[i - 1]))
                              ],
                              onChanged: (v) => setState(() => m = v ?? m),
                            ),
                            const SizedBox(width: 8),
                            DropdownButton<int>(
                              value: y,
                              underline: const SizedBox.shrink(),
                              items: [
                                for (var i = y0; i <= y1; i++)
                                  DropdownMenuItem(value: i, child: Text(faDigits('$i')))
                              ],
                              onChanged: (v) => setState(() => y = v ?? y),
                            ),
                          ]),
                        ),
                        IconButton(icon: const Icon(Icons.chevron_right), onPressed: () => _shift(1)),
                      ]),
                      Row(children: [
                        for (final w in wd)
                          Expanded(
                              child: Center(
                                  child: Text(w,
                                      style: TextStyle(
                                          color: w == 'ج' ? cPay : null, fontWeight: FontWeight.bold))))
                      ]),
                      const SizedBox(height: 4),
                      GridView.count(
                        crossAxisCount: 7,
                        shrinkWrap: true,
                        physics: const NeverScrollableScrollPhysics(),
                        children: cells,
                      ),
                    ]),
                  ),
                ),
                actions: [
                  TextButton(
                      onPressed: () => setState(() {
                            sy = y = t[0];
                            sm = m = t[1];
                            sd = t[2];
                          }),
                      child: const Text('امروز')),
                  TextButton(onPressed: () => Navigator.pop(context), child: const Text('انصراف')),
                  FilledButton(
                      onPressed: () => Navigator.pop(context, jalaliToDate(sy, sm, sd)),
                      child: const Text('تأیید')),
                ],
              );
            }
          }

          int netOf(String cid) {
            var s = 0;
            for (final a in store.accs) {
              if (a.contactId == cid && !a.settled) s += a.isRec ? a.remaining : -a.remaining;
            }
            return s;
          }

