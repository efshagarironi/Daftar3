          class _LockSetupPageState extends State<LockSetupPage> {
            final a = TextEditingController(), b = TextEditingController();
            String? first;
            bool bad = false;
            String msg = '';

            @override
            void dispose() {
              a.dispose();
              b.dispose();
              super.dispose();
            }

            Future<void> _done(String secret) async {
              await setCustomLock(widget.type, secret);
              if (!mounted) return;
              toast(context, widget.type == 'pin' ? 'رمز برنامه تنظیم شد' : 'الگوی برنامه تنظیم شد');
              Navigator.pop(context);
            }

            void _savePin() {
              if (a.text.length < 4) {
                toast(context, 'رمز باید حداقل ۴ کاراکتر باشد');
                return;
              }
              if (a.text != b.text) {
                toast(context, 'رمز و تکرار آن یکسان نیستند');
                return;
              }
              _done(a.text);
            }

            void _pattern(List<int> s) {
              if (s.length < 4) {
                setState(() {
                  bad = true;
                  msg = 'الگو باید حداقل ۴ نقطه داشته باشد';
                  first = null;
                });
                return;
              }
              final v = s.join('-');
              if (first == null) {
                setState(() {
                  first = v;
                  bad = false;
                  msg = 'الگو را برای تأیید دوباره بکشید';
                });
              } else if (first == v) {
                _done(v);
              } else {
                setState(() {
                  first = null;
                  bad = true;
                  msg = 'دو الگو یکسان نبودند؛ از اول بکشید';
                });
              }
            }

            @override
            Widget build(BuildContext context) {
              final pin = widget.type == 'pin';
              return Scaffold(
                appBar: AppBar(title: Text(pin ? 'تنظیم رمز عبور برنامه' : 'تنظیم الگوی برنامه')),
                body: ListView(padding: const EdgeInsets.all(24), children: [
                  if (pin) ...[
                    const Text('یک رمز دلخواه (حداقل ۴ کاراکتر؛ عدد، حرف یا ترکیبی) برای ورود به برنامه انتخاب کنید.'),
                    const SizedBox(height: 16),
                    TextField(
                        controller: a,
                        obscureText: true,
                        decoration: const InputDecoration(border: OutlineInputBorder(), labelText: 'رمز جدید')),
                    const SizedBox(height: 12),
                    TextField(
                        controller: b,
                        obscureText: true,
                        decoration:
                            const InputDecoration(border: OutlineInputBorder(), labelText: 'تکرار رمز')),
                    const SizedBox(height: 20),
                    SizedBox(height: 52, child: FilledButton(onPressed: _savePin, child: const Text('ذخیره رمز'))),
                  ] else ...[
                    Text(msg.isEmpty ? 'یک الگوی دلخواه (حداقل ۴ نقطه) بکشید.' : msg,
                        textAlign: TextAlign.center, style: TextStyle(color: bad ? cPay : null)),
                    const SizedBox(height: 24),
                    Center(child: PatternPad(error: bad, onDone: _pattern)),
                  ],
                ]),
              );
            }
          }

