          // ---------- فرم ثبت/ویرایش چک ----------
          class ChequeFormPage extends StatefulWidget {
            final Cheque? edit;
            final String initDir;
            const ChequeFormPage({super.key, this.edit, this.initDir = 'received'});
            @override
            State<ChequeFormPage> createState() => _ChequeFormPageState();
          }

          class _ChequeFormPageState extends State<ChequeFormPage> {
            late String dir;
            String kind = 'dated';
            String? cid;
            final newName = TextEditingController();
            final number = TextEditingController();
            final sayad = TextEditingController();
            final bank = TextEditingController();
            final branch = TextEditingController();
            final amount = TextEditingController();
            final notes = TextEditingController();
            late DateTime issued;
            DateTime? due;
            bool busy = false;

            @override
            void initState() {
              super.initState();
              final e = widget.edit;
              dir = e == null ? widget.initDir : (e.received ? 'received' : 'issued');
              issued = e?.issued ?? DateTime.now();
              due = e?.due;
              if (e != null) {
                kind = e.guarantee ? 'guarantee' : 'dated';
                cid = e.m['contact_id'] as String?;
                number.text = e.number;
                sayad.text = e.sayad;
                bank.text = e.bank;
                branch.text = e.branch;
                amount.text = '${e.amount}';
                notes.text = '${e.m['notes'] ?? ''}';
              } else if (store.contacts.isEmpty) {
                cid = 'new';
              }
            }

            @override
            void dispose() {
              for (final t in [newName, number, sayad, bank, branch, amount, notes]) {
                t.dispose();
              }
              super.dispose();
            }

            Future<void> save() async {
              final amt = parseAmount(amount.text);
              if (cid == null) {
                toast(context, dir == 'received' ? 'صادرکنندهٔ چک را انتخاب کنید' : 'گیرندهٔ چک را انتخاب کنید');
                return;
              }
              if (cid == 'new' && newName.text.trim().isEmpty) {
                toast(context, 'نام شخص را وارد کنید');
                return;
              }
              if (amt == null || amt <= 0) {
                toast(context, 'مبلغ چک معتبر نیست');
                return;
              }
              if (kind == 'dated' && due == null) {
                toast(context, 'برای چک تاریخ‌دار، تاریخ سررسید را مشخص کنید');
                return;
              }
              final sy = _enDigits(sayad.text);
              if (sy.isNotEmpty && sy.length != 16) {
                toast(context, 'شناسهٔ صیاد باید ۱۶ رقم باشد');
                return;
              }
              setState(() => busy = true);
              final e = widget.edit;
              final ok = await run(context, () async {
                var contact = cid;
                if (contact == 'new') {
                  final r = await sb
                      .from('contacts')
                      .insert({'user_id': uid(), 'name': newName.text.trim()})
                      .select('id')
                      .single();
                  contact = r['id'] as String;
                }
                String? t(TextEditingController x) => x.text.trim().isEmpty ? null : x.text.trim();
                final body = {
                  'contact_id': contact,
                  'direction': dir,
                  'kind': kind,
                  'cheque_number': t(number) == null ? null : _enDigits(number.text),
                  'sayad_id': sy.isEmpty ? null : sy,
                  'bank': t(bank),
                  'branch': t(branch),
                  'amount': amt,
                  'issued_at': ymd(issued),
                  'due_at': due == null ? null : ymd(due!),
                  'notes': t(notes),
                };
                if (e == null) {
                  await sb.from('cheques').insert({...body, 'user_id': uid(), 'status': 'pending', 'currency': unit.value});
                } else {
                  await sb.from('cheques').update(body).eq('id', e.id);
                }
              });
              if (!mounted) return;
              setState(() => busy = false);
              if (ok) Navigator.pop(context);
            }

            @override
            Widget build(BuildContext context) {
              final e = widget.edit;
              return Scaffold(
                appBar: AppBar(title: Text(e == null ? 'ثبت چک جدید' : 'ویرایش چک')),
                body: ListView(padding: const EdgeInsets.all(16), children: [
                  SegmentedButton<String>(
                    segments: const [
                      ButtonSegment(value: 'received', label: Text('چک دریافتی'), icon: Icon(Icons.south_west)),
                      ButtonSegment(value: 'issued', label: Text('چک پرداختی'), icon: Icon(Icons.north_east)),
                    ],
                    selected: {dir},
                    onSelectionChanged: (s) => setState(() => dir = s.first),
                  ),
                  const SizedBox(height: 12),
                  SegmentedButton<String>(
                    segments: const [
                      ButtonSegment(value: 'dated', label: Text('تاریخ‌دار'), icon: Icon(Icons.event)),
                      ButtonSegment(value: 'guarantee', label: Text('ضمانتی'), icon: Icon(Icons.shield_outlined)),
                    ],
                    selected: {kind},
                    onSelectionChanged: (s) => setState(() => kind = s.first),
                  ),
                  const SizedBox(height: 16),
                  DropdownButtonFormField<String>(
                    value: cid,
                    decoration: deco(dir == 'received' ? 'صادرکننده (پرداخت‌کننده)' : 'گیرندهٔ چک',
                        icon: Icons.person_outline),
                    items: [
                      ...store.contacts
                          .map((p) => DropdownMenuItem(value: '${p['id']}', child: Text('${p['name']}'))),
                      const DropdownMenuItem(value: 'new', child: Text('＋ شخص جدید')),
                    ],
                    onChanged: (v) => setState(() => cid = v),
                  ),
                  if (cid == 'new') ...[
                    const SizedBox(height: 12),
                    TextField(controller: newName, decoration: deco('نام شخص جدید')),
                  ],
                  const SizedBox(height: 12),
                  TextField(
                      controller: amount,
                      keyboardType: TextInputType.number,
                      decoration: deco('مبلغ چک (${unit.value})', icon: Icons.payments_outlined)),
                  const SizedBox(height: 12),
                  TextField(
                      controller: number,
                      keyboardType: TextInputType.number,
                      decoration: deco('شمارهٔ چک', icon: Icons.tag)),
                  const SizedBox(height: 12),
                  TextField(
                      controller: sayad,
                      keyboardType: TextInputType.number,
                      maxLength: 16,
                      decoration: deco('شناسهٔ صیاد (۱۶ رقم، اختیاری)', icon: Icons.fingerprint)),
                  const SizedBox(height: 4),
                  TextField(
                    controller: bank,
                    decoration: deco('بانک', icon: Icons.account_balance_outlined).copyWith(
                      suffixIcon: PopupMenuButton<String>(
                        icon: const Icon(Icons.arrow_drop_down),
                        onSelected: (v) => setState(() => bank.text = v),
                        itemBuilder: (_) =>
                            _banks.map((b) => PopupMenuItem(value: b, child: Text(b))).toList(),
                      ),
                    ),
                  ),
                  const SizedBox(height: 12),
                  TextField(controller: branch, decoration: deco('شعبه', icon: Icons.store_mall_directory_outlined)),
                  const SizedBox(height: 12),
                  card(
                    context,
                    Column(children: [
                      dateTile(Icons.event, 'تاریخ صدور', issued, () async {
                        final d = await pickDate(context, issued);
                        if (d != null) setState(() => issued = d);
                      }),
                      dateTile(Icons.alarm, kind == 'guarantee' ? 'تاریخ سررسید (اختیاری)' : 'تاریخ سررسید', due,
                          () async {
                        final d = await pickDate(context, due ?? DateTime.now());
                        if (d != null) setState(() => due = d);
                      }, onClear: kind == 'guarantee' ? () => setState(() => due = null) : null),
                    ]),
                  ),
                  TextField(controller: notes, maxLines: 3, decoration: deco('توضیحات (اختیاری)')),
                  const SizedBox(height: 20),
                  SizedBox(
                      height: 52,
                      child: FilledButton(
                          onPressed: busy ? null : save, child: Text(e == null ? 'ثبت چک' : 'ذخیره تغییرات'))),
                ]),
              );
            }
          }


          // ---------- ظاهر کادرها (رنگ، اندازه، شفافیت، شیشه‌ای) ----------
          class BoxStyle {
            int? color;
            int? textColor;
            double textScale;
            double opacity;
            bool glass;
            double size; // برای کادر کارت‌ها: ضریب ارتفاع (فشرده‌سازی)
            bool border;
            double bw;
            int? bc;
            double bo;
            BoxStyle(
                {this.color,
                this.textColor,
                this.textScale = 1,
                this.opacity = 1,
                this.glass = false,
                this.size = 1,
                this.border = false,
                this.bw = 2,
                this.bc,
                this.bo = 1});

            Map<String, dynamic> toJson() => {
                  'c': color,
                  't': textColor,
                  's': textScale,
                  'o': opacity,
                  'g': glass,
                  'z': size,
                  'b': border,
                  'bw': bw,
                  'bc': bc,
                  'bo': bo,
                };

            static BoxStyle fromJson(Map j) => BoxStyle(
                  color: j['c'] as int?,
                  textColor: j['t'] as int?,
                  textScale: ((j['s'] ?? 1) as num).toDouble(),
                  opacity: ((j['o'] ?? 1) as num).toDouble(),
                  glass: j['g'] == true,
                  size: ((j['z'] ?? 1) as num).toDouble(),
                  border: j['b'] == true,
                  bw: ((j['bw'] ?? 2) as num).toDouble(),
                  bc: j['bc'] as int?,
                  bo: ((j['bo'] ?? 1) as num).toDouble(),
                );
          }

          class UiStyles extends ChangeNotifier {
            final Map<String, BoxStyle> _m = {};
            final Map<String, List<double>> _r = {};

            // [x (کسری از عرض، از چپ), y (پیکسل), عرض (کسری), ارتفاع (پیکسل)]
            static List<double> defaultRect(String k) {
              switch (k) {
                case 'hero':
                  return [0, 0, 1, 190];
                case 'cheques':
                  return [0, 204, .48, 72];
                default:
                  return [.52, 204, .48, 72];
              }
            }

            static double defOp(String k) =>
                (k == 'cheq_top' || k == 'loan_top' || k.endsWith('_chip')) ? .12 : 1;

            BoxStyle of(String k) => _m.putIfAbsent(k, () => BoxStyle(opacity: defOp(k)));

            bool isPlain(String k) {
              final s = of(k);
              return s.color == null &&
                  s.textColor == null &&
                  s.textScale == 1 &&
                  s.opacity == defOp(k) &&
                  !s.glass &&
                  !s.border &&
                  s.size == 1;
            }

            Future<void> changeMany(List<String> keys, void Function(BoxStyle s) f) async {
              for (final k in keys) {
                f(of(k));
              }
              notifyListeners();
              await _save();
            }

            List<double> rect(String k) => _r[k] ?? defaultRect(k);

            Future<void> load() async {
              try {
                final p = await SharedPreferences.getInstance();
                final raw = p.getString('ui_styles');
                if (raw != null) {
                  final j = jsonDecode(raw) as Map;
                  final boxes = (j['boxes'] as Map?) ?? {};
                  boxes.forEach((k, v) => _m['$k'] = BoxStyle.fromJson(v as Map));
                  final rects = (j['rects'] as Map?) ?? {};
                  rects.forEach((k, v) {
                    final l = (v as List).map((e) => (e as num).toDouble()).toList();
                    if (l.length == 4) _r['$k'] = l;
                  });
                }
              } catch (_) {}
            }

            Future<void> _save() async {
              try {
                final p = await SharedPreferences.getInstance();
                await p.setString(
                    'ui_styles',
                    jsonEncode({
                      'boxes': _m.map((k, v) => MapEntry(k, v.toJson())),
                      'rects': _r,
                    }));
              } catch (_) {}
            }

            Future<void> flush() => _save();

            Future<void> change(String k, void Function(BoxStyle s) f) async {
              f(of(k));
              notifyListeners();
              await _save();
            }

            Future<void> reset(List<String> keys) async {
              for (final k in keys) {
                _m[k] = BoxStyle(opacity: defOp(k));
              }
              notifyListeners();
              await _save();
            }

            Future<void> setRect(String k, List<double> r, {bool save = true}) async {
              _r[k] = r;
              notifyListeners();
              if (save) await _save();
            }

            Future<void> resetLayout() async {
              _r.clear();
              notifyListeners();
              await _save();
            }
          }

          final uiStyles = UiStyles();

          Color _darken(Color c) {
            final h = HSLColor.fromColor(c);
            return h.withLightness((h.lightness - .25).clamp(0.0, 1.0)).toColor();
          }

          /// کادر قابل‌تنظیم: رنگ، شفافیت، شیشه‌ای، اندازهٔ متن و رنگ متن
          Widget styledBox(BuildContext c, BoxStyle s, Color base, Widget child,
              {VoidCallback? onTap,
              double radius = 20,
              EdgeInsets pad = const EdgeInsets.all(16),
              double? height,
              List<Color>? colors,
              bool center = false}) {
            final col = s.color != null ? Color(s.color!) : base;
            final a = s.glass ? s.opacity * .55 : s.opacity;
            final cols = (colors ?? [col, col]).map((e) => e.withValues(alpha: a)).toList();
            final r = BorderRadius.circular(radius);
            final tc = s.textColor != null ? Color(s.textColor!) : null;
            final mq = MediaQuery.of(c);
            final content = MediaQuery(
              data: mq.copyWith(textScaler: TextScaler.linear(s.textScale)),
              child: DefaultTextStyle.merge(
                  style: tc == null ? null : TextStyle(color: tc), child: child),
            );
            Widget box = Material(
              type: MaterialType.transparency,
              child: Ink(
                decoration: BoxDecoration(
                  borderRadius: r,
                  gradient: LinearGradient(
                      begin: Alignment.centerLeft, end: Alignment.centerRight, colors: cols),
                  border: s.border
                      ? Border.all(
                          color: (s.bc != null ? Color(s.bc!) : Theme.of(c).colorScheme.primary)
                              .withValues(alpha: s.bo),
                          width: s.bw)
                      : (s.glass
                          ? Border.all(color: Colors.white.withValues(alpha: .45), width: 1.2)
                          : null),
                ),
                child: InkWell(
                  onTap: onTap,
                  borderRadius: r,
                  child: Container(
                    height: height,
                    padding: pad,
                    alignment: center ? Alignment.center : null,
                    child: content,
                  ),
                ),
              ),
            );
            if (s.glass) {
              box = ClipRRect(
                  borderRadius: r,
                  child: BackdropFilter(filter: ImageFilter.blur(sigmaX: 14, sigmaY: 14), child: box));
            }
            return box;
          }

          Widget cardBox(BuildContext c, String key, Widget child,
              {VoidCallback? onTap, double vpad = 16}) {
            final s = uiStyles.of(key);
            final gap = math.max(3.0, 12 * s.size);
            final vp = math.max(2.0, vpad * s.size);
            return Padding(
              padding: EdgeInsets.only(bottom: gap),
              child: styledBox(c, s, Theme.of(c).colorScheme.surfaceContainerLow, child,
                  onTap: onTap, pad: EdgeInsets.symmetric(horizontal: 16, vertical: vp)),
            );
          }

          Widget topBox(BuildContext c, String key, Color col, Widget child) {
            final s = uiStyles.of(key);
            final eff = BoxStyle(
                color: s.color,
                textColor: s.textColor,
                textScale: s.textScale,
                opacity: s.glass ? math.min(1.0, s.opacity + .25) : s.opacity,
                glass: s.glass,
                border: s.border,
                bw: s.bw,
                bc: s.bc,
                bo: s.bo);
            return styledBox(c, eff, col, child, radius: 18);
          }

