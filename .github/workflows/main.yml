          InputDecoration fieldDeco(BuildContext c, String key, String hint, {IconData? icon}) {
            final d = deco(hint, icon: icon);
            if (uiStyles.isPlain(key)) return d;
            final s = uiStyles.of(key);
            final base = s.color != null ? Color(s.color!) : Theme.of(c).colorScheme.surfaceContainerLow;
            final fill = s.glass
                ? Colors.white.withValues(alpha: .3 * s.opacity)
                : base.withValues(alpha: s.opacity);
            final bs = s.border
                ? BorderSide(
                    color: (s.bc != null ? Color(s.bc!) : Theme.of(c).colorScheme.primary)
                        .withValues(alpha: s.bo),
                    width: s.bw)
                : (s.glass
                    ? BorderSide(color: Colors.white.withValues(alpha: .5))
                    : BorderSide.none);
            final ob = OutlineInputBorder(borderRadius: BorderRadius.circular(14), borderSide: bs);
            return d.copyWith(filled: true, fillColor: fill, border: ob, enabledBorder: ob, focusedBorder: ob);
          }

          TextStyle? fieldStyle(String key) {
            if (uiStyles.isPlain(key)) return null;
            final s = uiStyles.of(key);
            return TextStyle(
                color: s.textColor != null ? Color(s.textColor!) : null, fontSize: 16 * s.textScale);
          }

          // ---------- backup & export ----------
          Future<void> shareFile(String name, String content, String mime) async {
            final d = await getTemporaryDirectory();
            final f = File('${d.path}/$name');
            await f.writeAsString(content);
            await Share.shareXFiles([XFile(f.path, mimeType: mime)]);
          }

          String csvCell(Object? v) {
            final s = '${v ?? ''}'.replaceAll('"', '""');
            return '"$s"';
          }

          String buildCsv() {
            final rows = <List<Object?>>[
              ['شخص', 'عنوان', 'نوع', 'مبلغ اولیه', 'پرداخت‌شده', 'مانده', 'تاریخ ثبت', 'سررسید', 'وضعیت']
            ];
            for (final a in store.accs) {
              rows.add([
                a.who,
                a.title,
                a.isRec ? 'طلب' : 'بدهی',
                a.principal,
                a.paid,
                a.remaining,
                a.opened == null ? '' : ymd(a.opened!),
                a.due == null ? '' : ymd(a.due!),
                a.settled ? 'تسویه‌شده' : 'باز',
              ]);
            }
            return '\uFEFF${rows.map((r) => r.map(csvCell).join(',')).join('\n')}';
          }

          class BackupPage extends StatefulWidget {
            const BackupPage({super.key});
            @override
            State<BackupPage> createState() => _BackupPageState();
          }

          class _BackupPageState extends State<BackupPage> {
            late Future<List<Map<String, dynamic>>> recs = _recs();
            bool busy = false, auto = false;

            Future<List<Map<String, dynamic>>> _recs() async {
              final r = await sb.from('backup_records').select().order('created_at', ascending: false).limit(50);
              return List<Map<String, dynamic>>.from(r);
            }

            @override
            void initState() {
              super.initState();
              SharedPreferences.getInstance().then((p) {
                if (mounted) setState(() => auto = p.getBool('auto_backup') ?? false);
              });
              calendarMode.addListener(_onCal);
            }

            void _onCal() {
              if (mounted) setState(() {});
            }

            @override
            void dispose() {
              calendarMode.removeListener(_onCal);
              super.dispose();
            }

            Future<void> create() async {
              setState(() => busy = true);
              final ok = await run(context, () async {
                await createBackup();
                await pruneBackups(30);
              }, reload: false);
              if (!mounted) return;
              setState(() {
                busy = false;
                recs = _recs();
              });
              if (ok) toast(context, 'نسخه پشتیبان ابری ساخته شد');
            }

            Future<void> restore(Map<String, dynamic> r) async {
              setState(() => busy = true);
              Map<String, dynamic>? j;
              try {
                j = await readBackup(r['storage_path'] as String);
              } catch (e) {
                if (mounted) toast(context, e is String ? e : 'دریافت نسخه پشتیبان ناموفق بود');
              }
              if (!mounted) return;
              setState(() => busy = false);
              if (j == null) return;
              final d = j['data'] as Map<String, dynamic>;
              final ok = await confirm(
                  context,
                  'بازیابی نسخه پشتیبان',
                  'تاریخ: ${fmtDate(DateTime.parse(j['created_at'] as String).toLocal())}\n'
                      'اشخاص: ${faDigits('${(d['contacts'] as List).length}')}  |  '
                      'حساب‌ها: ${faDigits('${(d['accounts'] as List).length}')}  |  '
                      'پرداخت‌ها: ${faDigits('${(d['transactions'] as List).length}')}\n\n'
                      'داده‌های فعلی شما با این نسخه جایگزین می‌شود. پیش از آن یک نسخهٔ پشتیبان از وضعیت فعلی ساخته می‌شود.',
                  ok: 'جایگزین کن');
              if (!ok || !mounted) return;
              setState(() => busy = true);
              final done = await run(context, () async {
                await createBackup();
                await sb.rpc('restore_user_data', params: {'payload': d});
              });
              if (!mounted) return;
              setState(() {
                busy = false;
                recs = _recs();
              });
              if (done) toast(context, 'بازیابی انجام شد');
            }

            Future<void> remove(Map<String, dynamic> r) async {
              if (!await confirm(context, 'حذف نسخه پشتیبان', 'این نسخه برای همیشه حذف می‌شود.', ok: 'حذف')) return;
              if (!mounted) return;
              await run(context, () async {
                await sb.storage.from('backups').remove([r['storage_path'] as String]);
                await sb.from('backup_records').delete().eq('id', r['id']);
              }, reload: false);
