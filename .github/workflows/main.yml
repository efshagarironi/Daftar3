          // ---------- app lock gate ----------
          class AppLockGate extends StatefulWidget {
            final Widget child;
            const AppLockGate({super.key, required this.child});
            @override
            State<AppLockGate> createState() => _AppLockGateState();
          }

          class _AppLockGateState extends State<AppLockGate> with WidgetsBindingObserver {
            bool locked = false;
            DateTime? pausedAt;
            bool get _active => appLockEnabled.value || customLock.value != 'none';

            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addObserver(this);
              appLockEnabled.addListener(_rebuild);
              customLock.addListener(_rebuild);
              if (_active) {
                locked = true;
                if (customLock.value == 'none') {
                  WidgetsBinding.instance.addPostFrameCallback((_) => _unlock());
                }
              }
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              appLockEnabled.removeListener(_rebuild);
              customLock.removeListener(_rebuild);
              super.dispose();
            }

            void _rebuild() {
              if (mounted) setState(() {});
            }

            @override
            void didChangeAppLifecycleState(AppLifecycleState state) {
              if (!_active || authBusy) return;
              if (state == AppLifecycleState.paused) {
                if (locked) return;
                pausedAt = DateTime.now();
                if (lockDelay.value == 0) setState(() => locked = true);
              } else if (state == AppLifecycleState.resumed) {
                final t = pausedAt;
                pausedAt = null;
                if (!locked && t != null && DateTime.now().difference(t).inSeconds >= lockDelay.value) {
                  setState(() => locked = true);
                }
                if (locked && customLock.value == 'none') _unlock();
              }
            }

            Future<void> _unlock() async {
              if (authBusy || !mounted) return;
              if (!await deviceCanLock()) {
                // قفل صفحهٔ گوشی برداشته شده؛ برای جلوگیری از قفل‌ماندن، قفل برنامه خاموش می‌شود
                await setAppLock(false);
                if (mounted) setState(() => locked = customLock.value != 'none');
                return;
              }
              final ok = await authenticateUser('برای ورود به حساب‌یار هویت خود را تأیید کنید');
              if (!mounted) return;
              setState(() {
                if (ok) {
                  locked = false;
                  pausedAt = null;
                }
              });
            }

            @override
            Widget build(BuildContext context) {
              final show = locked && _active;
              return Stack(children: [
                widget.child,
                if (show && customLock.value != 'none')
                  Positioned.fill(
                    child: Overlay(initialEntries: [
                      OverlayEntry(
                          builder: (_) => Material(
                              color: Theme.of(context).colorScheme.surface,
                              child: CustomLockScreen(
                                  allowForgot: true,
                                  onUnlocked: () {
                                    if (mounted) {
                                      setState(() {
                                        locked = false;
                                        pausedAt = null;
                                      });
                                    }
                                  },
                                  onDeviceAuth: appLockEnabled.value ? _unlock : null))),
                    ]),
                  ),
