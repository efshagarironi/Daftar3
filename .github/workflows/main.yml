          class _AuthPageState extends State<AuthPage> {
            final email = TextEditingController();
            final pass = TextEditingController();
            bool signup = false, busy = false, hide = true;

            Future<void> submit() async {
              final e = email.text.trim(), p = pass.text;
              if (!e.contains('@') || p.length < 8) {
                toast(context, 'ایمیل معتبر و رمز عبور حداقل ۸ کاراکتری وارد کنید');
                return;
              }
              setState(() => busy = true);
              try {
                if (signup) {
                  final r = await sb.auth.signUp(email: e, password: p);
                  if (r.session == null && mounted) {
                    toast(context, 'لینک تأیید به ایمیل شما ارسال شد. پس از تأیید، وارد شوید.');
                    setState(() => signup = false);
                  }
                } else {
                  await sb.auth.signInWithPassword(email: e, password: p);
                }
              } on AuthException catch (x) {
                if (mounted) toast(context, x.message);
              } catch (_) {
                if (mounted) toast(context, 'اتصال برقرار نیست');
              }
              if (mounted) setState(() => busy = false);
            }

            Future<void> forgot() async {
              final e = email.text.trim();
              if (!e.contains('@')) {
                toast(context, 'ابتدا ایمیل خود را وارد کنید');
                return;
              }
              try {
                await sb.auth.resetPasswordForEmail(e);
                if (mounted) toast(context, 'اگر این ایمیل ثبت شده باشد، لینک بازیابی ارسال می‌شود');
              } catch (_) {
                if (mounted) toast(context, 'ارسال ناموفق بود');
              }
            }

            @override
            Widget build(BuildContext context) {
              final t = Theme.of(context).textTheme;
              return Scaffold(
                body: Container(
                  decoration: const BoxDecoration(
                    gradient: LinearGradient(
                        begin: Alignment.topCenter,
                        end: Alignment.bottomCenter,
                        colors: [Color(0xFF0E7C86), Color(0xFF14B8A6)],
                        stops: [0, .5]),
                  ),
                  child: SafeArea(
                    child: Center(
                      child: SingleChildScrollView(
                        padding: const EdgeInsets.all(24),
                        child: Column(
                          children: [
                            const Icon(Icons.account_balance_wallet_rounded,
                                size: 64, color: Colors.white),
                            const SizedBox(height: 8),
                            Text('حساب‌یار',
                                style: t.headlineMedium?.copyWith(
                                    color: Colors.white, fontWeight: FontWeight.bold)),
                            Text('مدیریت بدهی، طلب و پشتیبان‌گیری ابری',
                                style: t.bodyMedium?.copyWith(color: Colors.white70)),
                            const SizedBox(height: 28),
                            Card(
                              elevation: 0,
                              shape: RoundedRectangleBorder(
                                  borderRadius: BorderRadius.circular(28)),
                              child: Padding(
                                padding: const EdgeInsets.all(20),
                                child: Column(
                                  children: [
                                    Text(signup ? 'ساخت حساب' : 'ورود',
                                        style: t.titleLarge
                                            ?.copyWith(fontWeight: FontWeight.bold)),
                                    const SizedBox(height: 16),
                                    TextField(
                                        controller: email,
                                        keyboardType: TextInputType.emailAddress,
                                        textDirection: TextDirection.ltr,
                                        decoration: deco('ایمیل', icon: Icons.email_outlined)),
                                    const SizedBox(height: 12),
                                    TextField(
                                      controller: pass,
                                      obscureText: hide,
                                      textDirection: TextDirection.ltr,
                                      decoration: deco('رمز عبور', icon: Icons.lock_outline)
                                          .copyWith(
                                              suffixIcon: IconButton(
                                                  icon: Icon(hide
                                                      ? Icons.visibility_off
                                                      : Icons.visibility),
                                                  onPressed: () =>
                                                      setState(() => hide = !hide))),
                                    ),
                                    const SizedBox(height: 16),
                                    SizedBox(
                                      width: double.infinity,
                                      height: 50,
                                      child: FilledButton(
                                        onPressed: busy ? null : submit,
                                        child: busy
                                            ? const SizedBox(
                                                width: 22,
                                                height: 22,
                                                child: CircularProgressIndicator(strokeWidth: 2))
                                            : Text(signup ? 'ثبت‌نام' : 'ورود'),
                                      ),
                                    ),
                                    TextButton(
                                        onPressed: () => setState(() => signup = !signup),
                                        child: Text(signup
                                            ? 'حساب دارید؟ وارد شوید'
                                            : 'حساب ندارید؟ ثبت‌نام کنید')),
                                    if (!signup)
                                      TextButton(
                                          onPressed: forgot,
