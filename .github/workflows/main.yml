          // ---------- فرم ثبت/ویرایش وام ----------
          class LoanFormPage extends StatefulWidget {
            final Loan? edit;
            const LoanFormPage({super.key, this.edit});
            @override
            State<LoanFormPage> createState() => _LoanFormPageState();
          }

          class _LoanFormPageState extends State<LoanFormPage> {
            String direction = 'taken';
            final title = TextEditingController();
            final lender = TextEditingController();
            final amount = TextEditingController();
            final count = TextEditingController();
            final instAmt = TextEditingController();
            final rate = TextEditingController();
            final notes = TextEditingController();
            int period = 1;
            late DateTime first;
            late DateTime opened;
            bool busy = false;

            @override
            void initState() {
              super.initState();
              final e = widget.edit;
              opened = DateTime.now();
              first = addMonths(DateTime.now(), 1);
              if (e != null) {
                direction = e.taken ? 'taken' : 'given';
                title.text = e.title;
                lender.text = e.lender;
                amount.text = '${e.principal}';
                count.text = '${e.count}';
                instAmt.text = '${e.instAmount}';
                rate.text = e.m['interest_percent'] == null ? '' : '${e.m['interest_percent']}';
                notes.text = '${e.m['notes'] ?? ''}';
                period = e.period;
                opened = DateTime.tryParse('${e.m['opened_at']}') ?? opened;
                if (e.inst.isNotEmpty) first = Loan.dueOf(e.inst.first) ?? first;
              }
            }

            @override
            void dispose() {
              for (final t in [title, lender, amount, count, instAmt, rate, notes]) {
                t.dispose();
              }
              super.dispose();
            }

            double? get _rate => rate.text.trim().isEmpty ? null : double.tryParse(_enDigits(rate.text));

            void autoFill() {
              final amt = parseAmount(amount.text), n = parseAmount(count.text);
              if (amt == null || n == null || n <= 0) {
                toast(context, 'ابتدا مبلغ وام و تعداد اقساط را وارد کنید');
                return;
              }
              final r = _rate ?? 0;
              final totalPay = amt * (1 + r / 100 * (n * period) / 12);
              setState(() => instAmt.text = '${(totalPay / n).ceil()}');
            }

            Future<void> save() async {
              final e = widget.edit;
              if (title.text.trim().isEmpty) {
                toast(context, 'عنوان وام را وارد کنید');
                return;
              }
              final amt = parseAmount(amount.text), n = parseAmount(count.text);
              final ia = parseAmount(instAmt.text);
              if (e == null) {
                if (amt == null || amt <= 0) {
                  toast(context, 'مبلغ وام معتبر نیست');
                  return;
                }
                if (n == null || n <= 0 || n > 600) {
                  toast(context, 'تعداد اقساط معتبر نیست');
                  return;
                }
                if (ia == null || ia <= 0) {
                  toast(context, 'مبلغ هر قسط را وارد کنید');
                  return;
                }
              }
              if (rate.text.trim().isNotEmpty && _rate == null) {
                toast(context, 'نرخ سود معتبر نیست');
                return;
              }
              setState(() => busy = true);
              final ok = await run(context, () async {
                final body = {
                  'direction': direction,
                  'title': title.text.trim(),
                  'lender': lender.text.trim().isEmpty ? null : lender.text.trim(),
                  'notes': notes.text.trim().isEmpty ? null : notes.text.trim(),
                };
                if (e != null) {
                  await sb.from('loans').update(body).eq('id', e.id);
                  return;
                }
                final r = await sb.from('loans').insert({
                  ...body,
                  'user_id': uid(),
                  'principal_amount': amt,
                  'installment_count': n,
                  'installment_amount': ia,
                  'period_months': period,
                  'interest_percent': _rate,
                  'first_due_at': ymd(first),
                  'opened_at': ymd(opened),
                  'currency': unit.value,
                }).select('id').single();
                final loanId = r['id'] as String;
                await sb.from('loan_installments').insert([
                  for (var k = 0; k < n!; k++)
                    {
                      'user_id': uid(),
                      'loan_id': loanId,
                      'number': k + 1,
                      'due_at': ymd(addMonths(first, k * period)),
                      'amount': ia,
                    }
                ]);
              });
              if (!mounted) return;
              setState(() => busy = false);
              if (ok) Navigator.pop(context);
            }

            @override
            Widget build(BuildContext context) {
              final e = widget.edit;
              final locked = e != null;
              return Scaffold(
                appBar: AppBar(title: Text(e == null ? 'ثبت وام جدید' : 'ویرایش وام')),
                body: ListView(padding: const EdgeInsets.all(16), children: [
                  SegmentedButton<String>(
                    segments: const [
                      ButtonSegment(value: 'taken', label: Text('وام گرفته‌ام'), icon: Icon(Icons.south_west)),
                      ButtonSegment(value: 'given', label: Text('وام داده‌ام'), icon: Icon(Icons.north_east)),
                    ],
                    selected: {direction},
                    onSelectionChanged: (s) => setState(() => direction = s.first),
                  ),
                  const SizedBox(height: 16),
                  TextField(controller: title, decoration: deco('عنوان وام (مثلاً وام مسکن)', icon: Icons.title)),
                  const SizedBox(height: 12),
                  TextField(
                      controller: lender,
                      decoration: deco(direction == 'taken' ? 'وام‌دهنده (بانک/شخص)' : 'وام‌گیرنده',
                          icon: Icons.account_balance_outlined)),
                  const SizedBox(height: 12),
                  if (locked)
                    Padding(
                      padding: const EdgeInsets.only(bottom: 12),
                      child: Text(
                          'مبلغ، تعداد و زمان‌بندی اقساط پس از ثبت قابل تغییر نیست تا وضعیت پرداخت‌ها حفظ شود. در صورت نیاز، وام را حذف و دوباره ثبت کنید.',
                          style: TextStyle(color: Theme.of(context).colorScheme.outline, fontSize: 12)),
                    ),
                  TextField(
                      controller: amount,
                      enabled: !locked,
                      keyboardType: TextInputType.number,
                      decoration: deco('مبلغ وام (${unit.value})', icon: Icons.payments_outlined)),
                  const SizedBox(height: 12),
                  Row(children: [
                    Expanded(
                        child: TextField(
                            controller: count,
                            enabled: !locked,
                            keyboardType: TextInputType.number,
                            decoration: deco('تعداد اقساط', icon: Icons.format_list_numbered))),
                    const SizedBox(width: 12),
                    Expanded(
                        child: TextField(
                            controller: rate,
                            enabled: !locked,
                            keyboardType: const TextInputType.numberWithOptions(decimal: true),
                            decoration: deco('نرخ سود سالانه ٪ (اختیاری)', icon: Icons.percent))),
                  ]),
                  const SizedBox(height: 12),
                  TextField(
                      controller: instAmt,
                      enabled: !locked,
                      keyboardType: TextInputType.number,
                      decoration: deco('مبلغ هر قسط (${unit.value})', icon: Icons.paid_outlined).copyWith(
                          suffixIcon: locked
                              ? null
                              : TextButton(onPressed: autoFill, child: const Text('محاسبه')))),
                  const SizedBox(height: 12),
                  DropdownButtonFormField<int>(
                    value: period,
                    decoration: deco('دورهٔ پرداخت', icon: Icons.repeat),
                    items: const [
                      DropdownMenuItem(value: 1, child: Text('ماهانه')),
                      DropdownMenuItem(value: 2, child: Text('هر دو ماه')),
                      DropdownMenuItem(value: 3, child: Text('سه‌ماهه')),
                      DropdownMenuItem(value: 6, child: Text('شش‌ماهه')),
                      DropdownMenuItem(value: 12, child: Text('سالانه')),
                    ],
                    onChanged: locked ? null : (v) => setState(() => period = v ?? 1),
                  ),
                  const SizedBox(height: 12),
                  card(
                    context,
                    Column(children: [
                      dateTile(Icons.event, 'تاریخ دریافت/ثبت وام', opened, locked
                          ? null
                          : () async {
                              final d = await pickDate(context, opened);
                              if (d != null) setState(() => opened = d);
                            }),
                      dateTile(Icons.alarm, 'سررسید اولین قسط', first, locked
                          ? null
                          : () async {
                              final d = await pickDate(context, first);
                              if (d != null) setState(() => first = d);
                            }),
                    ]),
                  ),
                  TextField(controller: notes, maxLines: 3, decoration: deco('توضیحات (اختیاری)')),
                  const SizedBox(height: 20),
                  SizedBox(
                      height: 52,
                      child: FilledButton(
                          onPressed: busy ? null : save,
                          child: Text(e == null ? 'ثبت وام و ساخت اقساط' : 'ذخیره تغییرات'))),
                ]),
              );
            }
          }

          // ---------- صفحهٔ چک‌ها ----------
          class ChequesPage extends StatefulWidget {
            const ChequesPage({super.key});
            @override
            State<ChequesPage> createState() => _ChequesPageState();
          }

          class _ChequesPageState extends State<ChequesPage> {
            String dir = 'received', kind = 'all', st = 'all';

            @override
            Widget build(BuildContext context) => GlassFrame(
                keys: const ['cheq_top', 'cheq_card'], child: _scaffold(context));

            Widget _scaffold(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('دفتر چک‌ها'), actions: [
                  IconButton(
                    tooltip: 'تنظیمات ظاهر',
                    icon: const Icon(Icons.settings_outlined),
                    onPressed: () => showGroupsSheet(context,
                        title: 'تنظیمات ظاهر صفحه چک‌ها',
                        groups: const [
                          StyleGroup('cheq_top', 'کادرهای بالای صفحه (جمع‌ها و تب‌ها)'),
                          StyleGroup('cheq_chip', 'کادرهای فیلتر (همه انواع / همه وضعیت‌ها)',
                              textSize: false),
                          StyleGroup('cheq_card', 'کادر چک‌های ثبت‌شده', compress: true),
                        ],
                        sharedBorder: true),
                  ),
                ]),
                floatingActionButton: FloatingActionButton.extended(
                  onPressed: () => Navigator.push(
                      context, MaterialPageRoute(builder: (_) => ChequeFormPage(initDir: dir))),
                  icon: const Icon(Icons.add),
                  label: const Text('ثبت چک'),
                ),
                body: GlassBg(
                  keys: const ['cheq_top', 'cheq_card'],
                  child: SafeArea(
                  child: ListenableBuilder(
                    listenable: Listenable.merge([store, unit, calendarMode, uiStyles]),
                    builder: (c, _) {
                      final all = store.cheques;
                      final mine = all.where((x) => (x.received) == (dir == 'received')).toList();
                      final pendSum = mine.where((x) => x.pending).fold<int>(0, (s, x) => s + x.amount);
                      final lateFlag = mine.where((x) => x.overdue).length;
                      final list = mine
                          .where((x) => kind == 'all' || (kind == 'guarantee') == x.guarantee)
                          .where((x) => st == 'all' || x.status == st)
                          .toList()
                        ..sort((a, b) {
                          if (a.pending != b.pending) return a.pending ? -1 : 1;
                          final da = a.due ?? DateTime(2100), db = b.due ?? DateTime(2100);
                          return da.compareTo(db);
                        });
                      final stOpts = dir == 'received'
                          ? ['pending', 'cashed', 'bounced', 'endorsed', 'returned']
                          : ['pending', 'cashed', 'bounced', 'returned'];
                      return RefreshIndicator(
                        onRefresh: store.load,
                        child: ListView(
                          physics: const AlwaysScrollableScrollPhysics(),
                          padding: const EdgeInsets.fromLTRB(16, 8, 16, 100),
                          children: [
                            glassWrap(
                              uiStyles.of('cheq_top').glass,
                              SegmentedButton<String>(
                                segments: const [
                                  ButtonSegment(value: 'received', label: Text('چک‌های دریافتی')),
                                  ButtonSegment(value: 'issued', label: Text('چک‌های پرداختی')),
                                ],
                                selected: {dir},
                                style: segStyle(context, uiStyles.of('cheq_top')),
                                onSelectionChanged: (s) => setState(() {
                                  dir = s.first;
                                  st = 'all';
                                }),
                              ),
                            ),
                            const SizedBox(height: 12),
                            Row(children: [
                              Expanded(
                                  child: _sum(c, 'جمع در انتظار', money(pendSum), dir == 'received' ? cRec : cPay)),
                              const SizedBox(width: 12),
                              Expanded(child: _sum(c, 'سررسید گذشته', '${faDigits('$lateFlag')} چک', cWarn)),
                            ]),
                            const SizedBox(height: 12),
                            GWrap(glass: uiStyles.of('cheq_chip').glass, spacing: 8, runSpacing: 4, children: [
                              for (final k in const [
                                ['all', 'همهٔ انواع'],
                                ['dated', 'تاریخ‌دار'],
                                ['guarantee', 'ضمانتی'],
                              ])
                                StyledChip(styleKey: 'cheq_chip', 
                                    label: Text(k[1]),
                                    selected: kind == k[0],
                                    onSelected: (_) => setState(() => kind = k[0])),
                            ]),
                            const SizedBox(height: 10),
                            GWrap(glass: uiStyles.of('cheq_chip').glass, spacing: 8, runSpacing: 4, children: [
                              StyledChip(styleKey: 'cheq_chip', 
                                  label: const Text('همهٔ وضعیت‌ها'),
                                  selected: st == 'all',
                                  onSelected: (_) => setState(() => st = 'all')),
                              for (final s in stOpts)
                                StyledChip(styleKey: 'cheq_chip', 
                                    label: Text(chequeStatusLabel(s, dir == 'received')),
                                    selected: st == s,
                                    onSelected: (_) => setState(() => st = s)),
                            ]),
