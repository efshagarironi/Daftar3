                            value: appLockEnabled.value,
                            onChanged: busy ? null : _toggle,
                          ),
                          if (busy) const LinearProgressIndicator(),
                        ])),
                    customLockCard(c),
                    if (appLockEnabled.value || customLock.value != 'none')
                      card(
                          c,
                          Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                            const Text('زمان قفل خودکار', style: TextStyle(fontWeight: FontWeight.bold)),
                            const Text('پس از خروج از برنامه، بعد از چه مدتی دوباره قفل شود.'),
                            const SizedBox(height: 8),
                            Wrap(spacing: 8, children: [
                              for (final o in const [
                                [0, 'بلافاصله'],
