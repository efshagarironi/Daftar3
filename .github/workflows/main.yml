          // ---------- مدل وام ----------
          class Loan {
            final Map<String, dynamic> m;
            Loan(this.m);
            String get id => m['id'] as String;
            String get title => '${m['title'] ?? ''}';
            String get lender => '${m['lender'] ?? ''}';
            bool get taken => m['direction'] != 'given';
            int get principal => (m['principal_amount'] as num).toInt();
            int get count => (m['installment_count'] as num).toInt();
            int get instAmount => (m['installment_amount'] as num).toInt();
            int get period => ((m['period_months'] ?? 1) as num).toInt();
            List<Map<String, dynamic>> get inst {
              final l = List<Map<String, dynamic>>.from((m['loan_installments'] as List?) ?? []);
              l.sort((a, b) => (a['number'] as num).compareTo(b['number'] as num));
              return l;
            }

            static bool isPaid(Map<String, dynamic> i) => i['paid_at'] != null;
            static int amt(Map<String, dynamic> i) => (i['amount'] as num).toInt();
            static DateTime? dueOf(Map<String, dynamic> i) => DateTime.tryParse('${i['due_at']}');
            int get total => inst.fold<int>(0, (s, i) => s + amt(i));
            int get paidAmount => inst.where(isPaid).fold<int>(0, (s, i) => s + amt(i));
            int get remaining => total - paidAmount;
            int get paidCount => inst.where(isPaid).length;
            bool get done => inst.isNotEmpty && paidCount == inst.length;
            Map<String, dynamic>? get next {
              for (final i in inst) {
                if (!isPaid(i)) return i;
              }
              return null;
            }

            DateTime? get nextDue => next == null ? null : dueOf(next!);
            bool get overdue => nextDue != null && nextDue!.isBefore(_today0());
            double get progress => total == 0 ? 0 : paidAmount / total;
          }

          // ---------- مدل چک ----------
          class Cheque {
            final Map<String, dynamic> m;
            Cheque(this.m);
            String get id => m['id'] as String;
            bool get received => m['direction'] == 'received';
            bool get guarantee => m['kind'] == 'guarantee';
            int get amount => (m['amount'] as num).toInt();
            String get status => '${m['status'] ?? 'pending'}';
            String get who => ((m['contacts'] as Map?)?['name'] ?? '') as String;
            String get number => '${m['cheque_number'] ?? ''}';
            String get sayad => '${m['sayad_id'] ?? ''}';
            String get bank => '${m['bank'] ?? ''}';
            String get branch => '${m['branch'] ?? ''}';
            DateTime? get due => m['due_at'] == null ? null : DateTime.tryParse('${m['due_at']}');
            DateTime? get issued => m['issued_at'] == null ? null : DateTime.tryParse('${m['issued_at']}');
            bool get pending => status == 'pending';
            bool get overdue => pending && !guarantee && due != null && due!.isBefore(_today0());
            bool get soon =>
                pending && !guarantee && due != null && !overdue && due!.difference(_today0()).inDays <= 7;
            String get statusLabel => chequeStatusLabel(status, received);
            Color get statusColor => chequeStatusColor(status);
          }

          String chequeStatusLabel(String s, bool received) {
            switch (s) {
              case 'cashed':
                return received ? 'وصول‌شده' : 'پاس‌شده';
              case 'bounced':
                return 'برگشتی';
              case 'endorsed':
                return 'واگذار شده';
              case 'returned':
                return 'عودت‌شده';
              default:
                return 'در انتظار';
            }
          }

          Color chequeStatusColor(String s) {
            switch (s) {
              case 'cashed':
                return cRec;
              case 'bounced':
                return cPay;
              case 'endorsed':
                return cPurple;
              case 'returned':
                return Colors.blueGrey;
              default:
                return cWarn;
            }
          }

