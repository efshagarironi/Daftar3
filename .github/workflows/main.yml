          // ---------- security page ----------
          class SecurityPage extends StatefulWidget {
            const SecurityPage({super.key});
            @override
            State<SecurityPage> createState() => _SecurityPageState();
          }

          class _SecurityPageState extends State<SecurityPage> {
            bool busy = false;

            Future<void> _toggle(bool v) async {
              setState(() => busy = true);
              try {
                if (v && !await deviceCanLock()) {
                  if (mounted) {
                    toast(context,
                        'ابتدا در تنظیمات گوشی یک قفل صفحه (رمز، الگو، اثر انگشت یا چهره) فعال کنید');
                  }
                  return;
                }
                final ok = await authenticateUser(v
                    ? 'برای فعال‌سازی قفل، هویت خود را تأیید کنید'
                    : 'برای غیرفعال‌کردن قفل، هویت خود را تأیید کنید');
                if (!ok) {
                  if (mounted) toast(context, 'تأیید هویت انجام نشد؛ تغییری اعمال نشد');
                  return;
                }
                await setAppLock(v);
              } finally {
                if (mounted) setState(() => busy = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('امنیت')),
                body: ListenableBuilder(
                  listenable: Listenable.merge([appLockEnabled, lockDelay, customLock]),
                  builder: (c, _) => ListView(padding: const EdgeInsets.all(16), children: [
                    card(
                        c,
                        Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                          SwitchListTile(
