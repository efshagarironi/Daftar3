          String _enDigits(String s) {
            var t = s.trim();
            for (var i = 0; i < 10; i++) {
              t = t
                  .replaceAll(String.fromCharCode(0x06F0 + i), '$i')
                  .replaceAll(String.fromCharCode(0x0660 + i), '$i');
            }
            return t.replaceAll('٫', '.').replaceAll('،', '.').replaceAll(',', '.');
          }

          DateTime addMonths(DateTime d, int n) {
            if (isJalali) {
              final j = toJalali(d);
              final tot = j[1] - 1 + n;
              final y = j[0] + tot ~/ 12;
              final m = tot % 12 + 1;
              final day = j[2] > jalaliMonthLength(y, m) ? jalaliMonthLength(y, m) : j[2];
              return jalaliToDate(y, m, day);
            }
            final tot = d.month - 1 + n;
            final y = d.year + tot ~/ 12;
            final m = tot % 12 + 1;
            final dim = DateTime(y, m + 1, 0).day;
            return DateTime(y, m, d.day > dim ? dim : d.day);
          }

          DateTime _today0() {
            final n = DateTime.now();
            return DateTime(n.year, n.month, n.day);
          }

