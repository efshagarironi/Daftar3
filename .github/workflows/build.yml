          # حساب‌یار — معماری، امنیت و اجرا

          ## معماری
          - Flutter (Android) + Supabase Auth (ایمیل/رمز) + PostgreSQL + Storage خصوصی (bucket `backups`).
          - `lib/logic.dart`: منطق خالص Dart (پول با int، CSV، checksum/اعتبارسنجی پشتیبان، redact لاگ) — بدون وابستگی به Flutter و قابل تست.
          - `lib/data.dart`: کلاینت Supabase، Store (آنلاین‌اول + کش فقط‌خواندنی آفلاین)، AppLog بدون اسرار.
          - `lib/screens.dart`: رابط فارسی/RTL، احراز هویت، داشبورد، اشخاص، حساب‌ها، پرداخت جزئی، پشتیبان/بازیابی، تنظیمات.
          - `lib/report.dart`: گزارش PDF فارسی با فونت Vazirmatn (دانلود در Build، داخل APK).
          - `supabase/migrations`: 0001 (جدول‌ها + RLS)، 0002 (سخت‌سازی، FK مرکب مالکیت، trigger وضعیت، restore با ادغام/جایگزینی و dedupe).

          ## امنیت
          - فقط `SUPABASE_URL` و `SUPABASE_ANON_KEY` در کلاینت (از طریق `--dart-define`). کلید service_role هیچ‌جا نیست.
          - RLS روی همه جدول‌ها: `user_id = auth.uid()`؛ FK مرکب `(id,user_id)` مانع اشاره به داده کاربر دیگر می‌شود.
          - bucket پشتیبان خصوصی؛ مسیر فایل `<user_id>/...` و policy برای select/insert/delete.
          - لاگ‌ها از `redact()` عبور می‌کنند (JWT، ایمیل، توکن، رشته‌های طولانی).

          ## اجرای محلی
          ```bash
          # 1) Supabase: در SQL Editor به‌ترتیب supabase/migrations/0001_init.sql و 0002_hardening.sql را اجرا کنید.
          #    Auth > URL Configuration: Redirect URL = hesabyar://login-callback/
          # 2) اجرا
          flutter pub get
          flutter run --dart-define=SUPABASE_URL=<YOUR_SUPABASE_URL> --dart-define=SUPABASE_ANON_KEY=<YOUR_ANON_KEY>
          # 3) تست‌ها
          flutter test
          PSQL="psql -h localhost -U postgres" bash supabase/tests/run_all.sh   # به یک Postgres محلی نیاز دارد
          ```
          فونت‌ها: `assets/fonts/Vazirmatn-Regular.ttf` و `Vazirmatn-Bold.ttf` را (مجوز OFL) در پوشه بگذارید؛ workflow خودش دانلود می‌کند.

          ## فرض‌ها
          - مبلغ‌ها عدد صحیح در کوچک‌ترین واحد نمایش (تومان/ریال)؛ تبدیل ارز نداریم.
          - فقط Android ساخته می‌شود (iOS نیاز به macOS runner و حساب Apple دارد).
          - حذف حساب با تابع `security definer` به نام `delete_my_account` انجام می‌شود (بدون service_role در کلاینت).
          - پشتیبان JSON رمزنگاری نشده است.
          F15_EOF

          # --- Vazirmatn font (OFL) from the official npm package; fails loudly if missing ---
          mkdir -p /tmp/vz && (cd /tmp/vz && npm pack vazirmatn >/dev/null && tar xzf vazirmatn-*.tgz)
          for w in Regular Bold; do
            f=$(find /tmp/vz -name "Vazirmatn-$w.ttf" -path "*ttf*" | head -n1)
            [ -n "$f" ] || { echo "Vazirmatn-$w.ttf not found in npm package"; exit 1; }
            cp "$f" "assets/fonts/Vazirmatn-$w.ttf"
          done

          # --- AndroidManifest: INTERNET, Persian label, auth deep link (hesabyar://login-callback/) ---
          MF=android/app/src/main/AndroidManifest.xml
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-permission android:name="android.permission.INTERNET"/>#' "$MF"
          sed -i 's/android:label="hesabyar"/android:label="حساب‌یار"/' "$MF"
          sed -i '0,/<\/activity>/s#</activity>#    <intent-filter>\n                <action android:name="android.intent.action.VIEW"/>\n                <category android:name="android.intent.category.DEFAULT"/>\n                <category android:name="android.intent.category.BROWSABLE"/>\n                <data android:scheme="hesabyar" android:host="login-callback"/>\n            </intent-filter>\n        </activity>#' "$MF"
          grep -q "android.permission.INTERNET" "$MF" || { echo "INTERNET permission was not added"; exit 1; }
          grep -q 'android:scheme="hesabyar"' "$MF" || { echo "deep link was not added"; exit 1; }

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Dart unit tests (money, CSV, backup, redact)
        run: flutter test

      - name: SQL tests (migrations, RLS, backup/restore)
        env:
          PGPASSWORD: ci_only_password
        run: PSQL="psql -h localhost -U postgres" bash supabase/tests/run_all.sh

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabyar-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Supabase migrations
        uses: actions/upload-artifact@v4
        with:
          name: supabase
          path: supabase/migrations
