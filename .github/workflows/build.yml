              false;

          InputDecoration deco(String l, {IconData? icon}) => InputDecoration(
                labelText: l,
                prefixIcon: icon == null ? null : Icon(icon),
                filled: true,
                border: OutlineInputBorder(
                    borderRadius: BorderRadius.circular(16), borderSide: BorderSide.none),
              );

          Future<bool> run(BuildContext c, Future<void> Function() f,
              {bool reload = true, bool needsNet = true}) async {
            final m = ScaffoldMessenger.of(c);
            void msg(String t) => m.showSnackBar(
                SnackBar(content: Text(t), behavior: SnackBarBehavior.floating));
            if (needsNet && store.offline) {
              await store.load(); // connection may be back: re-check before refusing
              if (store.offline) {
                msg('اتصال برقرار نیست؛ در حالت آفلاین امکان ثبت تغییر وجود ندارد');
                return false;
              }
            }
            try {
              await f();
              if (reload) await store.load();
              return true;
            } on PostgrestException catch (e) {
              AppLog.error('db', e);
              msg(friendlyError('${e.code ?? ''} ${e.message}'));
            } on AuthException catch (e) {
              AppLog.error('auth', e);
              msg(authMessage(e));
            } on StorageException catch (e) {
              AppLog.error('storage', e);
              msg('خطای فضای ذخیره‌سازی؛ دوباره تلاش کنید');
            } catch (e) {
              AppLog.error('run', e);
              msg(friendlyError(e));
            }
            return false;
          }

