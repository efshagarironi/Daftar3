name: Build HesabYar APK

# حساب‌یار: ساخت خودکار پروژه Flutter + تست + APK (فقط همین یک فایل لازم است)
# مسیر فایل در ریپازیتوری: .github/workflows/main.yml
# پیش‌نیاز: در Settings > Secrets and variables > Actions دو Secret بسازید:
#   SUPABASE_URL  و  SUPABASE_ANON_KEY
# (فقط anon key؛ هرگز service_role را اینجا نگذارید)
# پیش از اولین اجرا: migrationهای 0001 و 0002 را (از artifact با نام supabase) در Supabase SQL Editor اجرا کنید.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter project and write source files
        run: |
          set -euo pipefail
          flutter create --org com.hesabyar --project-name hesabyar --platforms android .
          rm -rf test
          mkdir -p supabase/migrations supabase/tests test docs assets/fonts
          cat > pubspec.yaml <<'F0_EOF'
          name: hesabyar
          description: Debt and receivables manager with cloud backup
          publish_to: none
          version: 1.0.0+1
          environment:
            sdk: ">=3.3.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            supabase_flutter: ^2.8.0
            shared_preferences: ^2.3.2
            path_provider: ^2.1.4
            share_plus: ^10.1.4
            crypto: ^3.0.5
            pdf: ^3.11.1
            file_picker: ^8.1.2
          dev_dependencies:
            flutter_test:
              sdk: flutter
          flutter:
            uses-material-design: true
            fonts:
              - family: Vazirmatn
                fonts:
                  - asset: assets/fonts/Vazirmatn-Regular.ttf
                  - asset: assets/fonts/Vazirmatn-Bold.ttf
                    weight: 700
            assets:
              - assets/fonts/
          F0_EOF
          cat > lib/main.dart <<'F1_EOF'
          import 'dart:async';
          import 'dart:ui' show PlatformDispatcher;
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:flutter_localizations/flutter_localizations.dart';
          import 'package:supabase_flutter/supabase_flutter.dart';
          import 'data.dart';
          import 'screens.dart';

          Future<void> main() async {
            runZonedGuarded(() async {
              WidgetsFlutterBinding.ensureInitialized();
              await AppLog.init();
              FlutterError.onError = (d) {
                FlutterError.presentError(d);
                AppLog.error('flutter', d.exception);
              };
              PlatformDispatcher.instance.onError = (e, st) {
                AppLog.error('platform', e);
                return true;
              };
              if (kConfigured) {
                await Supabase.initialize(url: kUrl, anonKey: kKey);
              }
              runApp(const HesabYarApp());
            }, (e, st) => AppLog.error('zone', e));
          }

          class HesabYarApp extends StatelessWidget {
            const HesabYarApp({super.key});

            ThemeData _theme(Brightness b) {
              final cs = ColorScheme.fromSeed(seedColor: const Color(0xFF0E7C86), brightness: b);
              final base = ThemeData(useMaterial3: true, colorScheme: cs, fontFamily: 'Vazirmatn');
              return base.copyWith(
                scaffoldBackgroundColor: b == Brightness.light ? const Color(0xFFF3F7F8) : null,
                appBarTheme: const AppBarTheme(
                    scrolledUnderElevation: 0, backgroundColor: Colors.transparent),
                materialTapTargetSize: MaterialTapTargetSize.padded, // >= 48dp touch targets
              );
            }

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'حساب‌یار',
                debugShowCheckedModeBanner: false,
                locale: const Locale('fa'),
                supportedLocales: const [Locale('fa')],
                localizationsDelegates: const [
                  GlobalMaterialLocalizations.delegate,
                  GlobalWidgetsLocalizations.delegate,
                  GlobalCupertinoLocalizations.delegate,
                ],
                theme: _theme(Brightness.light),
                darkTheme: _theme(Brightness.dark),
                // Responsive + accessible shell: RTL, text scale allowed up to 1.6x,
                // content width capped on tablets / landscape so lines stay readable.
                builder: (context, child) {
                  final mq = MediaQuery.of(context);
                  return MediaQuery(
                    data: mq.copyWith(
                        textScaler: mq.textScaler.clamp(minScaleFactor: 0.85, maxScaleFactor: 1.6)),
                    child: Directionality(
                      textDirection: TextDirection.rtl,
                      child: ColoredBox(
                        color: Theme.of(context).scaffoldBackgroundColor,
                        child: Center(
                          child: ConstrainedBox(
                            constraints: const BoxConstraints(maxWidth: 720),
                            child: child ?? const SizedBox.shrink(),
                          ),
                        ),
                      ),
                    ),
                  );
                },
                home: const Root(),
              );
            }
          }

          class Root extends StatefulWidget {
            const Root({super.key});
            @override
            State<Root> createState() => _RootState();
          }

          class _RootState extends State<Root> {
            StreamSubscription<AuthState>? _sub;

            @override
            void initState() {
              super.initState();
              if (kConfigured) {
                _sub = sb.auth.onAuthStateChange.listen((s) {
                  if (s.event == AuthChangeEvent.passwordRecovery) recoveryMode.value = true;
                  if (s.event == AuthChangeEvent.signedOut) recoveryMode.value = false;
                });
              }
            }

            @override
            void dispose() {
              _sub?.cancel();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              if (!kConfigured) return const SetupPage();
              return StreamBuilder<AuthState>(
                stream: sb.auth.onAuthStateChange,
                builder: (context, snap) {
                  final s = sb.auth.currentSession;
                  if (s == null) return const AuthPage();
                  return ValueListenableBuilder<bool>(
                    valueListenable: recoveryMode,
                    builder: (_, rec, __) => rec ? const NewPasswordPage() : Home(key: ValueKey(s.user.id)),
                  );
                },
              );
            }
          }
          F1_EOF
          cat > lib/data.dart <<'F2_EOF'
          import 'dart:convert';
          import 'dart:typed_data';
          import 'package:flutter/foundation.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:supabase_flutter/supabase_flutter.dart';
          import 'logic.dart';
          export 'logic.dart';

          // Only the PUBLIC project URL and the anon key are ever compiled in
          // (--dart-define). The service_role key must never appear in this app.
          const kUrl = String.fromEnvironment('SUPABASE_URL');
          const kKey = String.fromEnvironment('SUPABASE_ANON_KEY');
          // Deep link used by e-mail confirmation / password-reset links. It must also be
          // listed under Supabase -> Authentication -> URL Configuration -> Redirect URLs.
          const kAuthRedirect =
              String.fromEnvironment('AUTH_REDIRECT', defaultValue: 'hesabyar://login-callback/');
          bool get kConfigured => kUrl.isNotEmpty && kKey.isNotEmpty;
          SupabaseClient get sb => Supabase.instance.client;
          String uid() => sb.auth.currentUser!.id;

          final unit = ValueNotifier<String>('تومان');
          final recoveryMode = ValueNotifier<bool>(false); // true while the user sets a new password
          String profileName = '';

          // ---------- secret-free diagnostic log ----------
          // Messages are passed through redact() (JWTs, keys, e-mails, long ids are removed)
          // and never include request/response bodies or financial data.
          class AppLog {
            static const _k = 'app_log';
            static final List<String> _mem = [];

            static Future<void> init() async {
              try {
                final p = await SharedPreferences.getInstance();
                _mem
                  ..clear()
                  ..addAll(p.getStringList(_k) ?? const []);
              } catch (_) {}
            }

            static void error(String where, Object e) => add('ERROR', '$where ${e.runtimeType}: $e');

            static Future<void> add(String level, String msg) async {
              final line = '${DateTime.now().toUtc().toIso8601String()} [$level] ${redact(msg)}';
              _mem.add(line);
              if (_mem.length > 200) _mem.removeAt(0);
              if (kDebugMode) debugPrint(line);
              try {
                final p = await SharedPreferences.getInstance();
                await p.setStringList(_k, List<String>.of(_mem));
              } catch (_) {}
            }

            static String dump() => _mem.isEmpty ? '(خالی)' : _mem.join('\n');

            static Future<void> clear() async {
              _mem.clear();
              try {
                final p = await SharedPreferences.getInstance();
                await p.remove(_k);
              } catch (_) {}
            }
          }

          // ---------- model ----------
          class Acc {
            final Map<String, dynamic> m;
            Acc(this.m);
            String get id => m['id'] as String;
            String get contactId => m['contact_id'] as String;
            String get title => (m['title'] ?? '') as String;
            bool get isRec => m['type'] == 'receivable';
            int get principal => (m['principal_amount'] as num).toInt();
            List<dynamic> get txs => (m['transactions'] as List<dynamic>?) ?? [];
            int get paid => txs.fold<int>(0, (s, t) => s + (t['amount'] as num).toInt());
            int get remaining => principal - paid;
            bool get settled => remaining <= 0;
            String get who => ((m['contacts'] as Map?)?['name'] ?? '') as String;
            DateTime? get due => m['due_at'] == null ? null : DateTime.tryParse(m['due_at'] as String);
            DateTime? get opened =>
                DateTime.tryParse((m['opened_at'] ?? m['created_at'] ?? '') as String);
          }

          String money(int v) => '${faDigits(groupDigits(v))} ${unit.value}';

          // ---------- store (online-first, read-only offline cache) ----------
          class Store extends ChangeNotifier {
            List<Map<String, dynamic>> rawAccs = [];
            List<Map<String, dynamic>> contacts = []; // includes archived ones
            bool loading = false;
            bool offline = false;
            DateTime? lastSync;
            List<Acc> get accs => rawAccs.map(Acc.new).toList();
            List<Map<String, dynamic>> get activeContacts =>
                contacts.where((c) => c['archived_at'] == null).toList();

            void refreshUI() => notifyListeners();

            Future<void> load() async {
              loading = true;
              notifyListeners();
              final p = await SharedPreferences.getInstance();
              final key = 'cache_${uid()}';
              try {
                final c = await sb.from('contacts').select().order('name');
                final a = await sb
                    .from('accounts')
                    .select('*, contacts(name), transactions(id,amount,transaction_date,note)')
                    .order('created_at', ascending: false);
                contacts = List<Map<String, dynamic>>.from(c);
                rawAccs = List<Map<String, dynamic>>.from(a);
                offline = false;
                lastSync = DateTime.now();
                await p.setString(key, jsonEncode({'c': contacts, 'a': rawAccs, 't': lastSync!.toIso8601String()}));
              } catch (e) {
                AppLog.error('load', e);
                offline = true;
                final s = p.getString(key);
                if (s != null) {
                  try {
                    final j = jsonDecode(s);
                    contacts = List<Map<String, dynamic>>.from(j['c']);
                    rawAccs = List<Map<String, dynamic>>.from(j['a']);
                    lastSync = DateTime.tryParse('${j['t'] ?? ''}');
                  } catch (e2) {
                    AppLog.error('cache', e2);
                  }
                }
              }
              loading = false;
              notifyListeners();
            }

            Future<void> clear() async {
              rawAccs = [];
              contacts = [];
              lastSync = null;
              final p = await SharedPreferences.getInstance();
              for (final k in p.getKeys().where((k) => k.startsWith('cache_')).toList()) {
                await p.remove(k);
              }
              notifyListeners();
            }
          }

          final store = Store();

          Future<void> loadProfile() async {
            try {
              final r = await sb.from('profiles').select().maybeSingle();
              if (r != null) {
                unit.value = (r['currency_unit'] ?? 'تومان') as String;
                profileName = (r['display_name'] ?? '') as String;
              }
            } catch (e) {
              AppLog.error('profile', e);
            }
          }

          // ---------- backup ----------
          Future<List<Map<String, dynamic>>> fetchAll(String table) async {
            final out = <Map<String, dynamic>>[];
            var from = 0;
            while (true) {
              final r = await sb
                  .from(table)
                  .select()
                  .order('created_at')
                  .order('id')
                  .range(from, from + 999);
              out.addAll(List<Map<String, dynamic>>.from(r));
              if (r.length < 1000) break;
              from += 1000;
            }
            return out;
          }

          /// Versioned snapshot (format_version 2): data + counts + canonical SHA-256.
          Future<Map<String, dynamic>> snapshot() async {
            final data = <String, dynamic>{
              'contacts': await fetchAll('contacts'),
              'accounts': await fetchAll('accounts'),
              'transactions': await fetchAll('transactions'),
            };
            return makeBackup(data, DateTime.now().toUtc());
          }

          Future<void> createBackup() async {
            final snap = await snapshot();
            final bytes = Uint8List.fromList(utf8.encode(jsonEncode(snap)));
            final path = '${uid()}/backup_${DateTime.now().toUtc().millisecondsSinceEpoch}.json';
            await sb.storage.from('backups').uploadBinary(path, bytes,
                fileOptions: const FileOptions(contentType: 'application/json'));
            try {
              await sb.from('backup_records').insert({
                'user_id': uid(),
                'storage_path': path,
                'format_version': kBackupVersion,
                'file_size': bytes.length,
                'checksum': snap['checksum'],
                'status': 'ok',
              });
            } catch (e) {
              // do not leave an orphan file behind if the record could not be written
              try {
                await sb.storage.from('backups').remove([path]);
              } catch (_) {}
              rethrow;
            }
          }

          /// Downloads a cloud backup and validates version, structure, counts, rows and checksum.
          Future<Map<String, dynamic>> readBackup(String path) async {
            final bytes = await sb.storage.from('backups').download(path);
            return parseBackupBytes(bytes);
          }

          Future<Map<String, dynamic>> previewRestore(Map<String, dynamic> data, String mode) async {
            final r = await sb.rpc('preview_restore', params: {'payload': data, 'p_mode': mode});
            return Map<String, dynamic>.from(r as Map);
          }

          Future<Map<String, dynamic>> restoreData(Map<String, dynamic> data, String mode) async {
            final r = await sb.rpc('restore_user_data', params: {'payload': data, 'p_mode': mode});
            return Map<String, dynamic>.from(r as Map);
          }

          Future<void> pruneBackups(int keep) async {
            final r = await sb
                .from('backup_records')
                .select('id,storage_path')
                .order('created_at', ascending: false)
                .range(keep, keep + 200);
            final old = List<Map<String, dynamic>>.from(r);
            if (old.isEmpty) return;
            await sb.storage.from('backups').remove(old.map((e) => e['storage_path'] as String).toList());
            await sb.from('backup_records').delete().inFilter('id', old.map((e) => e['id']).toList());
          }

          Future<void> autoBackupIfDue() async {
            try {
              final p = await SharedPreferences.getInstance();
              if (!(p.getBool('auto_backup') ?? false)) return;
              final r = await sb
                  .from('backup_records')
                  .select('created_at')
                  .order('created_at', ascending: false)
                  .limit(1);
              if (r.isNotEmpty) {
                final last = DateTime.parse(r.first['created_at'] as String).toLocal();
                if (DateTime.now().difference(last).inHours < 24) return;
              }
              await createBackup();
              await pruneBackups(10);
            } catch (e) {
              AppLog.error('autobackup', e);
            }
          }
          F2_EOF
          cat > lib/logic.dart <<'F3_EOF'
          // Pure Dart (no Flutter / Supabase imports) so it can be unit-tested anywhere.
          import 'dart:convert';
          import 'dart:typed_data';
          import 'package:crypto/crypto.dart';

          // ------------------------------------------------------------------ money
          /// Largest amount accepted anywhere (matches the DB CHECK constraints).
          const int kMaxAmount = 1000000000000000;

          String faDigits(String s) {
            var o = s;
            for (var i = 0; i < 10; i++) {
              o = o.replaceAll('$i', String.fromCharCode(0x06F0 + i));
            }
            return o;
          }

          /// Parses user input (Persian/Arabic/Latin digits, any thousands separator)
          /// into an integer amount in the smallest currency unit. Never uses double.
          /// Returns null for empty, non-numeric, decimal, negative or oversized input.
          int? parseAmount(String s) {
            var t = s.trim();
            for (var i = 0; i < 10; i++) {
              t = t
                  .replaceAll(String.fromCharCode(0x06F0 + i), '$i')
                  .replaceAll(String.fromCharCode(0x0660 + i), '$i');
            }
            t = t.replaceAll(RegExp(r'[,،٬\s]'), '');
            if (!RegExp(r'^\d{1,16}$').hasMatch(t)) return null;
            final v = int.tryParse(t);
            if (v == null || v > kMaxAmount) return null;
            return v;
          }

          String groupDigits(int v) => v
              .toString()
              .replaceAllMapped(RegExp(r'\B(?=(\d{3})+(?!\d))'), (m) => '٬');

          String _p2(int n) => n.toString().padLeft(2, '0');
          String ymd(DateTime d) => '${d.year}-${_p2(d.month)}-${_p2(d.day)}';
          String fmtDate(DateTime d) => faDigits('${d.year}/${_p2(d.month)}/${_p2(d.day)}');

          /// remaining = principal - sum(payments); all integers.
          int remainingOf(int principal, Iterable<int> payments) =>
              principal - payments.fold<int>(0, (s, a) => s + a);

          bool isSettled(int principal, Iterable<int> payments) =>
              remainingOf(principal, payments) <= 0;

          /// Net position: receivables (+) minus payables (-) over OPEN accounts only.
          int netPosition(Iterable<({bool isReceivable, int remaining})> accounts) {
            var s = 0;
            for (final a in accounts) {
              if (a.remaining <= 0) continue;
              s += a.isReceivable ? a.remaining : -a.remaining;
            }
            return s;
          }

          // -------------------------------------------------------------------- csv
          /// Quotes a CSV cell and neutralises spreadsheet formula injection
          /// (cells starting with = + - @ TAB CR would be executed by Excel/Sheets).
          String csvCell(Object? v) {
            var s = '${v ?? ''}';
            if (v is String && s.isNotEmpty && '=+-@\t\r'.contains(s[0])) s = "'$s";
            return '"${s.replaceAll('"', '""')}"';
          }

          String csvFromRows(List<List<Object?>> rows) =>
              '﻿${rows.map((r) => r.map(csvCell).join(',')).join('\r\n')}';

          // ----------------------------------------------------------------- backup
          const int kBackupVersion = 2;
          const Set<int> kReadableBackupVersions = {1, 2};

          class BackupException implements Exception {
            final String message; // Persian, safe to show to the user
            const BackupException(this.message);
            @override
            String toString() => message;
          }

          /// Deterministic JSON: object keys sorted recursively.
          Object? canonicalize(Object? v) {
            if (v is Map) {
              final keys = v.keys.map((k) => '$k').toList()..sort();
              return {for (final k in keys) k: canonicalize(v[k])};
            }
            if (v is List) return v.map(canonicalize).toList();
            return v;
          }

          String canonicalJson(Object? v) => jsonEncode(canonicalize(v));

          /// v1 backups hashed jsonEncode(data) in insertion order; v2 uses canonical JSON.
          String backupChecksum(Object? data, {int version = kBackupVersion}) {
            final text = version == 1 ? jsonEncode(data) : canonicalJson(data);
            return sha256.convert(utf8.encode(text)).toString();
          }

          Map<String, int> backupCounts(Map<String, dynamic> data) => {
                'contacts': (data['contacts'] as List).length,
                'accounts': (data['accounts'] as List).length,
                'transactions': (data['transactions'] as List).length,
              };

          Map<String, dynamic> makeBackup(Map<String, dynamic> data, DateTime nowUtc,
              {String appVersion = '1.0.0'}) {
            return {
              'app': 'hesabyar',
              'format_version': kBackupVersion,
              'app_version': appVersion,
              'created_at': nowUtc.toUtc().toIso8601String(),
              'counts': backupCounts(data),
              'checksum': backupChecksum(data),
              'data': data,
            };
          }

          /// Parses + fully validates a backup file. Throws [BackupException] with a
          /// Persian message on any problem; returns the decoded map when valid.
          Map<String, dynamic> parseBackupBytes(Uint8List bytes) {
            if (bytes.length > 10 * 1024 * 1024) {
              throw const BackupException('حجم فایل پشتیبان بیش از حد مجاز است');
            }
            Object? j;
            try {
              j = jsonDecode(utf8.decode(bytes));
            } catch (_) {
              throw const BackupException('فایل پشتیبان معتبر نیست (JSON ناخوانا)');
            }
            return validateBackup(j);
          }

          Map<String, dynamic> validateBackup(Object? j) {
            if (j is! Map || j['app'] != 'hesabyar') {
              throw const BackupException('این فایل، پشتیبان حساب‌یار نیست');
            }
            final v = j['format_version'];
            if (v is! int || !kReadableBackupVersions.contains(v)) {
              throw const BackupException('نسخهٔ این فایل پشتیبان پشتیبانی نمی‌شود');
            }
            final data = j['data'];
            if (data is! Map ||
                data['contacts'] is! List ||
                data['accounts'] is! List ||
                data['transactions'] is! List) {
              throw const BackupException('ساختار فایل پشتیبان ناقص است');
            }
            if (backupChecksum(data, version: v) != j['checksum']) {
              throw const BackupException('فایل پشتیبان خراب یا دستکاری شده است (checksum نامعتبر)');
            }
            if (v >= 2) {
              final c = j['counts'];
              final actual = backupCounts(Map<String, dynamic>.from(data));
              if (c is! Map ||
                  c['contacts'] != actual['contacts'] ||
                  c['accounts'] != actual['accounts'] ||
                  c['transactions'] != actual['transactions']) {
                throw const BackupException('تعداد رکوردهای فایل پشتیبان با محتوای آن نمی‌خواند');
              }
            }
            _validateRows(Map<String, dynamic>.from(data));
            return Map<String, dynamic>.from(j);
          }

          void _validateRows(Map<String, dynamic> data) {
            const bad = BackupException('داده‌های داخل فایل پشتیبان نامعتبر است');
            bool okAmount(Object? a) => a is int && a > 0 && a <= kMaxAmount;
            final contactIds = <String>{};
            for (final c in data['contacts'] as List) {
              if (c is! Map || c['id'] is! String || c['name'] is! String) throw bad;
              if (!contactIds.add(c['id'] as String)) throw bad;
            }
            final accountIds = <String>{};
            for (final a in data['accounts'] as List) {
              if (a is! Map || a['id'] is! String) throw bad;
              if (!okAmount(a['principal_amount'])) throw bad;
              if (a['type'] != 'receivable' && a['type'] != 'payable') throw bad;
              if (!contactIds.contains(a['contact_id'])) throw bad;
              if (!accountIds.add(a['id'] as String)) throw bad;
            }
            final txIds = <String>{};
            for (final t in data['transactions'] as List) {
              if (t is! Map || t['id'] is! String) throw bad;
              if (!okAmount(t['amount'])) throw bad;
              if (!accountIds.contains(t['account_id'])) throw bad;
              if (!txIds.add(t['id'] as String)) throw bad;
            }
          }

          // --------------------------------------------------------- logging / errors
          /// Removes anything that looks like a secret or personal identifier before a
          /// message is stored or shared: JWTs, bearer tokens, API keys, long opaque
          /// strings, e-mail addresses, and password/key/token assignments.
          String redact(String s) {
            var o = s;
            o = o.replaceAll(RegExp(r'eyJ[A-Za-z0-9_\-]{5,}\.[A-Za-z0-9_\-]{5,}\.[A-Za-z0-9_\-]*'), '[jwt]');
            o = o.replaceAllMapped(RegExp(r'(bearer\s+)[A-Za-z0-9._\-]+', caseSensitive: false), (m) => '${m[1]}[token]');
            o = o.replaceAllMapped(
                RegExp(r'''(password|passwd|pass|secret|token|apikey|api_key|anon_?key|authorization)(["']?\s*[:=]\s*["']?)[^\s,"'&}]+''',
                    caseSensitive: false),
                (m) => '${m[1]}${m[2]}[redacted]');
            o = o.replaceAll(RegExp(r'[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}'), '[email]');
            o = o.replaceAll(RegExp(r'\b[A-Za-z0-9_\-]{32,}\b'), '[id]');
            return o.length > 500 ? '${o.substring(0, 500)}…' : o;
          }

          /// Maps server / network error text to a short Persian message.
          String friendlyError(Object e) {
            final m = '$e';
            if (e is BackupException) return e.message;
            if (m.contains('backup_id_conflict')) {
              return 'این فایل متعلق به حساب دیگری است؛ برای ورود آن از حالت «ادغام» استفاده کنید';
            }
            if (m.contains('dangling_reference') || m.contains('invalid_payload')) {
              return 'ساختار فایل پشتیبان نامعتبر است';
            }
            if (m.contains('payload_too_large')) return 'فایل پشتیبان بیش از حد بزرگ است';
            if (m.contains('not_authenticated')) return 'نشست شما منقضی شده؛ دوباره وارد شوید';
            if (m.contains('SocketException') ||
                m.contains('ClientException') ||
                m.contains('TimeoutException') ||
                m.contains('Failed host lookup')) {
              return 'اتصال برقرار نیست؛ اینترنت را بررسی و دوباره تلاش کنید';
            }
            if (m.contains('row-level security') || m.contains('permission denied')) {
              return 'دسترسی مجاز نیست';
            }
            if (m.contains('violates check constraint')) return 'مقدار واردشده مجاز نیست';
            return 'خطایی رخ داد؛ دوباره تلاش کنید';
          }

          bool isValidEmail(String s) =>
              RegExp(r'^[^\s@]+@[^\s@]+\.[^\s@]{2,}$').hasMatch(s.trim());

          /// Returns a Persian problem description, or null when the password is acceptable.
          String? passwordProblem(String p) {
            if (p.length < 8) return 'رمز عبور باید حداقل ۸ کاراکتر باشد';
            if (!RegExp(r'\p{L}', unicode: true).hasMatch(p) || !RegExp(r'\d').hasMatch(p)) {
              return 'رمز عبور باید ترکیبی از حرف و عدد باشد';
            }
            return null;
          }

          String fmtTime(DateTime d) => faDigits('${_p2(d.hour)}:${_p2(d.minute)}');
