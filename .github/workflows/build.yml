            final headers = ['شخص', 'عنوان', 'نوع', 'مبلغ اولیه', 'پرداخت‌شده', 'مانده', 'سررسید', 'وضعیت'];
            final rows = <List<String>>[
              for (final a in accs)
                [
                  a.who,
                  a.title,
                  a.isRec ? 'طلب' : 'بدهی',
                  faDigits(groupDigits(a.principal)),
                  faDigits(groupDigits(a.paid)),
                  faDigits(groupDigits(a.remaining < 0 ? 0 : a.remaining)),
                  a.due == null ? '-' : fmtDate(a.due!),
                  a.settled ? 'تسویه' : 'باز',
                ]
            ];

            pw.Widget kv(String k, String v) => pw.Padding(
                  padding: const pw.EdgeInsets.symmetric(vertical: 2),
                  child: pw.Row(mainAxisAlignment: pw.MainAxisAlignment.spaceBetween, children: [
                    pw.Text(k),
                    pw.Text(v, style: pw.TextStyle(font: bold)),
                  ]),
                );

            doc.addPage(pw.MultiPage(
              pageFormat: PdfPageFormat.a4,
              textDirection: pw.TextDirection.rtl,
              margin: const pw.EdgeInsets.all(28),
              footer: (c) => pw.Align(
                alignment: pw.Alignment.center,
                child: pw.Text('${faDigits('${c.pageNumber}')} / ${faDigits('${c.pagesCount}')}',
                    style: const pw.TextStyle(fontSize: 9)),
              ),
              build: (c) => [
                pw.Text('گزارش حساب‌یار', style: pw.TextStyle(font: bold, fontSize: 20)),
                pw.SizedBox(height: 4),
                pw.Text('تاریخ تهیه: ${fmtDate(DateTime.now())}${owner.isEmpty ? '' : '  |  $owner'}',
                    style: const pw.TextStyle(fontSize: 10)),
                pw.SizedBox(height: 12),
                pw.Container(
                  padding: const pw.EdgeInsets.all(10),
                  decoration: pw.BoxDecoration(
                      border: pw.Border.all(color: PdfColors.grey500), borderRadius: pw.BorderRadius.circular(6)),
                  child: pw.Column(children: [
                    kv('مجموع طلب‌ها (مانده)', m(rec)),
                    kv('مجموع بدهی‌ها (مانده)', m(pay)),
                    kv('خالص', m(rec - pay)),
                    kv('تعداد حساب‌های باز', faDigits('${open.length}')),
                  ]),
                ),
                pw.SizedBox(height: 14),
                if (rows.isEmpty)
                  pw.Text('حسابی ثبت نشده است.')
                else
                  pw.TableHelper.fromTextArray(
                    headers: headers,
                    data: rows,
                    cellStyle: const pw.TextStyle(fontSize: 9),
                    headerStyle: pw.TextStyle(font: bold, fontSize: 9),
                    headerDecoration: const pw.BoxDecoration(color: PdfColors.grey300),
                    cellAlignment: pw.Alignment.center,
                    border: pw.TableBorder.all(color: PdfColors.grey400, width: .5),
                  ),
              ],
            ));
            return doc.save();
