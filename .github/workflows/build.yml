          class _AccountsPageState extends State<AccountsPage> {
            String q = '', type = 'all', st = 'open';
            DateTimeRange? range;

            Widget _chip(String label, bool sel, VoidCallback f) => Padding(
                  padding: const EdgeInsetsDirectional.only(end: 8),
                  child: ChoiceChip(label: Text(label), selected: sel, onSelected: (_) => f()),
                );

            @override
            Widget build(BuildContext context) {
              return ListenableBuilder(
                listenable: Listenable.merge([store, unit]),
                builder: (c, _) {
                  final list = store.accs.where((a) {
                    if (type == 'rec' && !a.isRec) return false;
                    if (type == 'pay' && a.isRec) return false;
                    if (st == 'open' && a.settled) return false;
                    if (st == 'settled' && !a.settled) return false;
                    if (q.isNotEmpty && !(a.who.contains(q) || a.title.contains(q))) return false;
                    if (range != null) {
                      final o = a.opened;
                      if (o == null || o.isBefore(range!.start) || o.isAfter(range!.end)) return false;
                    }
                    return true;
                  }).toList();
                  return RefreshIndicator(
                    onRefresh: store.load,
                    child: ListView(
                      physics: const AlwaysScrollableScrollPhysics(),
                      padding: const EdgeInsets.fromLTRB(16, 16, 16, 100),
                      children: [
                        offlineBanner(c),
                        Row(children: [
                          Expanded(
                            child: TextField(
                                onChanged: (v) => setState(() => q = v.trim()),
                                decoration: deco('جستجوی نام یا عنوان', icon: Icons.search)),
                          ),
                          const SizedBox(width: 8),
                          IconButton.filledTonal(
                          tooltip: range == null ? 'فیلتر بازهٔ تاریخ' : 'حذف فیلتر تاریخ',
                            icon: Icon(range == null ? Icons.date_range : Icons.close),
                            onPressed: () async {
                              if (range != null) {
                                setState(() => range = null);
                                return;
                              }
                              final r = await showDateRangePicker(
                                  context: c,
                                  firstDate: DateTime(2000),
                                  lastDate: DateTime(2100));
                              if (r != null) setState(() => range = r);
                            },
                          ),
                        ]),
                        const SizedBox(height: 12),
                        SingleChildScrollView(
                          scrollDirection: Axis.horizontal,
                          child: Row(children: [
                            _chip('همه', type == 'all', () => setState(() => type = 'all')),
                            _chip('طلب', type == 'rec', () => setState(() => type = 'rec')),
                            _chip('بدهی', type == 'pay', () => setState(() => type = 'pay')),
                            const SizedBox(width: 12),
                            _chip('باز', st == 'open', () => setState(() => st = 'open')),
                            _chip('تسویه‌شده', st == 'settled', () => setState(() => st = 'settled')),
                            _chip('همه وضعیت‌ها', st == 'all', () => setState(() => st = 'all')),
                          ]),
                        ),
                        const SizedBox(height: 12),
                        if (list.isEmpty) emptyBox('حسابی پیدا نشد'),
                        ...list.map((a) => AccTile(a)),
                      ],
                    ),
                  );
                },
              );
            }
          }

          // ---------- people ----------
          Future<void> personDialog(BuildContext c, {Map<String, dynamic>? edit}) async {
            final n = TextEditingController(text: '${edit?['name'] ?? ''}');
            final p = TextEditingController(text: '${edit?['phone'] ?? ''}');
            final no = TextEditingController(text: '${edit?['notes'] ?? ''}');
            final ok = await showDialog<bool>(
              context: c,
              builder: (ctx) => AlertDialog(
                title: Text(edit == null ? 'شخص جدید' : 'ویرایش شخص'),
                content: SingleChildScrollView(
                  child: Column(mainAxisSize: MainAxisSize.min, children: [
                    TextField(controller: n, decoration: deco('نام')),
                    const SizedBox(height: 12),
                    TextField(
                        controller: p,
                        keyboardType: TextInputType.phone,
                        decoration: deco('شماره تماس (اختیاری)')),
                    const SizedBox(height: 12),
                    TextField(controller: no, maxLines: 2, decoration: deco('توضیحات (اختیاری)')),
                  ]),
                ),
                actions: [
                  TextButton(onPressed: () => Navigator.pop(ctx, false), child: const Text('انصراف')),
                  FilledButton(onPressed: () => Navigator.pop(ctx, true), child: const Text('ذخیره')),
                ],
              ),
            );
            if (ok != true) return;
            if (n.text.trim().isEmpty) {
              if (c.mounted) toast(c, 'نام شخص را وارد کنید');
              return;
            }
            if (!c.mounted) return;
            final body = {
              'name': n.text.trim(),
              'phone': p.text.trim().isEmpty ? null : p.text.trim(),
              'notes': no.text.trim().isEmpty ? null : no.text.trim(),
            };
            await run(c, () async {
              if (edit == null) {
                await sb.from('contacts').insert({...body, 'user_id': uid()});
              } else {
                await sb.from('contacts').update(body).eq('id', edit['id']);
              }
            });
          }

