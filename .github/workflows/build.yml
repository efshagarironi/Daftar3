          class _PaymentFormState extends State<PaymentForm> {
            final amt = TextEditingController(), note = TextEditingController();
            late DateTime date;
            bool busy = false;

            @override
            void initState() {
              super.initState();
              final e = widget.edit;
              amt.text = e == null ? '' : '${e['amount']}';
              note.text = e == null ? '' : '${e['note'] ?? ''}';
              date = e == null ? DateTime.now() : (DateTime.tryParse('${e['transaction_date']}') ?? DateTime.now());
            }

            @override
            void dispose() {
              amt.dispose();
              note.dispose();
              super.dispose();
            }

            Future<void> save() async {
              final a = widget.a;
              final e = widget.edit;
              final v = parseAmount(amt.text);
              if (v == null || v <= 0) {
                toast(context, 'مبلغ پرداخت معتبر نیست (فقط عدد صحیح)');
                return;
              }
              // remaining balance if this payment did not exist
              final before = a.remaining + (e == null ? 0 : (e['amount'] as num).toInt());
              if (v > before &&
                  !await confirm(context, 'پرداخت بیش از مانده',
                      'مبلغ واردشده از مانده (${money(before)}) بیشتر است. ثبت شود؟')) {
                return;
              }
              if (!mounted) return;
              setState(() => busy = true);
              final ok = await run(context, () async {
                final body = {
                  'amount': v,
                  'transaction_date': ymd(date),
                  'note': note.text.trim().isEmpty ? null : note.text.trim(),
                };
                if (e == null) {
                  await sb.from('transactions').insert({...body, 'user_id': uid(), 'account_id': a.id, 'type': 'payment'});
                } else {
                  await sb.from('transactions').update(body).eq('id', e['id']);
                }
                // account status is derived by a database trigger from integer sums
              });
              if (!mounted) return;
              setState(() => busy = false);
              if (ok) Navigator.pop(context);
            }

            @override
            Widget build(BuildContext context) {
              final a = widget.a;
              final e = widget.edit;
              final before = a.remaining + (e == null ? 0 : (e['amount'] as num).toInt());
              return Padding(
                padding: const EdgeInsets.fromLTRB(20, 0, 20, 20),
                child: Column(mainAxisSize: MainAxisSize.min, crossAxisAlignment: CrossAxisAlignment.start, children: [
                  Text(e == null ? 'ثبت پرداخت' : 'ویرایش پرداخت',
                      style: Theme.of(context).textTheme.titleLarge?.copyWith(fontWeight: FontWeight.bold)),
                  const SizedBox(height: 4),
                  Text('مانده${e == null ? ' فعلی' : ' (بدون این پرداخت)'}: ${money(before)}'),
                  const SizedBox(height: 12),
                  TextField(
                    controller: amt,
                    keyboardType: TextInputType.number,
                    decoration: deco('مبلغ (${unit.value})', icon: Icons.payments_outlined).copyWith(
                        suffix: TextButton(
                            onPressed: () => amt.text = '${before < 0 ? 0 : before}',
                            child: const Text('پرداخت کامل'))),
                  ),
                  const SizedBox(height: 12),
                  TextField(controller: note, maxLength: 500, decoration: deco('توضیحات (اختیاری)')),
                  const SizedBox(height: 8),
                  ListTile(
                    contentPadding: EdgeInsets.zero,
                    leading: const Icon(Icons.event),
                    title: Text('تاریخ پرداخت: ${fmtDate(date)}'),
                    onTap: () async {
                      final d = await showDatePicker(
