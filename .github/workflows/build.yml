                expect(backupChecksum(sampleData(), version: 1),
                    '13800471ec1c1a6b848c8fd5ffc47dc0851059e764d7e0d0fda84c69e4373317');
              });
              test('v2 is independent of key order', () {
                final a = {'x': 1, 'y': {'b': 2, 'a': 1}};
                final b = {'y': {'a': 1, 'b': 2}, 'x': 1};
                expect(backupChecksum(a), backupChecksum(b));
              });
