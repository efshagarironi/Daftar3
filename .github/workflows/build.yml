                          const SizedBox(height: 12),
                          Text(a.settled ? 'تسویه‌شده ✅' : 'مانده: ${money(a.remaining)}',
                              style: tt.headlineSmall?.copyWith(fontWeight: FontWeight.bold, color: col)),
                          const SizedBox(height: 12),
                          LinearProgressIndicator(
                              value: (a.paid / a.principal).clamp(0.0, 1.0).toDouble(),
                              minHeight: 10,
                              color: col,
                              borderRadius: BorderRadius.circular(8)),
                          const SizedBox(height: 12),
                          Row(mainAxisAlignment: MainAxisAlignment.spaceBetween, children: [
                            Text('مبلغ اولیه: ${money(a.principal)}'),
                            Text('پرداخت‌شده: ${money(a.paid)}'),
                          ]),
                          const SizedBox(height: 8),
                          if (a.opened != null) Text('تاریخ ثبت: ${fmtDate(a.opened!)}'),
                          if (a.due != null) Text('سررسید: ${fmtDate(a.due!)}'),
                          if (a.m['notes'] != null) Text('توضیحات: ${a.m['notes']}'),
                        ]),
                      ),
                      sec(c, 'پرداخت‌ها'),
                      if (txs.isEmpty) emptyBox('هنوز پرداختی ثبت نشده است'),
                      ...txs.map((t) => card(
                            c,
                            Row(children: [
                              Icon(Icons.payments_outlined, color: col),
                              const SizedBox(width: 12),
                              Expanded(
                                  child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                                Text(money((t['amount'] as num).toInt()),
                                    style: const TextStyle(fontWeight: FontWeight.bold)),
                                Text(fmtDate(DateTime.parse('${t['transaction_date']}')), style: tt.bodySmall),
                                if (t['note'] != null && '${t['note']}'.isNotEmpty) Text('${t['note']}', style: tt.bodySmall),
                              ])),
                              IconButton(
                                tooltip: 'ویرایش پرداخت',
                                icon: const Icon(Icons.edit_outlined),
                                onPressed: () => showModalBottomSheet(
                                    context: c,
                                    isScrollControlled: true,
                                    showDragHandle: true,
                                    builder: (ctx) => Padding(
                                        padding: EdgeInsets.only(bottom: MediaQuery.of(ctx).viewInsets.bottom),
                                        child: PaymentForm(a, edit: t))),
                              ),
                              IconButton(
                                tooltip: 'حذف پرداخت',
                                icon: const Icon(Icons.delete_outline),
                                onPressed: () async {
                                  if (await confirm(c, 'حذف پرداخت', 'این پرداخت حذف و مانده دوباره محاسبه می‌شود.', ok: 'حذف')) {
                                    if (!c.mounted) return;
                                    await run(c, () async {
                                      await sb.from('transactions').delete().eq('id', t['id']);
                                    });
                                  }
                                },
                              ),
                            ]),
                          )),
                    ]),
                  );
                },
              );
            }
          }

          class PaymentForm extends StatefulWidget {
            final Acc a;
            final Map<String, dynamic>? edit;
            const PaymentForm(this.a, {super.key, this.edit});
            @override
            State<PaymentForm> createState() => _PaymentFormState();
          }

          class _PaymentFormState extends State<PaymentForm> {
            final amt = TextEditingController(), note = TextEditingController();
            late DateTime date;
            bool busy = false;

            @override
            void initState() {
              super.initState();
              final e = widget.edit;
              amt.text = e == null ? '' : '${e['amount']}';
              note.text = e == null ? '' : '${e['note'] ?? ''}';
              date = e == null ? DateTime.now() : (DateTime.tryParse('${e['transaction_date']}') ?? DateTime.now());
            }

            @override
            void dispose() {
              amt.dispose();
              note.dispose();
              super.dispose();
            }

            Future<void> save() async {
              final a = widget.a;
              final e = widget.edit;
              final v = parseAmount(amt.text);
              if (v == null || v <= 0) {
                toast(context, 'مبلغ پرداخت معتبر نیست (فقط عدد صحیح)');
                return;
              }
              // remaining balance if this payment did not exist
              final before = a.remaining + (e == null ? 0 : (e['amount'] as num).toInt());
              if (v > before &&
                  !await confirm(context, 'پرداخت بیش از مانده',
                      'مبلغ واردشده از مانده (${money(before)}) بیشتر است. ثبت شود؟')) {
                return;
              }
              if (!mounted) return;
              setState(() => busy = true);
              final ok = await run(context, () async {
                final body = {
                  'amount': v,
                  'transaction_date': ymd(date),
                  'note': note.text.trim().isEmpty ? null : note.text.trim(),
                };
                if (e == null) {
                  await sb.from('transactions').insert({...body, 'user_id': uid(), 'account_id': a.id, 'type': 'payment'});
                } else {
                  await sb.from('transactions').update(body).eq('id', e['id']);
                }
                // account status is derived by a database trigger from integer sums
              });
              if (!mounted) return;
              setState(() => busy = false);
              if (ok) Navigator.pop(context);
            }

            @override
            Widget build(BuildContext context) {
              final a = widget.a;
              final e = widget.edit;
              final before = a.remaining + (e == null ? 0 : (e['amount'] as num).toInt());
              return Padding(
                padding: const EdgeInsets.fromLTRB(20, 0, 20, 20),
                child: Column(mainAxisSize: MainAxisSize.min, crossAxisAlignment: CrossAxisAlignment.start, children: [
                  Text(e == null ? 'ثبت پرداخت' : 'ویرایش پرداخت',
                      style: Theme.of(context).textTheme.titleLarge?.copyWith(fontWeight: FontWeight.bold)),
                  const SizedBox(height: 4),
                  Text('مانده${e == null ? ' فعلی' : ' (بدون این پرداخت)'}: ${money(before)}'),
                  const SizedBox(height: 12),
                  TextField(
                    controller: amt,
                    keyboardType: TextInputType.number,
                    decoration: deco('مبلغ (${unit.value})', icon: Icons.payments_outlined).copyWith(
                        suffix: TextButton(
                            onPressed: () => amt.text = '${before < 0 ? 0 : before}',
                            child: const Text('پرداخت کامل'))),
                  ),
                  const SizedBox(height: 12),
                  TextField(controller: note, maxLength: 500, decoration: deco('توضیحات (اختیاری)')),
                  const SizedBox(height: 8),
                  ListTile(
                    contentPadding: EdgeInsets.zero,
                    leading: const Icon(Icons.event),
                    title: Text('تاریخ پرداخت: ${fmtDate(date)}'),
                    onTap: () async {
                      final d = await showDatePicker(
                          context: context, initialDate: date, firstDate: DateTime(2000), lastDate: DateTime(2100));
                      if (d != null) setState(() => date = d);
                    },
                  ),
                  const SizedBox(height: 8),
                  SizedBox(
                      width: double.infinity,
                      height: 50,
                      child: FilledButton(onPressed: busy ? null : save, child: Text(e == null ? 'ثبت' : 'ذخیرهٔ تغییرات'))),
                ]),
              );
            }
          }

          // ---------- account form ----------
          void openAccountForm(BuildContext c, {Acc? edit, String? contactId}) {
            Navigator.push(c, MaterialPageRoute(builder: (_) => AccountFormPage(edit: edit, contactId: contactId)));
          }

          class AccountFormPage extends StatefulWidget {
            final Acc? edit;
            final String? contactId;
            const AccountFormPage({super.key, this.edit, this.contactId});
            @override
            State<AccountFormPage> createState() => _AccountFormPageState();
          }

          class _AccountFormPageState extends State<AccountFormPage> {
            late String? cid;
            late String type;
            final newName = TextEditingController();
            final title = TextEditingController();
            final amount = TextEditingController();
            final notes = TextEditingController();
            late DateTime opened;
            DateTime? due;
            bool busy = false;

            @override
            void initState() {
              super.initState();
              final e = widget.edit;
              cid = e?.contactId ?? widget.contactId ?? (store.activeContacts.isEmpty ? 'new' : null);
              type = e == null ? 'receivable' : (e.isRec ? 'receivable' : 'payable');
              title.text = e?.title ?? '';
              amount.text = e == null ? '' : '${e.principal}';
              notes.text = e == null ? '' : '${e.m['notes'] ?? ''}';
              opened = e?.opened ?? DateTime.now();
              due = e?.due;
            }

            Future<void> save() async {
              final amt = parseAmount(amount.text);
              if (cid == null) {
                toast(context, 'شخص را انتخاب کنید');
                return;
              }
              if (cid == 'new' && newName.text.trim().isEmpty) {
                toast(context, 'نام شخص را وارد کنید');
                return;
              }
              if (title.text.trim().isEmpty) {
                toast(context, 'عنوان حساب را وارد کنید');
                return;
              }
              if (amt == null || amt <= 0) {
                toast(context, 'مبلغ اولیه معتبر نیست');
                return;
              }
              final e = widget.edit;
              if (e != null && amt < e.paid) {
                toast(context, 'مبلغ اولیه نمی‌تواند کمتر از مجموع پرداخت‌های ثبت‌شده باشد');
                return;
              }
              setState(() => busy = true);
              final ok = await run(context, () async {
                var contact = cid;
                if (contact == 'new') {
                  final r = await sb.from('contacts').insert({'user_id': uid(), 'name': newName.text.trim()}).select('id').single();
                  contact = r['id'] as String;
                }
                final body = {
                  'contact_id': contact,
                  'type': type,
                  'title': title.text.trim(),
                  'principal_amount': amt,
                  'opened_at': ymd(opened),
                  'due_at': due == null ? null : ymd(due!),
                  'notes': notes.text.trim().isEmpty ? null : notes.text.trim(),
                };
                if (e == null) {
                  await sb.from('accounts').insert({...body, 'user_id': uid(), 'currency': unit.value});
                } else {
                  await sb.from('accounts').update(body).eq('id', e.id);
                }
              });
              if (!mounted) return;
              setState(() => busy = false);
              if (ok) Navigator.pop(context);
            }

            Future<DateTime?> pick(DateTime init) => showDatePicker(
                context: context, initialDate: init, firstDate: DateTime(2000), lastDate: DateTime(2100));

            @override
            Widget build(BuildContext context) {
              final e = widget.edit;
              return Scaffold(
                appBar: AppBar(title: Text(e == null ? 'ثبت حساب جدید' : 'ویرایش حساب')),
                body: ListView(padding: const EdgeInsets.all(16), children: [
                  SegmentedButton<String>(
                    segments: const [
                      ButtonSegment(value: 'receivable', label: Text('طلب (از او می‌گیرم)'), icon: Icon(Icons.south_west)),
                      ButtonSegment(value: 'payable', label: Text('بدهی (به او می‌دهم)'), icon: Icon(Icons.north_east)),
                    ],
                    selected: {type},
                    onSelectionChanged: (s) => setState(() => type = s.first),
                  ),
                  const SizedBox(height: 16),
                  DropdownButtonFormField<String>(
                    value: cid,
                    decoration: deco('شخص', icon: Icons.person_outline),
                    items:
