            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('تعیین رمز عبور جدید'), automaticallyImplyLeading: false, actions: [
                  TextButton(
                      onPressed: () async {
                        recoveryMode.value = false;
                        await sb.auth.signOut();
