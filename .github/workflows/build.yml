          class _NewPasswordPageState extends State<NewPasswordPage> {
            final p1 = TextEditingController(), p2 = TextEditingController();
            bool busy = false;

            @override
            void dispose() {
              p1.dispose();
              p2.dispose();
              super.dispose();
            }

            Future<void> save() async {
              final pe = passwordProblem(p1.text);
              if (pe != null) {
                toast(context, pe);
                return;
              }
              if (p1.text != p2.text) {
                toast(context, 'تکرار رمز عبور یکسان نیست');
                return;
              }
              setState(() => busy = true);
              try {
                await sb.auth.updateUser(UserAttributes(password: p1.text));
                recoveryMode.value = false;
                if (mounted) toast(context, 'رمز عبور جدید ثبت شد');
              } on AuthException catch (x) {
                AppLog.error('auth', x);
                if (mounted) toast(context, authMessage(x));
              } catch (x) {
                AppLog.error('auth', x);
                if (mounted) toast(context, friendlyError(x));
              }
              if (mounted) setState(() => busy = false);
            }

