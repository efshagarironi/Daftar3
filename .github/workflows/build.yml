                expect(() => parseBackupBytes(enc({...good(), 'format_version': 99})), throwsA(isA<BackupException>()));
                expect(() => parseBackupBytes(Uint8List.fromList([1, 2, 3])), throwsA(isA<BackupException>()));
                expect(() => parseBackupBytes(enc([1, 2])), throwsA(isA<BackupException>()));
              });
              test('count mismatch (v2)', () {
                final b = good()..['counts'] = {'contacts': 5, 'accounts': 1, 'transactions': 1};
                expect(() => parseBackupBytes(enc(b)), throwsA(isA<BackupException>()));
              });
              BackupException? rowError(void Function(Map<String, dynamic> d) mutate) {
                final d = sampleData();
                mutate(d);
