          #!/usr/bin/env bash
          # Usage: PSQL="psql -h localhost -U postgres" supabase/tests/run_all.sh
          # Creates a scratch database, applies migrations, runs every *_test.sql. Exits non-zero on any failure.
          set -euo pipefail
          cd "$(dirname "$0")/../.."
          PSQL="${PSQL:-psql -U postgres}"
          DB="hesabyar_test_$$"
          $PSQL -v ON_ERROR_STOP=1 -q -d postgres -c "create database $DB"
          trap '$PSQL -q -d postgres -c "drop database if exists $DB" >/dev/null' EXIT
          run() { $PSQL -v ON_ERROR_STOP=1 -q -d "$DB" -f "$1"; }
          run supabase/tests/00_supabase_stubs.sql
          for f in supabase/migrations/*.sql; do echo "migrate: $f"; run "$f"; done
          echo "re-run migration 0002 (must be idempotent)"; run supabase/migrations/0002_hardening.sql
          for f in supabase/tests/*_test.sql; do echo "test: $f"; run "$f"; done
          echo "ALL SQL TESTS PASSED"
