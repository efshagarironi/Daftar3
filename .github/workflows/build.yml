            final pay = open.where((a) => !a.isRec).fold<int>(0, (s, a) => s + a.remaining);
            final u = unit.value;
            String m(int v) => '${faDigits(groupDigits(v))} $u';

            final doc = pw.Document(
              title: 'گزارش حساب‌یار',
              author: 'حساب‌یار',
              theme: pw.ThemeData.withFont(base: regular, bold: bold),
