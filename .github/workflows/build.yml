              try {
                await sb.auth.resend(type: OtpType.signup, email: e, emailRedirectTo: kAuthRedirect);
                if (mounted) toast(context, 'ایمیل تأیید دوباره ارسال شد');
              } on AuthException catch (x) {
                AppLog.error('auth', x);
                if (mounted) toast(context, authMessage(x));
              } catch (x) {
                AppLog.error('auth', x);
                if (mounted) toast(context, friendlyError(x));
              }
            }

