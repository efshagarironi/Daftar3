          // ---------- setup / auth ----------
          String authMessage(AuthException e) {
            final c = e.code ?? '';
            final m = e.message.toLowerCase();
            if (c == 'invalid_credentials' || m.contains('invalid login')) return 'ایمیل یا رمز عبور اشتباه است';
            if (c == 'email_not_confirmed' || m.contains('not confirmed')) return 'ایمیل شما هنوز تأیید نشده است';
            if (c == 'user_already_exists' || m.contains('already registered')) return 'با این ایمیل قبلاً ثبت‌نام شده است';
            if (c == 'weak_password' || m.contains('password should')) return 'رمز عبور ضعیف است؛ حداقل ۸ کاراکتر شامل حرف و عدد';
            if (c == 'same_password') return 'رمز جدید باید با رمز قبلی متفاوت باشد';
            if (c.contains('rate_limit') || m.contains('rate limit') || e.statusCode == '429') {
              return 'تعداد درخواست‌ها زیاد است؛ کمی بعد دوباره تلاش کنید';
            }
            if (c == 'otp_expired' || m.contains('expired')) return 'لینک منقضی شده است؛ دوباره درخواست دهید';
            return 'عملیات احراز هویت ناموفق بود';
          }

