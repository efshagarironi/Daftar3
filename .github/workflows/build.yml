          class _AuthPageState extends State<AuthPage> {
            final email = TextEditingController();
            final pass = TextEditingController();
            bool signup = false, busy = false, hide = true, needConfirm = false;

            @override
            void dispose() {
              email.dispose();
              pass.dispose();
              super.dispose();
            }

            Future<void> submit() async {
              final e = email.text.trim(), p = pass.text;
              if (!isValidEmail(e)) {
                toast(context, 'ایمیل معتبر وارد کنید');
                return;
              }
              final pe = signup ? passwordProblem(p) : (p.isEmpty ? 'رمز عبور را وارد کنید' : null);
              if (pe != null) {
                toast(context, pe);
                return;
              }
              setState(() {
                busy = true;
                needConfirm = false;
              });
              try {
                if (signup) {
                  final r = await sb.auth.signUp(email: e, password: p, emailRedirectTo: kAuthRedirect);
                  if (r.session == null && mounted) {
                    toast(context, 'لینک تأیید به ایمیل شما ارسال شد. پس از تأیید، وارد شوید.');
                    setState(() {
                      signup = false;
                      needConfirm = true;
                    });
                  }
                } else {
                  await sb.auth.signInWithPassword(email: e, password: p);
                }
              } on AuthException catch (x) {
                AppLog.error('auth', x);
                if (mounted) {
                  if (x.code == 'email_not_confirmed' || x.message.toLowerCase().contains('not confirmed')) {
                    setState(() => needConfirm = true);
                  }
                  toast(context, authMessage(x));
                }
              } catch (x) {
                AppLog.error('auth', x);
                if (mounted) toast(context, friendlyError(x));
              }
              if (mounted) setState(() => busy = false);
            }

            Future<void> forgot() async {
              final e = email.text.trim();
              if (!isValidEmail(e)) {
                toast(context, 'ابتدا ایمیل خود را وارد کنید');
                return;
              }
              try {
                await sb.auth.resetPasswordForEmail(e, redirectTo: kAuthRedirect);
                // same message whether or not the address exists (no account enumeration)
                if (mounted) toast(context, 'اگر این ایمیل ثبت شده باشد، لینک بازیابی ارسال می‌شود');
              } on AuthException catch (x) {
                AppLog.error('auth', x);
                if (mounted) toast(context, authMessage(x));
              } catch (x) {
                AppLog.error('auth', x);
                if (mounted) toast(context, friendlyError(x));
              }
            }

