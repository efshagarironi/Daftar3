          // ---------- backup & export ----------
          // Exports are written to the app-private temp folder, handed to the share sheet,
          // and wiped on the next app start (see cleanupExports).
          Future<void> shareBytes(String name, List<int> bytes, String mime) async {
            final d = await getTemporaryDirectory();
            final f = File('${d.path}/hesabyar_${DateTime.now().millisecondsSinceEpoch}_$name');
            await f.writeAsBytes(bytes, flush: true);
            await Share.shareXFiles([XFile(f.path, mimeType: mime, name: name)]);
          }

          Future<void> cleanupExports() async {
            try {
              final d = await getTemporaryDirectory();
              await for (final e in d.list()) {
                if (e is File && e.uri.pathSegments.last.startsWith('hesabyar_')) await e.delete();
              }
            } catch (_) {}
          }

          String buildCsv() {
            final rows = <List<Object?>>[
              ['شخص', 'عنوان', 'نوع', 'مبلغ اولیه', 'پرداخت‌شده', 'مانده', 'تاریخ ثبت', 'سررسید', 'وضعیت']
            ];
            for (final a in store.accs) {
              rows.add([
                a.who,
                a.title,
                a.isRec ? 'طلب' : 'بدهی',
                a.principal,
                a.paid,
                a.remaining,
                a.opened == null ? '' : ymd(a.opened!),
                a.due == null ? '' : ymd(a.due!),
                a.settled ? 'تسویه‌شده' : 'باز',
              ]);
            }
            return csvFromRows(rows);
          }

          class BackupPage extends StatefulWidget {
            const BackupPage({super.key});
            @override
            State<BackupPage> createState() => _BackupPageState();
          }

          class _BackupPageState extends State<BackupPage> {
            late Future<List<Map<String, dynamic>>> recs = _recs();
            bool busy = false, auto = false;

            Future<List<Map<String, dynamic>>> _recs() async {
              final r = await sb.from('backup_records').select().order('created_at', ascending: false).limit(50);
              return List<Map<String, dynamic>>.from(r);
            }

            @override
            void initState() {
              super.initState();
              SharedPreferences.getInstance().then((p) {
                if (mounted) setState(() => auto = p.getBool('auto_backup') ?? false);
              });
            }

            Future<void> create() async {
              setState(() => busy = true);
              final ok = await run(context, () async {
                await createBackup();
                await pruneBackups(30);
              }, reload: false);
              if (!mounted) return;
              setState(() {
                busy = false;
                recs = _recs();
              });
              if (ok) toast(context, 'نسخه پشتیبان ابری ساخته شد');
            }

            /// Preview -> choose merge/replace -> (typed confirmation for replace) -> restore.
            /// "Replace" first stores a safety backup of the CURRENT data.
            Future<void> _restoreFlow(Map<String, dynamic> j) async {
              final mode = await showDialog<String>(context: context, builder: (_) => RestoreDialog(j));
              if (mode == null || !mounted) return;
              setState(() => busy = true);
              Map<String, dynamic>? res;
              final done = await run(context, () async {
                if (mode == 'replace') await createBackup();
                res = await restoreData(Map<String, dynamic>.from(j['data'] as Map), mode);
              });
              if (!mounted) return;
              setState(() {
                busy = false;
                recs = _recs();
              });
              if (done) {
                final r = res ?? const {};
                toast(
                    context,
                    mode == 'merge'
                        ? 'ادغام انجام شد: ${faDigits('${r['contacts'] ?? 0}')} شخص، ${faDigits('${r['accounts'] ?? 0}')} حساب، ${faDigits('${r['transactions'] ?? 0}')} پرداخت جدید'
                        : 'بازیابی انجام شد');
              }
            }

            Future<void> restoreCloud(Map<String, dynamic> r) async {
              setState(() => busy = true);
              Map<String, dynamic>? j;
              try {
                j = await readBackup(r['storage_path'] as String);
                if (r['checksum'] != null && r['checksum'] != j['checksum']) {
                  throw const BackupException('checksum فایل با رکورد ثبت‌شده نمی‌خواند');
                }
              } catch (e) {
                AppLog.error('restore-read', e);
                if (mounted) toast(context, friendlyError(e));
              }
              if (!mounted) return;
              setState(() => busy = false);
              if (j != null) await _restoreFlow(j);
            }

            Future<void> importFile() async {
              try {
                final r = await FilePicker.platform
                    .pickFiles(type: FileType.custom, allowedExtensions: ['json'], withData: true);
                if (r == null || r.files.isEmpty) return;
                final bytes = r.files.single.bytes;
                if (bytes == null) throw const BackupException('خواندن فایل ممکن نشد');
                final j = parseBackupBytes(bytes);
                if (!mounted) return;
                await _restoreFlow(j);
              } catch (e) {
                AppLog.error('import', e);
                if (mounted) toast(context, friendlyError(e));
              }
            }

            Future<void> remove(Map<String, dynamic> r) async {
              if (!await confirm(context, 'حذف نسخه پشتیبان', 'این نسخه برای همیشه حذف می‌شود.', ok: 'حذف')) return;
              if (!mounted) return;
              await run(context, () async {
                await sb.storage.from('backups').remove([r['storage_path'] as String]);
                await sb.from('backup_records').delete().eq('id', r['id']);
              }, reload: false);
              if (mounted) setState(() => recs = _recs());
            }

