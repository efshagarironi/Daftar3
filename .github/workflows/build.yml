          /// Validation summary + server-computed preview + mode choice. Pops the chosen
          /// mode ('merge' | 'replace') or null when cancelled. Replace needs a typed word.
          class RestoreDialog extends StatefulWidget {
            final Map<String, dynamic> backup;
            const RestoreDialog(this.backup, {super.key});
            @override
            State<RestoreDialog> createState() => _RestoreDialogState();
          }

          class _RestoreDialogState extends State<RestoreDialog> {
            static const _word = 'جایگزین';
            String mode = 'merge';
            final typed = TextEditingController();
            Map<String, dynamic>? pv;
            String? err;
            bool loading = true;

            Map<String, dynamic> get data => Map<String, dynamic>.from(widget.backup['data'] as Map);

            @override
            void initState() {
              super.initState();
              _load(initial: true);
            }

            @override
            void dispose() {
              typed.dispose();
              super.dispose();
            }

            Future<void> _load({bool initial = false}) async {
              if (!initial) {
                setState(() {
                  loading = true;
                  pv = null;
                  err = null;
                });
              }
              final m = mode;
              try {
                final r = await previewRestore(data, m);
                if (mounted && m == mode) {
                  setState(() {
                    pv = r;
                    loading = false;
                  });
                }
              } catch (e) {
                AppLog.error('preview', e);
                if (mounted && m == mode) {
                  setState(() {
                    err = friendlyError(e);
                    loading = false;
                  });
                }
              }
            }

            String n(Object? v) => faDigits('${v ?? 0}');
            String triple(Object? m) {
              final x = (m as Map?) ?? const {};
              return '${n(x['contacts'])} شخص، ${n(x['accounts'])} حساب، ${n(x['transactions'])} پرداخت';
            }

            @override
            Widget build(BuildContext context) {
              final b = widget.backup;
              final created = DateTime.tryParse('${b['created_at']}')?.toLocal();
              final ready = !loading && err == null && pv != null && (mode == 'merge' || typed.text.trim() == _word);
              return AlertDialog(
                title: const Text('بازیابی نسخه پشتیبان'),
                content: SingleChildScrollView(
                  child: Column(mainAxisSize: MainAxisSize.min, crossAxisAlignment: CrossAxisAlignment.start, children: [
                    const Row(children: [
                      Icon(Icons.verified_outlined, color: cRec),
                      SizedBox(width: 6),
                      Expanded(child: Text('ساختار و checksum فایل تأیید شد')),
                    ]),
                    const SizedBox(height: 4),
                    Text('تاریخ: ${created == null ? '-' : '${fmtDate(created)} ${fmtTime(created)}'} • فرمت ${n(b['format_version'])}'),
                    const SizedBox(height: 12),
                    SegmentedButton<String>(
                      segments: const [
                        ButtonSegment(value: 'merge', label: Text('ادغام'), icon: Icon(Icons.merge_type)),
                        ButtonSegment(value: 'replace', label: Text('جایگزینی'), icon: Icon(Icons.swap_horiz)),
                      ],
                      selected: {mode},
                      onSelectionChanged: (s) {
                        mode = s.first;
                        typed.clear();
                        _load();
                      },
                    ),
                    const SizedBox(height: 12),
                    if (loading) const Center(child: Padding(padding: EdgeInsets.all(8), child: CircularProgressIndicator())),
                    if (err != null) Text(err!, style: TextStyle(color: Theme.of(context).colorScheme.error)),
                    if (pv != null && mode == 'merge') ...[
                      Text('افزوده می‌شود: ${triple(pv!['added'])}'),
                      Text('تکراری (نادیده گرفته می‌شود): ${triple(pv!['duplicates_skipped'])}'),
                      const SizedBox(height: 6),
                      const Text('هیچ دادهٔ فعلی حذف یا تغییر نمی‌کند.'),
                    ],
                    if (pv != null && mode == 'replace') ...[
                      Text('اکنون: ${triple(pv!['current'])}'),
                      Text('جایگزین می‌شود با: ${triple(pv!['incoming'])}'),
                      const SizedBox(height: 6),
                      const Text('پیش از جایگزینی، از وضعیت فعلی یک نسخهٔ پشتیبان ابری ساخته می‌شود.'),
                      const SizedBox(height: 10),
                      TextField(
                          controller: typed,
                          onChanged: (_) => setState(() {}),
                          decoration: deco('برای تأیید بنویسید: $_word')),
                    ],
                  ]),
                ),
                actions: [
                  TextButton(onPressed: () => Navigator.pop(context), child: const Text('انصراف')),
                  FilledButton(
                      onPressed: ready ? () => Navigator.pop(context, mode) : null,
                      child: Text(mode == 'merge' ? 'ادغام کن' : 'جایگزین کن')),
                ],
              );
            }
          }

