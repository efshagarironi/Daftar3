            notes text,
            archived_at timestamptz,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now()
          );

          create table if not exists public.accounts (
            id uuid primary key default gen_random_uuid(),
            user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,
            contact_id uuid not null references public.contacts(id) on delete cascade,
            type text not null check (type in ('receivable','payable')),
            title text not null,
            principal_amount bigint not null check (principal_amount > 0),
            currency text not null default 'تومان',
            opened_at date not null default current_date,
            due_at date,
            notes text,
            status text not null default 'open' check (status in ('open','settled')),
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now()
          );

          create table if not exists public.transactions (
            id uuid primary key default gen_random_uuid(),
            user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,
            account_id uuid not null references public.accounts(id) on delete cascade,
            type text not null default 'payment' check (type in ('payment')),
            amount bigint not null check (amount > 0),
            transaction_date date not null default current_date,
            note text,
            created_at timestamptz not null default now()
          );

          create table if not exists public.backup_records (
            id uuid primary key default gen_random_uuid(),
            user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,
            storage_path text not null,
            format_version int not null default 1,
            file_size bigint,
            checksum text,
            status text not null default 'ok',
            created_at timestamptz not null default now()
          );

          create index if not exists contacts_user_idx on public.contacts(user_id);
          create index if not exists accounts_user_idx on public.accounts(user_id);
          create index if not exists accounts_contact_idx on public.accounts(contact_id);
          create index if not exists tx_user_idx on public.transactions(user_id);
          create index if not exists tx_account_idx on public.transactions(account_id);
          create index if not exists backup_user_idx on public.backup_records(user_id, created_at desc);

          create or replace function public.set_updated_at() returns trigger
          language plpgsql as $$
          begin new.updated_at = now(); return new; end $$;

          drop trigger if exists contacts_upd on public.contacts;
          create trigger contacts_upd before update on public.contacts
            for each row execute function public.set_updated_at();
          drop trigger if exists accounts_upd on public.accounts;
          create trigger accounts_upd before update on public.accounts
            for each row execute function public.set_updated_at();

          create or replace function public.handle_new_user() returns trigger
          language plpgsql security definer set search_path = public as $$
          begin
            insert into public.profiles(user_id) values (new.id) on conflict do nothing;
            return new;
          end $$;
          drop trigger if exists on_auth_user_created on auth.users;
          create trigger on_auth_user_created after insert on auth.users
            for each row execute function public.handle_new_user();

          -- Row Level Security
          alter table public.profiles enable row level security;
          alter table public.contacts enable row level security;
          alter table public.accounts enable row level security;
          alter table public.transactions enable row level security;
          alter table public.backup_records enable row level security;

          drop policy if exists own_profiles on public.profiles;
          create policy own_profiles on public.profiles for all to authenticated
            using (user_id = auth.uid()) with check (user_id = auth.uid());

          drop policy if exists own_contacts on public.contacts;
          create policy own_contacts on public.contacts for all to authenticated
            using (user_id = auth.uid()) with check (user_id = auth.uid());

          drop policy if exists own_accounts on public.accounts;
          create policy own_accounts on public.accounts for all to authenticated
            using (user_id = auth.uid())
            with check (user_id = auth.uid() and exists (
              select 1 from public.contacts c where c.id = contact_id and c.user_id = auth.uid()));

          drop policy if exists own_transactions on public.transactions;
          create policy own_transactions on public.transactions for all to authenticated
            using (user_id = auth.uid())
            with check (user_id = auth.uid() and exists (
              select 1 from public.accounts a where a.id = account_id and a.user_id = auth.uid()));

          drop policy if exists own_backup_records on public.backup_records;
          create policy own_backup_records on public.backup_records for all to authenticated
            using (user_id = auth.uid()) with check (user_id = auth.uid());

          -- Atomic restore (runs as the caller, so RLS still applies)
          create or replace function public.restore_user_data(payload jsonb) returns void
          language plpgsql security invoker set search_path = public as $$
          begin
            delete from public.contacts where user_id = auth.uid();

            insert into public.contacts(id, user_id, name, phone, notes, archived_at, created_at, updated_at)
            select (c->>'id')::uuid, auth.uid(), c->>'name', c->>'phone', c->>'notes',
                   (c->>'archived_at')::timestamptz,
                   coalesce((c->>'created_at')::timestamptz, now()),
                   coalesce((c->>'updated_at')::timestamptz, now())
            from jsonb_array_elements(coalesce(payload->'contacts', '[]'::jsonb)) c;

            insert into public.accounts(id, user_id, contact_id, type, title, principal_amount, currency,
                                        opened_at, due_at, notes, status, created_at, updated_at)
            select (a->>'id')::uuid, auth.uid(), (a->>'contact_id')::uuid, a->>'type', a->>'title',
                   (a->>'principal_amount')::bigint, coalesce(a->>'currency', 'تومان'),
                   coalesce((a->>'opened_at')::date, current_date), (a->>'due_at')::date,
                   a->>'notes', coalesce(a->>'status', 'open'),
                   coalesce((a->>'created_at')::timestamptz, now()),
                   coalesce((a->>'updated_at')::timestamptz, now())
            from jsonb_array_elements(coalesce(payload->'accounts', '[]'::jsonb)) a;

            insert into public.transactions(id, user_id, account_id, type, amount, transaction_date, note, created_at)
            select (t->>'id')::uuid, auth.uid(), (t->>'account_id')::uuid, coalesce(t->>'type', 'payment'),
                   (t->>'amount')::bigint, coalesce((t->>'transaction_date')::date, current_date),
                   t->>'note', coalesce((t->>'created_at')::timestamptz, now())
            from jsonb_array_elements(coalesce(payload->'transactions', '[]'::jsonb)) t;
          end $$;

          create or replace function public.delete_my_account() returns void
          language plpgsql security definer set search_path = public, auth as $$
          begin
            delete from auth.users where id = auth.uid();
          end $$;

          revoke all on function public.restore_user_data(jsonb) from public, anon;
          revoke all on function public.delete_my_account() from public, anon;
          grant execute on function public.restore_user_data(jsonb) to authenticated;
          grant execute on function public.delete_my_account() to authenticated;

          -- Private storage bucket for backups: each user can only touch the folder named after their user id
          insert into storage.buckets (id, name, public) values ('backups', 'backups', false)
            on conflict (id) do nothing;

          drop policy if exists backups_select_own on storage.objects;
          create policy backups_select_own on storage.objects for select to authenticated
            using (bucket_id = 'backups' and (storage.foldername(name))[1] = auth.uid()::text);
          drop policy if exists backups_insert_own on storage.objects;
          create policy backups_insert_own on storage.objects for insert to authenticated
            with check (bucket_id = 'backups' and (storage.foldername(name))[1] = auth.uid()::text);
          drop policy if exists backups_delete_own on storage.objects;
          create policy backups_delete_own on storage.objects for delete to authenticated
            using (bucket_id = 'backups' and (storage.foldername(name))[1] = auth.uid()::text);
          F8_EOF
          cat > supabase/migrations/0002_hardening.sql <<'F9_EOF'
          -- HesabYar 0002: hardening + versioned restore (replace / merge) + dedupe.
          -- Idempotent: safe to run on a database that already ran 0001.
          -- Runs as the SQL Editor / migration owner. No secrets are stored here.

          -- ---------------------------------------------------------------- profiles
          insert into public.profiles(user_id)
            select id from auth.users on conflict do nothing;

          -- ------------------------------------------------- size / sanity constraints
          -- (NOT VALID: new and updated rows are checked, old rows are left alone.)
          do $$
          begin
            if not exists (select 1 from pg_constraint where conname = 'accounts_principal_max') then
              alter table public.accounts add constraint accounts_principal_max
                check (principal_amount <= 1000000000000000) not valid;
            end if;
            if not exists (select 1 from pg_constraint where conname = 'transactions_amount_max') then
              alter table public.transactions add constraint transactions_amount_max
                check (amount <= 1000000000000000) not valid;
            end if;
            if not exists (select 1 from pg_constraint where conname = 'contacts_text_len') then
              alter table public.contacts add constraint contacts_text_len
                check (char_length(name) between 1 and 200
                       and char_length(coalesce(phone, '')) <= 50
                       and char_length(coalesce(notes, '')) <= 2000) not valid;
            end if;
            if not exists (select 1 from pg_constraint where conname = 'accounts_text_len') then
              alter table public.accounts add constraint accounts_text_len
                check (char_length(title) between 1 and 200
                       and char_length(coalesce(notes, '')) <= 2000
                       and char_length(currency) <= 20) not valid;
            end if;
            if not exists (select 1 from pg_constraint where conname = 'transactions_note_len') then
              alter table public.transactions add constraint transactions_note_len
                check (char_length(coalesce(note, '')) <= 2000) not valid;
            end if;
            if not exists (select 1 from pg_constraint where conname = 'profiles_text_len') then
              alter table public.profiles add constraint profiles_text_len
                check (char_length(coalesce(display_name, '')) <= 100
                       and char_length(currency_unit) <= 20) not valid;
            end if;
          end $$;

          -- ------------------------------ composite FKs: a child can never point at a
          -- row owned by another user, even if a policy is ever written wrongly.
          do $$
          begin
            if not exists (select 1 from pg_constraint where conname = 'contacts_id_user_uk') then
              alter table public.contacts add constraint contacts_id_user_uk unique (id, user_id);
            end if;
            if not exists (select 1 from pg_constraint where conname = 'accounts_id_user_uk') then
              alter table public.accounts add constraint accounts_id_user_uk unique (id, user_id);
            end if;
            if not exists (select 1 from pg_constraint where conname = 'accounts_contact_owner_fk') then
              alter table public.accounts add constraint accounts_contact_owner_fk
                foreign key (contact_id, user_id) references public.contacts(id, user_id) on delete cascade;
            end if;
            if not exists (select 1 from pg_constraint where conname = 'transactions_account_owner_fk') then
              alter table public.transactions add constraint transactions_account_owner_fk
                foreign key (account_id, user_id) references public.accounts(id, user_id) on delete cascade;
            end if;
          end $$;

          create index if not exists tx_account_date_idx
            on public.transactions(account_id, transaction_date desc);
          create index if not exists accounts_user_status_idx
            on public.accounts(user_id, status);

          -- ------------------------- account status is derived on the server (integers)
          create or replace function public.trg_accounts_status() returns trigger
          language plpgsql set search_path = public as $$
          begin
            new.status := case
              when new.principal_amount
                   - coalesce((select sum(t.amount) from public.transactions t where t.account_id = new.id), 0) <= 0
              then 'settled' else 'open' end;
            return new;
          end $$;

          drop trigger if exists accounts_status on public.accounts;
          create trigger accounts_status before insert or update of principal_amount on public.accounts
            for each row execute function public.trg_accounts_status();

          create or replace function public.trg_tx_status() returns trigger
          language plpgsql set search_path = public as $$
          declare aid uuid;
          begin
            for aid in
              select distinct x from unnest(array[
                case when tg_op <> 'INSERT' then old.account_id end,
                case when tg_op <> 'DELETE' then new.account_id end]) as x
              where x is not null
            loop
              update public.accounts a
                 set status = case
                   when a.principal_amount
                        - coalesce((select sum(t.amount) from public.transactions t where t.account_id = a.id), 0) <= 0
                   then 'settled' else 'open' end
               where a.id = aid
                 and a.status is distinct from case
                   when a.principal_amount
                        - coalesce((select sum(t.amount) from public.transactions t where t.account_id = a.id), 0) <= 0
                   then 'settled' else 'open' end;
            end loop;
            return null;
          end $$;

          drop trigger if exists tx_status on public.transactions;
          create trigger tx_status after insert or update or delete on public.transactions
            for each row execute function public.trg_tx_status();

          -- backfill once
          update public.accounts a set status = case
            when a.principal_amount
                 - coalesce((select sum(t.amount) from public.transactions t where t.account_id = a.id), 0) <= 0
            then 'settled' else 'open' end
          where a.status is distinct from case
            when a.principal_amount
                 - coalesce((select sum(t.amount) from public.transactions t where t.account_id = a.id), 0) <= 0
            then 'settled' else 'open' end;

          -- --------------------------------------------------- restore: plan (dedupe)
          -- Maps every row of a backup payload onto the caller's existing rows.
          --   contacts     : same id, else same name+phone (case-insensitive)
          --   accounts     : same id, else same contact+type+title+principal+opened_at
          --   transactions : same id, else multiset match on account+amount+date+note
          --                  (two genuine equal payments on one day are both kept)
          -- Runs as the caller, so RLS means only the caller's own rows are ever matched.
          drop function if exists public.restore_user_data(jsonb);
          drop function if exists public.restore_plan(jsonb);

          create or replace function public.restore_plan(payload jsonb)
          returns table(kind text, src_id uuid, dst_id uuid, is_new boolean)
          language plpgsql security invoker set search_path = public as $$
          begin
            if payload is null or jsonb_typeof(payload) <> 'object' then
              raise exception 'invalid_payload';
            end if;
            if jsonb_array_length(coalesce(payload->'contacts', '[]'::jsonb))
               + jsonb_array_length(coalesce(payload->'accounts', '[]'::jsonb))
               + jsonb_array_length(coalesce(payload->'transactions', '[]'::jsonb)) > 200000 then
              raise exception 'payload_too_large';
            end if;
            if exists (
              select 1 from jsonb_array_elements(coalesce(payload->'accounts', '[]'::jsonb)) a
              where not exists (
                select 1 from jsonb_array_elements(coalesce(payload->'contacts', '[]'::jsonb)) c
                where c->>'id' = a->>'contact_id')) then
              raise exception 'dangling_reference';
            end if;
            if exists (
              select 1 from jsonb_array_elements(coalesce(payload->'transactions', '[]'::jsonb)) t
              where not exists (
                select 1 from jsonb_array_elements(coalesce(payload->'accounts', '[]'::jsonb)) a
                where a->>'id' = t->>'account_id')) then
              raise exception 'dangling_reference';
            end if;

            return query
            with pc as (
              select (c->>'id')::uuid as id, c->>'name' as name, c->>'phone' as phone
              from jsonb_array_elements(coalesce(payload->'contacts', '[]'::jsonb)) c
            ),
            cmap as (
              select pc.id as src_id,
                coalesce(
                  (select x.id from public.contacts x where x.id = pc.id),
                  (select x.id from public.contacts x
                    where lower(btrim(x.name)) = lower(btrim(pc.name))
                      and coalesce(x.phone, '') = coalesce(pc.phone, '')
                    order by x.created_at, x.id limit 1)
                ) as existing_id
              from pc
            ),
            cplan as (
              select m.src_id, coalesce(m.existing_id, gen_random_uuid()) as dst_id,
                     m.existing_id is null as is_new
              from cmap m
            ),
            pa as (
              select (a->>'id')::uuid as id, (a->>'contact_id')::uuid as contact_id,
                     a->>'type' as type, a->>'title' as title,
                     (a->>'principal_amount')::bigint as principal,
                     coalesce((a->>'opened_at')::date, current_date) as opened
              from jsonb_array_elements(coalesce(payload->'accounts', '[]'::jsonb)) a
            ),
            amap as (
              select pa.id as src_id,
                coalesce(
                  (select x.id from public.accounts x where x.id = pa.id),
                  (select x.id from public.accounts x
                    where x.contact_id = cp.dst_id and x.type = pa.type and x.title = pa.title
                      and x.principal_amount = pa.principal and x.opened_at = pa.opened
                    order by x.created_at, x.id limit 1)
                ) as existing_id
              from pa join cplan cp on cp.src_id = pa.contact_id
            ),
            aplan as (
              select m.src_id, coalesce(m.existing_id, gen_random_uuid()) as dst_id,
                     m.existing_id is null as is_new
              from amap m
            ),
            pt as (
              select (t->>'id')::uuid as id, (t->>'account_id')::uuid as account_id,
                     (t->>'amount')::bigint as amount,
                     coalesce((t->>'transaction_date')::date, current_date) as d,
                     coalesce(t->>'note', '') as note
              from jsonb_array_elements(coalesce(payload->'transactions', '[]'::jsonb)) t
            ),
            tj as (
              select pt.id, ap.dst_id as account_dst, ap.is_new as acc_new, pt.amount, pt.d, pt.note,
                     exists (select 1 from public.transactions x where x.id = pt.id) as id_match
              from pt join aplan ap on ap.src_id = pt.account_id
            ),
            tw as (
              select tj.*,
                row_number() over (partition by account_dst, amount, d, note, id_match order by id) as rn,
                count(*) filter (where id_match) over (partition by account_dst, amount, d, note) as matched_n
              from tj
            ),
            tplan as (
              select tw.id as src_id, gen_random_uuid() as dst_id,
                case
                  when tw.id_match then false
                  when tw.acc_new then true
                  else tw.rn > greatest(
                    (select count(*) from public.transactions x
                      where x.account_id = tw.account_dst and x.amount = tw.amount
                        and x.transaction_date = tw.d and coalesce(x.note, '') = tw.note) - tw.matched_n, 0)
                end as is_new
              from tw
            )
            select 'contact'::text, c.src_id, c.dst_id, c.is_new from cplan c
            union all select 'account'::text, a.src_id, a.dst_id, a.is_new from aplan a
            union all select 'transaction'::text, t.src_id, t.dst_id, t.is_new from tplan t;
          end $$;

          -- --------------------------------------------------------- restore: preview
          create or replace function public.preview_restore(payload jsonb, p_mode text default 'replace')
          returns jsonb
          language plpgsql security invoker set search_path = public as $$
          declare r jsonb;
          begin
            if p_mode not in ('replace', 'merge') then raise exception 'invalid_mode'; end if;
            if p_mode = 'replace' then
              perform 1 from public.restore_plan(payload) limit 1;  -- validates the payload shape
              return jsonb_build_object(
                'mode', 'replace',
                'current', jsonb_build_object(
                  'contacts', (select count(*) from public.contacts),
                  'accounts', (select count(*) from public.accounts),
                  'transactions', (select count(*) from public.transactions)),
                'incoming', jsonb_build_object(
                  'contacts', jsonb_array_length(coalesce(payload->'contacts', '[]'::jsonb)),
                  'accounts', jsonb_array_length(coalesce(payload->'accounts', '[]'::jsonb)),
                  'transactions', jsonb_array_length(coalesce(payload->'transactions', '[]'::jsonb))));
            end if;
            select jsonb_build_object(
              'mode', 'merge',
              'added', jsonb_build_object(
                'contacts', count(*) filter (where kind = 'contact' and is_new),
                'accounts', count(*) filter (where kind = 'account' and is_new),
                'transactions', count(*) filter (where kind = 'transaction' and is_new)),
              'duplicates_skipped', jsonb_build_object(
                'contacts', count(*) filter (where kind = 'contact' and not is_new),
                'accounts', count(*) filter (where kind = 'account' and not is_new),
                'transactions', count(*) filter (where kind = 'transaction' and not is_new)))
            into r from public.restore_plan(payload);
            return r;
          end $$;

          -- ----------------------------------------------------------------- restore
          create or replace function public.restore_user_data(payload jsonb, p_mode text default 'replace')
          returns jsonb
          language plpgsql security invoker set search_path = public as $$
          declare
            v_plan jsonb;
            v_c int; v_a int; v_t int;
          begin
            if p_mode not in ('replace', 'merge') then raise exception 'invalid_mode'; end if;
            if auth.uid() is null then raise exception 'not_authenticated'; end if;

            select coalesce(jsonb_agg(to_jsonb(p)), '[]'::jsonb) into v_plan from public.restore_plan(payload) p;

            if p_mode = 'replace' then
              -- cascades to accounts and transactions
              delete from public.contacts where user_id = auth.uid();

              insert into public.contacts(id, user_id, name, phone, notes, archived_at, created_at, updated_at)
              select (c->>'id')::uuid, auth.uid(), c->>'name', c->>'phone', c->>'notes',
                     (c->>'archived_at')::timestamptz,
                     coalesce((c->>'created_at')::timestamptz, now()),
                     coalesce((c->>'updated_at')::timestamptz, now())
              from jsonb_array_elements(coalesce(payload->'contacts', '[]'::jsonb)) c;
              get diagnostics v_c = row_count;

              insert into public.accounts(id, user_id, contact_id, type, title, principal_amount, currency,
                                          opened_at, due_at, notes, status, created_at, updated_at)
              select (a->>'id')::uuid, auth.uid(), (a->>'contact_id')::uuid, a->>'type', a->>'title',
                     (a->>'principal_amount')::bigint, coalesce(a->>'currency', 'تومان'),
                     coalesce((a->>'opened_at')::date, current_date), (a->>'due_at')::date,
                     a->>'notes', 'open',
                     coalesce((a->>'created_at')::timestamptz, now()),
                     coalesce((a->>'updated_at')::timestamptz, now())
              from jsonb_array_elements(coalesce(payload->'accounts', '[]'::jsonb)) a;
              get diagnostics v_a = row_count;

              insert into public.transactions(id, user_id, account_id, type, amount, transaction_date, note, created_at)
              select (t->>'id')::uuid, auth.uid(), (t->>'account_id')::uuid, coalesce(t->>'type', 'payment'),
                     (t->>'amount')::bigint, coalesce((t->>'transaction_date')::date, current_date),
                     t->>'note', coalesce((t->>'created_at')::timestamptz, now())
              from jsonb_array_elements(coalesce(payload->'transactions', '[]'::jsonb)) t;
              get diagnostics v_t = row_count;

              return jsonb_build_object('mode', 'replace', 'contacts', v_c, 'accounts', v_a, 'transactions', v_t);
            end if;

            -- merge: only rows the plan marks as new are inserted, with fresh ids
            insert into public.contacts(id, user_id, name, phone, notes, archived_at, created_at, updated_at)
            select p.dst_id, auth.uid(), c->>'name', c->>'phone', c->>'notes',
                   (c->>'archived_at')::timestamptz,
                   coalesce((c->>'created_at')::timestamptz, now()),
                   coalesce((c->>'updated_at')::timestamptz, now())
            from jsonb_array_elements(coalesce(payload->'contacts', '[]'::jsonb)) c
            join jsonb_to_recordset(v_plan) as p(kind text, src_id uuid, dst_id uuid, is_new boolean)
              on p.kind = 'contact' and p.is_new and p.src_id = (c->>'id')::uuid;
            get diagnostics v_c = row_count;

            insert into public.accounts(id, user_id, contact_id, type, title, principal_amount, currency,
                                        opened_at, due_at, notes, status, created_at, updated_at)
            select p.dst_id, auth.uid(), cp.dst_id, a->>'type', a->>'title',
                   (a->>'principal_amount')::bigint, coalesce(a->>'currency', 'تومان'),
                   coalesce((a->>'opened_at')::date, current_date), (a->>'due_at')::date,
                   a->>'notes', 'open',
                   coalesce((a->>'created_at')::timestamptz, now()),
                   coalesce((a->>'updated_at')::timestamptz, now())
            from jsonb_array_elements(coalesce(payload->'accounts', '[]'::jsonb)) a
            join jsonb_to_recordset(v_plan) as p(kind text, src_id uuid, dst_id uuid, is_new boolean)
              on p.kind = 'account' and p.is_new and p.src_id = (a->>'id')::uuid
            join jsonb_to_recordset(v_plan) as cp(kind text, src_id uuid, dst_id uuid, is_new boolean)
              on cp.kind = 'contact' and cp.src_id = (a->>'contact_id')::uuid;
            get diagnostics v_a = row_count;

            insert into public.transactions(id, user_id, account_id, type, amount, transaction_date, note, created_at)
            select p.dst_id, auth.uid(), ap.dst_id, coalesce(t->>'type', 'payment'),
                   (t->>'amount')::bigint, coalesce((t->>'transaction_date')::date, current_date),
                   t->>'note', coalesce((t->>'created_at')::timestamptz, now())
            from jsonb_array_elements(coalesce(payload->'transactions', '[]'::jsonb)) t
            join jsonb_to_recordset(v_plan) as p(kind text, src_id uuid, dst_id uuid, is_new boolean)
              on p.kind = 'transaction' and p.is_new and p.src_id = (t->>'id')::uuid
            join jsonb_to_recordset(v_plan) as ap(kind text, src_id uuid, dst_id uuid, is_new boolean)
