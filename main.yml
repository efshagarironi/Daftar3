          class AccountFormPage extends StatefulWidget {
            final Acc? edit;
            final String? contactId;
            const AccountFormPage({super.key, this.edit, this.contactId});
            @override
            State<AccountFormPage> createState() => _AccountFormPageState();
          }

          class _AccountFormPageState extends State<AccountFormPage> {
            late String? cid;
            late String type;
            final newName = TextEditingController();
            final title = TextEditingController();
            final amount = TextEditingController();
            final notes = TextEditingController();
            late DateTime opened;
            DateTime? due;
            bool busy = false;

            @override
            void initState() {
              super.initState();
              final e = widget.edit;
              cid = e?.contactId ?? widget.contactId ?? (store.contacts.isEmpty ? 'new' : null);
              type = e == null ? 'receivable' : (e.isRec ? 'receivable' : 'payable');
              title.text = e?.title ?? '';
              amount.text = e == null ? '' : '${e.principal}';
              notes.text = e == null ? '' : '${e.m['notes'] ?? ''}';
              opened = e?.opened ?? DateTime.now();
              due = e?.due;
            }

            Future<void> save() async {
              final amt = parseAmount(amount.text);
              if (cid == null) {
                toast(context, 'شخص را انتخاب کنید');
                return;
              }
              if (cid == 'new' && newName.text.trim().isEmpty) {
                toast(context, 'نام شخص را وارد کنید');
                return;
              }
              if (title.text.trim().isEmpty) {
                toast(context, 'عنوان حساب را وارد کنید');
                return;
              }
              if (amt == null || amt <= 0) {
                toast(context, 'مبلغ اولیه معتبر نیست');
                return;
              }
              final e = widget.edit;
              if (e != null && amt < e.paid) {
                toast(context, 'مبلغ اولیه نمی‌تواند کمتر از مجموع پرداخت‌های ثبت‌شده باشد');
                return;
              }
              setState(() => busy = true);
              final ok = await run(context, () async {
                var contact = cid;
                if (contact == 'new') {
                  final r = await sb.from('contacts').insert({'user_id': uid(), 'name': newName.text.trim()}).select('id').single();
                  contact = r['id'] as String;
                }
                final body = {
                  'contact_id': contact,
                  'type': type,
                  'title': title.text.trim(),
                  'principal_amount': amt,
                  'opened_at': ymd(opened),
                  'due_at': due == null ? null : ymd(due!),
                  'notes': notes.text.trim().isEmpty ? null : notes.text.trim(),
                };
                if (e == null) {
                  await sb.from('accounts').insert({...body, 'user_id': uid(), 'currency': unit.value, 'status': 'open'});
                } else {
                  await sb.from('accounts').update({...body, 'status': amt - e.paid <= 0 ? 'settled' : 'open'}).eq('id', e.id);
                }
              });
              if (!mounted) return;
              setState(() => busy = false);
              if (ok) Navigator.pop(context);
            }

            Future<DateTime?> pick(DateTime init) => showDatePicker(
                context: context, initialDate: init, firstDate: DateTime(2000), lastDate: DateTime(2100));

            @override
            Widget build(BuildContext context) {
              final e = widget.edit;
              return Scaffold(
                appBar: AppBar(title: Text(e == null ? 'ثبت حساب جدید' : 'ویرایش حساب')),
                body: ListView(padding: const EdgeInsets.all(16), children: [
                  SegmentedButton<String>(
                    segments: const [
                      ButtonSegment(value: 'receivable', label: Text('طلب (از او می‌گیرم)'), icon: Icon(Icons.south_west)),
                      ButtonSegment(value: 'payable', label: Text('بدهی (به او می‌دهم)'), icon: Icon(Icons.north_east)),
                    ],
                    selected: {type},
                    onSelectionChanged: (s) => setState(() => type = s.first),
                  ),
                  const SizedBox(height: 16),
                  DropdownButtonFormField<String>(
                    value: cid,
                    decoration: deco('شخص', icon: Icons.person_outline),
                    items: [
                      ...store.contacts.map((p) => DropdownMenuItem(value: '${p['id']}', child: Text('${p['name']}'))),
                      const DropdownMenuItem(value: 'new', child: Text('＋ شخص جدید')),
                    ],
                    onChanged: (v) => setState(() => cid = v),
                  ),
                  if (cid == 'new') ...[
                    const SizedBox(height: 12),
                    TextField(controller: newName, decoration: deco('نام شخص جدید')),
                  ],
                  const SizedBox(height: 12),
                  TextField(controller: title, decoration: deco('عنوان (مثلاً وام خرید لپ‌تاپ)', icon: Icons.title)),
                  const SizedBox(height: 12),
                  TextField(
                      controller: amount,
                      keyboardType: TextInputType.number,
                      decoration: deco('مبلغ اولیه (${unit.value})', icon: Icons.payments_outlined)),
                  const SizedBox(height: 12),
                  card(
                      context,
                      Column(children: [
                        ListTile(
                            contentPadding: EdgeInsets.zero,
                            leading: const Icon(Icons.event),
                            title: Text('تاریخ ثبت: ${fmtDate(opened)}'),
                            onTap: () async {
                              final d = await pick(opened);
                              if (d != null) setState(() => opened = d);
                            }),
                        ListTile(
                            contentPadding: EdgeInsets.zero,
                            leading: const Icon(Icons.alarm),
                            title: Text(due == null ? 'سررسید: ندارد' : 'سررسید: ${fmtDate(due!)}'),
                            trailing: due == null
                                ? null
                                : IconButton(icon: const Icon(Icons.close), onPressed: () => setState(() => due = null)),
                            onTap: () async {
                              final d = await pick(due ?? DateTime.now());
                              if (d != null) setState(() => due = d);
                            }),
                      ])),
                  TextField(controller: notes, maxLines: 3, decoration: deco('توضیحات (اختیاری)')),
                  const SizedBox(height: 20),
                  SizedBox(
                      height: 52,
                      child: FilledButton(
                          onPressed: busy ? null : save, child: Text(e == null ? 'ثبت حساب' : 'ذخیره تغییرات'))),
                ]),
              );
            }
