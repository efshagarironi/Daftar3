          class PaymentForm extends StatefulWidget {
            final Acc a;
            const PaymentForm(this.a, {super.key});
            @override
            State<PaymentForm> createState() => _PaymentFormState();
          }

          class _PaymentFormState extends State<PaymentForm> {
            final amt = TextEditingController(), note = TextEditingController();
            DateTime date = DateTime.now();
            bool busy = false;

            Future<void> save() async {
              final a = widget.a;
              final v = parseAmount(amt.text);
              if (v == null || v <= 0) {
                toast(context, 'مبلغ پرداخت معتبر نیست');
                return;
              }
              if (v > a.remaining &&
                  !await confirm(context, 'پرداخت بیش از مانده',
                      'مبلغ واردشده از مانده (${money(a.remaining)}) بیشتر است. ثبت شود؟')) {
                return;
              }
              if (!mounted) return;
              setState(() => busy = true);
              final ok = await run(context, () async {
                await sb.from('transactions').insert({
                  'user_id': uid(),
                  'account_id': a.id,
                  'type': 'payment',
                  'amount': v,
                  'transaction_date': ymd(date),
                  'note': note.text.trim().isEmpty ? null : note.text.trim(),
                });
                await sb.from('accounts').update({'status': a.remaining - v <= 0 ? 'settled' : 'open'}).eq('id', a.id);
              });
              if (!mounted) return;
              setState(() => busy = false);
              if (ok) Navigator.pop(context);
            }

            @override
            Widget build(BuildContext context) {
              final a = widget.a;
              return Padding(
                padding: const EdgeInsets.fromLTRB(20, 0, 20, 20),
                child: Column(mainAxisSize: MainAxisSize.min, crossAxisAlignment: CrossAxisAlignment.start, children: [
                  Text('ثبت پرداخت', style: Theme.of(context).textTheme.titleLarge?.copyWith(fontWeight: FontWeight.bold)),
                  const SizedBox(height: 4),
                  Text('مانده فعلی: ${money(a.remaining)}'),
                  const SizedBox(height: 12),
                  TextField(
                    controller: amt,
                    keyboardType: TextInputType.number,
                    decoration: deco('مبلغ (${unit.value})', icon: Icons.payments_outlined).copyWith(
                        suffix: TextButton(
                            onPressed: () => amt.text = '${a.remaining}',
                            child: const Text('پرداخت کامل'))),
                  ),
                  const SizedBox(height: 12),
