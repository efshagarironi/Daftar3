name: Build HesabYar APK

# حساب‌یار: ساخت خودکار پروژه Flutter + APK (فقط همین یک فایل لازم است)
# مسیر فایل در ریپازیتوری: .github/workflows/main.yml
# پیش‌نیاز: در Settings > Secrets and variables > Actions دو Secret بسازید:
#   SUPABASE_URL  و  SUPABASE_ANON_KEY
# (فقط anon key؛ هرگز service_role را اینجا نگذارید)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter project and write source files
        run: |
          set -euo pipefail
          flutter create --org com.hesabyar --project-name hesabyar --platforms android .
          rm -rf test
          mkdir -p supabase
          cat > pubspec.yaml <<'PUBSPEC_EOF'
          name: hesabyar
          description: Debt and receivables manager with cloud backup
          publish_to: none
          version: 1.0.0+1
          environment:
            sdk: ">=3.3.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            supabase_flutter: ^2.8.0
            google_fonts: ^6.2.1
            shared_preferences: ^2.3.2
            path_provider: ^2.1.4
            share_plus: ^10.1.4
            crypto: ^3.0.5
          dev_dependencies:
            flutter_test:
              sdk: flutter
          flutter:
            uses-material-design: true
          PUBSPEC_EOF
          cat > lib/main.dart <<'MAIN_EOF'
          import 'package:flutter/material.dart';
          import 'package:flutter_localizations/flutter_localizations.dart';
          import 'package:google_fonts/google_fonts.dart';
          import 'package:supabase_flutter/supabase_flutter.dart';
          import 'data.dart';
          import 'screens.dart';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            if (kConfigured) {
              await Supabase.initialize(url: kUrl, anonKey: kKey);
            }
            runApp(const HesabYarApp());
          }

          class HesabYarApp extends StatelessWidget {
            const HesabYarApp({super.key});

            ThemeData _theme(Brightness b) {
              final cs = ColorScheme.fromSeed(
                  seedColor: const Color(0xFF0E7C86), brightness: b);
              final base = ThemeData(useMaterial3: true, colorScheme: cs);
              return base.copyWith(
                textTheme: GoogleFonts.vazirmatnTextTheme(base.textTheme),
                scaffoldBackgroundColor:
                    b == Brightness.light ? const Color(0xFFF3F7F8) : null,
                appBarTheme: const AppBarTheme(
                    scrolledUnderElevation: 0, backgroundColor: Colors.transparent),
              );
            }

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'حساب‌یار',
                debugShowCheckedModeBanner: false,
                locale: const Locale('fa'),
                supportedLocales: const [Locale('fa')],
                localizationsDelegates: const [
                  GlobalMaterialLocalizations.delegate,
                  GlobalWidgetsLocalizations.delegate,
                  GlobalCupertinoLocalizations.delegate,
                ],
                theme: _theme(Brightness.light),
                darkTheme: _theme(Brightness.dark),
                home: const Root(),
              );
            }
          }

          class Root extends StatelessWidget {
            const Root({super.key});

            @override
            Widget build(BuildContext context) {
              if (!kConfigured) return const SetupPage();
              return StreamBuilder<AuthState>(
                stream: sb.auth.onAuthStateChange,
                builder: (context, snap) {
                  final s = sb.auth.currentSession;
                  if (s == null) return const AuthPage();
                  return Home(key: ValueKey(s.user.id));
                },
              );
            }
          }
          MAIN_EOF
          cat > lib/data.dart <<'DATA_EOF'
          import 'dart:convert';
          import 'dart:typed_data';
          import 'package:crypto/crypto.dart';
          import 'package:flutter/foundation.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:supabase_flutter/supabase_flutter.dart';

          const kUrl = String.fromEnvironment('SUPABASE_URL');
          const kKey = String.fromEnvironment('SUPABASE_ANON_KEY');
          bool get kConfigured => kUrl.isNotEmpty && kKey.isNotEmpty;
          SupabaseClient get sb => Supabase.instance.client;
          String uid() => sb.auth.currentUser!.id;

          final unit = ValueNotifier<String>('تومان');
          String profileName = '';

          // ---------- formatting ----------
          String faDigits(String s) {
            var o = s;
            for (var i = 0; i < 10; i++) {
              o = o.replaceAll('$i', String.fromCharCode(0x06F0 + i));
            }
            return o;
          }

          int? parseAmount(String s) {
            var t = s.trim();
            for (var i = 0; i < 10; i++) {
              t = t
                  .replaceAll(String.fromCharCode(0x06F0 + i), '$i')
                  .replaceAll(String.fromCharCode(0x0660 + i), '$i');
            }
            t = t.replaceAll(RegExp(r'[,،٬\s]'), '');
            return int.tryParse(t);
          }

          String group(int v) => v
              .toString()
              .replaceAllMapped(RegExp(r'\B(?=(\d{3})+(?!\d))'), (m) => '٬');
          String money(int v) => '${faDigits(group(v))} ${unit.value}';
          String _p2(int n) => n.toString().padLeft(2, '0');
          String ymd(DateTime d) => '${d.year}-${_p2(d.month)}-${_p2(d.day)}';
          String fmtDate(DateTime d) => faDigits('${d.year}/${_p2(d.month)}/${_p2(d.day)}');

          // ---------- model ----------
          class Acc {
            final Map<String, dynamic> m;
            Acc(this.m);
            String get id => m['id'] as String;
            String get contactId => m['contact_id'] as String;
            String get title => (m['title'] ?? '') as String;
            bool get isRec => m['type'] == 'receivable';
            int get principal => (m['principal_amount'] as num).toInt();
            List<dynamic> get txs => (m['transactions'] as List<dynamic>?) ?? [];
            int get paid => txs.fold<int>(0, (s, t) => s + (t['amount'] as num).toInt());
            int get remaining => principal - paid;
            bool get settled => remaining <= 0;
            String get who => ((m['contacts'] as Map?)?['name'] ?? '') as String;
            DateTime? get due =>
                m['due_at'] == null ? null : DateTime.tryParse(m['due_at'] as String);
            DateTime? get opened => DateTime.tryParse(
                (m['opened_at'] ?? m['created_at'] ?? '') as String);
          }

          // ---------- store (online-first, read-only offline cache) ----------
          class Store extends ChangeNotifier {
            List<Map<String, dynamic>> rawAccs = [];
            List<Map<String, dynamic>> contacts = [];
            bool loading = false;
            bool offline = false;
            List<Acc> get accs => rawAccs.map(Acc.new).toList();

            void refreshUI() => notifyListeners();

            Future<void> load() async {
              loading = true;
              notifyListeners();
              final p = await SharedPreferences.getInstance();
              final key = 'cache_${uid()}';
              try {
                final c = await sb
                    .from('contacts')
                    .select()
                    .isFilter('archived_at', null)
                    .order('name');
                final a = await sb
                    .from('accounts')
                    .select('*, contacts(name), transactions(id,amount,transaction_date,note)')
                    .order('created_at', ascending: false);
                contacts = List<Map<String, dynamic>>.from(c);
                rawAccs = List<Map<String, dynamic>>.from(a);
                offline = false;
                await p.setString(key, jsonEncode({'c': contacts, 'a': rawAccs}));
              } catch (e) {
                offline = true;
                final s = p.getString(key);
                if (s != null) {
                  final j = jsonDecode(s);
                  contacts = List<Map<String, dynamic>>.from(j['c']);
                  rawAccs = List<Map<String, dynamic>>.from(j['a']);
                }
              }
              loading = false;
              notifyListeners();
            }

            Future<void> clear() async {
              rawAccs = [];
              contacts = [];
              final p = await SharedPreferences.getInstance();
              for (final k in p.getKeys().where((k) => k.startsWith('cache_')).toList()) {
                await p.remove(k);
              }
              notifyListeners();
            }
          }

          final store = Store();

          Future<void> loadProfile() async {
            try {
              final r = await sb.from('profiles').select().maybeSingle();
              if (r != null) {
                unit.value = (r['currency_unit'] ?? 'تومان') as String;
                profileName = (r['display_name'] ?? '') as String;
              }
            } catch (_) {}
          }

          // ---------- backup ----------
          Future<List<Map<String, dynamic>>> fetchAll(String table) async {
            final out = <Map<String, dynamic>>[];
            var from = 0;
            while (true) {
              final r = await sb
                  .from(table)
                  .select()
                  .order('created_at')
                  .order('id')
                  .range(from, from + 999);
              out.addAll(List<Map<String, dynamic>>.from(r));
              if (r.length < 1000) break;
              from += 1000;
            }
            return out;
          }

          Future<Map<String, dynamic>> snapshot() async {
            final data = {
              'contacts': await fetchAll('contacts'),
              'accounts': await fetchAll('accounts'),
              'transactions': await fetchAll('transactions'),
            };
            final checksum = sha256.convert(utf8.encode(jsonEncode(data))).toString();
            return {
              'app': 'hesabyar',
              'format_version': 1,
              'created_at': DateTime.now().toUtc().toIso8601String(),
              'checksum': checksum,
              'data': data,
            };
          }

          Future<void> createBackup() async {
            final snap = await snapshot();
            final bytes = Uint8List.fromList(utf8.encode(jsonEncode(snap)));
            final path = '${uid()}/backup_${DateTime.now().toUtc().millisecondsSinceEpoch}.json';
            await sb.storage.from('backups').uploadBinary(path, bytes,
                fileOptions: const FileOptions(contentType: 'application/json'));
            await sb.from('backup_records').insert({
              'user_id': uid(),
              'storage_path': path,
              'format_version': 1,
              'file_size': bytes.length,
              'checksum': snap['checksum'],
              'status': 'ok',
            });
          }

          Future<Map<String, dynamic>> readBackup(String path) async {
            final bytes = await sb.storage.from('backups').download(path);
            final j = jsonDecode(utf8.decode(bytes)) as Map<String, dynamic>;
            if (j['format_version'] != 1 || j['data'] == null) {
              throw 'فرمت فایل پشتیبان پشتیبانی نمی‌شود';
            }
            final sum = sha256.convert(utf8.encode(jsonEncode(j['data']))).toString();
            if (sum != j['checksum']) throw 'فایل پشتیبان خراب یا دستکاری شده است';
            return j;
          }

          Future<void> pruneBackups(int keep) async {
            final r = await sb
                .from('backup_records')
                .select('id,storage_path')
                .order('created_at', ascending: false)
                .range(keep, keep + 200);
            final old = List<Map<String, dynamic>>.from(r);
            if (old.isEmpty) return;
            await sb.storage
                .from('backups')
                .remove(old.map((e) => e['storage_path'] as String).toList());
            await sb
                .from('backup_records')
                .delete()
                .inFilter('id', old.map((e) => e['id']).toList());
          }

          Future<void> autoBackupIfDue() async {
            try {
              final p = await SharedPreferences.getInstance();
              if (!(p.getBool('auto_backup') ?? false)) return;
              final r = await sb
                  .from('backup_records')
                  .select('created_at')
                  .order('created_at', ascending: false)
                  .limit(1);
              if (r.isNotEmpty) {
                final last = DateTime.parse(r.first['created_at'] as String).toLocal();
                if (DateTime.now().difference(last).inHours < 24) return;
              }
              await createBackup();
              await pruneBackups(10);
            } catch (_) {}
          }
          DATA_EOF
          cat > lib/screens.dart <<'SCREENS_EOF'
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:share_plus/share_plus.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:supabase_flutter/supabase_flutter.dart';
          import 'data.dart';

          const cRec = Color(0xFF16A37F);
          const cPay = Color(0xFFE5484D);
          const cBrand = Color(0xFF0E7C86);

          // ---------- helpers ----------
          void toast(BuildContext c, String m) => ScaffoldMessenger.of(c).showSnackBar(
              SnackBar(content: Text(m), behavior: SnackBarBehavior.floating));

          Future<bool> confirm(BuildContext c, String title, String body,
                  {String ok = 'تأیید'}) async =>
              await showDialog<bool>(
                  context: c,
                  builder: (ctx) => AlertDialog(
                        title: Text(title),
                        content: Text(body),
                        actions: [
                          TextButton(
                              onPressed: () => Navigator.pop(ctx, false),
                              child: const Text('انصراف')),
                          FilledButton(
                              onPressed: () => Navigator.pop(ctx, true), child: Text(ok)),
                        ],
                      )) ??
              false;

          InputDecoration deco(String l, {IconData? icon}) => InputDecoration(
                labelText: l,
                prefixIcon: icon == null ? null : Icon(icon),
                filled: true,
                border: OutlineInputBorder(
                    borderRadius: BorderRadius.circular(16), borderSide: BorderSide.none),
              );

          Future<bool> run(BuildContext c, Future<void> Function() f,
              {bool reload = true}) async {
            final m = ScaffoldMessenger.of(c);
            void msg(String t) => m.showSnackBar(
                SnackBar(content: Text(t), behavior: SnackBarBehavior.floating));
            try {
              await f();
              if (reload) await store.load();
              return true;
            } on PostgrestException catch (e) {
              msg('خطا: ${e.message}');
            } on AuthException catch (e) {
              msg(e.message);
            } on StorageException catch (e) {
              msg('خطای فضای ذخیره: ${e.message}');
            } catch (e) {
              msg(e is String ? e : 'اتصال برقرار نیست یا خطایی رخ داد');
            }
            return false;
          }

          Widget card(BuildContext c, Widget child,
              {VoidCallback? onTap, EdgeInsets pad = const EdgeInsets.all(16)}) {
            return Padding(
              padding: const EdgeInsets.only(bottom: 12),
              child: Material(
                color: Theme.of(c).colorScheme.surfaceContainerLow,
                borderRadius: BorderRadius.circular(20),
                child: InkWell(
                  borderRadius: BorderRadius.circular(20),
                  onTap: onTap,
                  child: Padding(padding: pad, child: child),
                ),
              ),
            );
          }

          Widget sec(BuildContext c, String t) => Padding(
                padding: const EdgeInsets.fromLTRB(4, 16, 4, 8),
                child: Text(t,
                    style: Theme.of(c)
                        .textTheme
                        .titleMedium
                        ?.copyWith(fontWeight: FontWeight.bold)),
              );

          Widget emptyBox(String t) => Padding(
                padding: const EdgeInsets.all(32),
                child: Center(child: Text(t, textAlign: TextAlign.center)),
              );

          Color accColor(Acc a) => a.isRec ? cRec : cPay;

          int netOf(String cid) {
            var s = 0;
            for (final a in store.accs) {
              if (a.contactId == cid && !a.settled) s += a.isRec ? a.remaining : -a.remaining;
            }
            return s;
          }

          // ---------- setup / auth ----------
          class SetupPage extends StatelessWidget {
            const SetupPage({super.key});
            @override
            Widget build(BuildContext c) => const Scaffold(
                  body: Center(
                    child: Padding(
                      padding: EdgeInsets.all(24),
                      child: Text(
                        'کلیدهای Supabase تنظیم نشده‌اند.\nدر GitHub به Settings ← Secrets and variables ← Actions بروید، مقدارهای SUPABASE_URL و SUPABASE_ANON_KEY را اضافه کنید و Build را دوباره اجرا کنید.',
                        textAlign: TextAlign.center,
                      ),
                    ),
                  ),
                );
          }

          class AuthPage extends StatefulWidget {
            const AuthPage({super.key});
            @override
            State<AuthPage> createState() => _AuthPageState();
          }

          class _AuthPageState extends State<AuthPage> {
            final email = TextEditingController();
            final pass = TextEditingController();
            bool signup = false, busy = false, hide = true;

            Future<void> submit() async {
              final e = email.text.trim(), p = pass.text;
              if (!e.contains('@') || p.length < 8) {
                toast(context, 'ایمیل معتبر و رمز عبور حداقل ۸ کاراکتری وارد کنید');
                return;
              }
              setState(() => busy = true);
              try {
                if (signup) {
                  final r = await sb.auth.signUp(email: e, password: p);
                  if (r.session == null && mounted) {
                    toast(context, 'لینک تأیید به ایمیل شما ارسال شد. پس از تأیید، وارد شوید.');
                    setState(() => signup = false);
                  }
                } else {
                  await sb.auth.signInWithPassword(email: e, password: p);
                }
              } on AuthException catch (x) {
                if (mounted) toast(context, x.message);
              } catch (_) {
                if (mounted) toast(context, 'اتصال برقرار نیست');
              }
              if (mounted) setState(() => busy = false);
            }

            Future<void> forgot() async {
              final e = email.text.trim();
              if (!e.contains('@')) {
                toast(context, 'ابتدا ایمیل خود را وارد کنید');
                return;
              }
              try {
                await sb.auth.resetPasswordForEmail(e);
                if (mounted) toast(context, 'اگر این ایمیل ثبت شده باشد، لینک بازیابی ارسال می‌شود');
              } catch (_) {
                if (mounted) toast(context, 'ارسال ناموفق بود');
              }
            }

            @override
            Widget build(BuildContext context) {
              final t = Theme.of(context).textTheme;
              return Scaffold(
                body: Container(
                  decoration: const BoxDecoration(
                    gradient: LinearGradient(
                        begin: Alignment.topCenter,
                        end: Alignment.bottomCenter,
                        colors: [Color(0xFF0E7C86), Color(0xFF14B8A6)],
                        stops: [0, .5]),
                  ),
                  child: SafeArea(
                    child: Center(
                      child: SingleChildScrollView(
                        padding: const EdgeInsets.all(24),
                        child: Column(
                          children: [
                            const Icon(Icons.account_balance_wallet_rounded,
                                size: 64, color: Colors.white),
                            const SizedBox(height: 8),
                            Text('حساب‌یار',
                                style: t.headlineMedium?.copyWith(
                                    color: Colors.white, fontWeight: FontWeight.bold)),
                            Text('مدیریت بدهی، طلب و پشتیبان‌گیری ابری',
                                style: t.bodyMedium?.copyWith(color: Colors.white70)),
                            const SizedBox(height: 28),
                            Card(
                              elevation: 0,
                              shape: RoundedRectangleBorder(
                                  borderRadius: BorderRadius.circular(28)),
                              child: Padding(
                                padding: const EdgeInsets.all(20),
                                child: Column(
                                  children: [
                                    Text(signup ? 'ساخت حساب' : 'ورود',
                                        style: t.titleLarge
                                            ?.copyWith(fontWeight: FontWeight.bold)),
                                    const SizedBox(height: 16),
                                    TextField(
                                        controller: email,
                                        keyboardType: TextInputType.emailAddress,
                                        textDirection: TextDirection.ltr,
                                        decoration: deco('ایمیل', icon: Icons.email_outlined)),
                                    const SizedBox(height: 12),
                                    TextField(
                                      controller: pass,
                                      obscureText: hide,
                                      textDirection: TextDirection.ltr,
                                      decoration: deco('رمز عبور', icon: Icons.lock_outline)
                                          .copyWith(
                                              suffixIcon: IconButton(
                                                  icon: Icon(hide
                                                      ? Icons.visibility_off
                                                      : Icons.visibility),
                                                  onPressed: () =>
                                                      setState(() => hide = !hide))),
                                    ),
                                    const SizedBox(height: 16),
                                    SizedBox(
                                      width: double.infinity,
                                      height: 50,
                                      child: FilledButton(
                                        onPressed: busy ? null : submit,
                                        child: busy
                                            ? const SizedBox(
                                                width: 22,
                                                height: 22,
                                                child: CircularProgressIndicator(strokeWidth: 2))
                                            : Text(signup ? 'ثبت‌نام' : 'ورود'),
                                      ),
                                    ),
                                    TextButton(
                                        onPressed: () => setState(() => signup = !signup),
                                        child: Text(signup
                                            ? 'حساب دارید؟ وارد شوید'
                                            : 'حساب ندارید؟ ثبت‌نام کنید')),
                                    if (!signup)
                                      TextButton(
                                          onPressed: forgot,
                                          child: const Text('فراموشی رمز عبور')),
                                  ],
                                ),
                              ),
                            ),
                          ],
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          // ---------- home shell ----------
          class Home extends StatefulWidget {
            const Home({super.key});
            @override
            State<Home> createState() => _HomeState();
          }

          class _HomeState extends State<Home> {
            int i = 0;

            @override
            void initState() {
              super.initState();
              store.load().then((_) => autoBackupIfDue());
              loadProfile().then((_) => store.refreshUI());
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: IndexedStack(index: i, children: const [
                    DashboardPage(),
                    AccountsPage(),
                    PeoplePage(),
                    BackupPage(),
                    SettingsPage(),
                  ]),
                ),
                floatingActionButton: i <= 2
                    ? FloatingActionButton.extended(
                        onPressed: () => openAccountForm(context),
                        icon: const Icon(Icons.add),
                        label: const Text('ثبت حساب'))
                    : null,
                bottomNavigationBar: NavigationBar(
                  selectedIndex: i,
                  onDestinationSelected: (v) => setState(() => i = v),
                  destinations: const [
                    NavigationDestination(icon: Icon(Icons.dashboard_outlined), selectedIcon: Icon(Icons.dashboard), label: 'خانه'),
                    NavigationDestination(icon: Icon(Icons.receipt_long_outlined), selectedIcon: Icon(Icons.receipt_long), label: 'حساب‌ها'),
                    NavigationDestination(icon: Icon(Icons.people_outline), selectedIcon: Icon(Icons.people), label: 'اشخاص'),
                    NavigationDestination(icon: Icon(Icons.cloud_outlined), selectedIcon: Icon(Icons.cloud), label: 'پشتیبان'),
                    NavigationDestination(icon: Icon(Icons.settings_outlined), selectedIcon: Icon(Icons.settings), label: 'تنظیمات'),
                  ],
                ),
              );
            }
          }

          Widget offlineBanner(BuildContext c) => store.offline
              ? Container(
                  margin: const EdgeInsets.only(bottom: 12),
                  padding: const EdgeInsets.all(12),
                  decoration: BoxDecoration(
                      color: Theme.of(c).colorScheme.errorContainer,
                      borderRadius: BorderRadius.circular(16)),
                  child: const Row(children: [
                    Icon(Icons.cloud_off),
                    SizedBox(width: 8),
                    Expanded(child: Text('اتصال برقرار نیست؛ آخرین داده‌های ذخیره‌شده فقط برای مشاهده نمایش داده می‌شود.')),
                  ]),
                )
              : const SizedBox.shrink();

          // ---------- dashboard ----------
          class DashboardPage extends StatelessWidget {
            const DashboardPage({super.key});

            @override
            Widget build(BuildContext context) {
              return ListenableBuilder(
                listenable: Listenable.merge([store, unit]),
                builder: (c, _) {
                  final accs = store.accs;
                  final open = accs.where((a) => !a.settled).toList();
                  final rec = open.where((a) => a.isRec).fold<int>(0, (s, a) => s + a.remaining);
                  final pay = open.where((a) => !a.isRec).fold<int>(0, (s, a) => s + a.remaining);
                  final net = rec - pay;
                  final now = DateTime.now();
                  final today = DateTime(now.year, now.month, now.day);
                  final dueList = open
                      .where((a) => a.due != null && a.due!.difference(today).inDays <= 14)
                      .toList()
                    ..sort((x, y) => x.due!.compareTo(y.due!));
                  final recent = <Map<String, dynamic>>[];
                  for (final a in accs) {
                    for (final t in a.txs) {
                      recent.add({...Map<String, dynamic>.from(t as Map), 'acc': a});
                    }
                  }
                  recent.sort((x, y) =>
                      '${y['transaction_date']}'.compareTo('${x['transaction_date']}'));
                  final tt = Theme.of(c).textTheme;
                  return RefreshIndicator(
                    onRefresh: store.load,
                    child: ListView(
                      physics: const AlwaysScrollableScrollPhysics(),
                      padding: const EdgeInsets.fromLTRB(16, 16, 16, 100),
                      children: [
                        Text(profileName.isEmpty ? 'سلام 👋' : 'سلام $profileName 👋',
                            style: tt.titleLarge?.copyWith(fontWeight: FontWeight.bold)),
                        const SizedBox(height: 12),
                        offlineBanner(c),
                        Container(
                          padding: const EdgeInsets.all(22),
                          decoration: BoxDecoration(
                            borderRadius: BorderRadius.circular(28),
                            gradient: const LinearGradient(
                                begin: Alignment.topRight,
                                end: Alignment.bottomLeft,
                                colors: [Color(0xFF0E7C86), Color(0xFF14B8A6)]),
                          ),
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Text('خالص مانده',
                                  style: tt.bodyMedium?.copyWith(color: Colors.white70)),
                              const SizedBox(height: 6),
                              Text(money(net.abs()),
                                  style: tt.headlineMedium?.copyWith(
                                      color: Colors.white, fontWeight: FontWeight.bold)),
                              const SizedBox(height: 4),
                              Text(
                                  net > 0
                                      ? 'در مجموع طلبکار هستید'
                                      : net < 0
                                          ? 'در مجموع بدهکار هستید'
                                          : 'تراز صفر',
                                  style: tt.bodySmall?.copyWith(color: Colors.white70)),
                            ],
                          ),
                        ),
                        const SizedBox(height: 12),
                        Row(children: [
                          Expanded(child: _stat(c, 'مجموع طلب‌ها', rec, cRec, Icons.south_west)),
                          const SizedBox(width: 12),
                          Expanded(child: _stat(c, 'مجموع بدهی‌ها', pay, cPay, Icons.north_east)),
                        ]),
                        sec(c, 'سررسیدهای نزدیک'),
                        if (dueList.isEmpty) card(c, const Text('سررسید نزدیکی ندارید ✨')),
                        ...dueList.take(5).map((a) => AccTile(a)),
                        sec(c, 'آخرین پرداخت‌ها'),
                        if (recent.isEmpty) card(c, const Text('هنوز پرداختی ثبت نشده است')),
                        ...recent.take(5).map((t) {
                          final a = t['acc'] as Acc;
                          return card(
