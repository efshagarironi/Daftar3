          SCREENS_EOF
          cat > supabase/schema.sql <<'SQL_EOF'
          -- HesabYar: Supabase schema + RLS. Run once in Supabase -> SQL Editor.
          create extension if not exists pgcrypto;

          create table if not exists public.profiles (
            user_id uuid primary key references auth.users(id) on delete cascade,
            display_name text,
            currency_unit text not null default 'تومان',
            language text not null default 'fa',
            created_at timestamptz not null default now()
          );

          create table if not exists public.contacts (
            id uuid primary key default gen_random_uuid(),
            user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,
            name text not null,
            phone text,
            notes text,
            archived_at timestamptz,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now()
          );

          create table if not exists public.accounts (
            id uuid primary key default gen_random_uuid(),
            user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,
            contact_id uuid not null references public.contacts(id) on delete cascade,
            type text not null check (type in ('receivable','payable')),
            title text not null,
            principal_amount bigint not null check (principal_amount > 0),
            currency text not null default 'تومان',
            opened_at date not null default current_date,
            due_at date,
            notes text,
            status text not null default 'open' check (status in ('open','settled')),
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now()
          );

          create table if not exists public.transactions (
            id uuid primary key default gen_random_uuid(),
            user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,
            account_id uuid not null references public.accounts(id) on delete cascade,
            type text not null default 'payment' check (type in ('payment')),
            amount bigint not null check (amount > 0),
            transaction_date date not null default current_date,
            note text,
            created_at timestamptz not null default now()
          );

          create table if not exists public.backup_records (
            id uuid primary key default gen_random_uuid(),
            user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,
            storage_path text not null,
            format_version int not null default 1,
            file_size bigint,
            checksum text,
            status text not null default 'ok',
            created_at timestamptz not null default now()
          );

          create index if not exists contacts_user_idx on public.contacts(user_id);
          create index if not exists accounts_user_idx on public.accounts(user_id);
          create index if not exists accounts_contact_idx on public.accounts(contact_id);
          create index if not exists tx_user_idx on public.transactions(user_id);
          create index if not exists tx_account_idx on public.transactions(account_id);
          create index if not exists backup_user_idx on public.backup_records(user_id, created_at desc);

          create or replace function public.set_updated_at() returns trigger
          language plpgsql as $$
          begin new.updated_at = now(); return new; end $$;

          drop trigger if exists contacts_upd on public.contacts;
          create trigger contacts_upd before update on public.contacts
            for each row execute function public.set_updated_at();
          drop trigger if exists accounts_upd on public.accounts;
          create trigger accounts_upd before update on public.accounts
            for each row execute function public.set_updated_at();

          create or replace function public.handle_new_user() returns trigger
          language plpgsql security definer set search_path = public as $$
          begin
            insert into public.profiles(user_id) values (new.id) on conflict do nothing;
            return new;
          end $$;
          drop trigger if exists on_auth_user_created on auth.users;
          create trigger on_auth_user_created after insert on auth.users
            for each row execute function public.handle_new_user();

          -- Row Level Security
          alter table public.profiles enable row level security;
          alter table public.contacts enable row level security;
          alter table public.accounts enable row level security;
          alter table public.transactions enable row level security;
          alter table public.backup_records enable row level security;

          drop policy if exists own_profiles on public.profiles;
          create policy own_profiles on public.profiles for all to authenticated
            using (user_id = auth.uid()) with check (user_id = auth.uid());

          drop policy if exists own_contacts on public.contacts;
          create policy own_contacts on public.contacts for all to authenticated
            using (user_id = auth.uid()) with check (user_id = auth.uid());

          drop policy if exists own_accounts on public.accounts;
          create policy own_accounts on public.accounts for all to authenticated
            using (user_id = auth.uid())
            with check (user_id = auth.uid() and exists (
              select 1 from public.contacts c where c.id = contact_id and c.user_id = auth.uid()));

          drop policy if exists own_transactions on public.transactions;
          create policy own_transactions on public.transactions for all to authenticated
            using (user_id = auth.uid())
            with check (user_id = auth.uid() and exists (
              select 1 from public.accounts a where a.id = account_id and a.user_id = auth.uid()));

          drop policy if exists own_backup_records on public.backup_records;
          create policy own_backup_records on public.backup_records for all to authenticated
            using (user_id = auth.uid()) with check (user_id = auth.uid());

          -- Atomic restore (runs as the caller, so RLS still applies)
          create or replace function public.restore_user_data(payload jsonb) returns void
          language plpgsql security invoker set search_path = public as $$
          begin
            delete from public.contacts where user_id = auth.uid();

            insert into public.contacts(id, user_id, name, phone, notes, archived_at, created_at, updated_at)
            select (c->>'id')::uuid, auth.uid(), c->>'name', c->>'phone', c->>'notes',
                   (c->>'archived_at')::timestamptz,
                   coalesce((c->>'created_at')::timestamptz, now()),
                   coalesce((c->>'updated_at')::timestamptz, now())
            from jsonb_array_elements(coalesce(payload->'contacts', '[]'::jsonb)) c;

            insert into public.accounts(id, user_id, contact_id, type, title, principal_amount, currency,
                                        opened_at, due_at, notes, status, created_at, updated_at)
            select (a->>'id')::uuid, auth.uid(), (a->>'contact_id')::uuid, a->>'type', a->>'title',
                   (a->>'principal_amount')::bigint, coalesce(a->>'currency', 'تومان'),
                   coalesce((a->>'opened_at')::date, current_date), (a->>'due_at')::date,
                   a->>'notes', coalesce(a->>'status', 'open'),
                   coalesce((a->>'created_at')::timestamptz, now()),
                   coalesce((a->>'updated_at')::timestamptz, now())
            from jsonb_array_elements(coalesce(payload->'accounts', '[]'::jsonb)) a;

            insert into public.transactions(id, user_id, account_id, type, amount, transaction_date, note, created_at)
            select (t->>'id')::uuid, auth.uid(), (t->>'account_id')::uuid, coalesce(t->>'type', 'payment'),
                   (t->>'amount')::bigint, coalesce((t->>'transaction_date')::date, current_date),
                   t->>'note', coalesce((t->>'created_at')::timestamptz, now())
            from jsonb_array_elements(coalesce(payload->'transactions', '[]'::jsonb)) t;
          end $$;

          create or replace function public.delete_my_account() returns void
          language plpgsql security definer set search_path = public, auth as $$
          begin
            delete from auth.users where id = auth.uid();
          end $$;

          revoke all on function public.restore_user_data(jsonb) from public, anon;
          revoke all on function public.delete_my_account() from public, anon;
          grant execute on function public.restore_user_data(jsonb) to authenticated;
          grant execute on function public.delete_my_account() to authenticated;

          -- Private storage bucket for backups: each user can only touch the folder named after their user id
          insert into storage.buckets (id, name, public) values ('backups', 'backups', false)
            on conflict (id) do nothing;

          drop policy if exists backups_select_own on storage.objects;
          create policy backups_select_own on storage.objects for select to authenticated
            using (bucket_id = 'backups' and (storage.foldername(name))[1] = auth.uid()::text);
          drop policy if exists backups_insert_own on storage.objects;
          create policy backups_insert_own on storage.objects for insert to authenticated
            with check (bucket_id = 'backups' and (storage.foldername(name))[1] = auth.uid()::text);
          drop policy if exists backups_delete_own on storage.objects;
          create policy backups_delete_own on storage.objects for delete to authenticated
            using (bucket_id = 'backups' and (storage.foldername(name))[1] = auth.uid()::text);
          SQL_EOF

          MF=android/app/src/main/AndroidManifest.xml
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-permission android:name="android.permission.INTERNET"/>#' "$MF"
          sed -i 's/android:label="hesabyar"/android:label="حساب‌یار"/' "$MF"
          grep -q "android.permission.INTERNET" "$MF" || { echo "INTERNET permission was not added to the manifest"; exit 1; }

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabyar-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Supabase schema
        uses: actions/upload-artifact@v4
        with:
          name: supabase-schema
          path: supabase/schema.sql
