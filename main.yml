          // ---------- backup & export ----------
          Future<void> shareFile(String name, String content, String mime) async {
            final d = await getTemporaryDirectory();
            final f = File('${d.path}/$name');
            await f.writeAsString(content);
            await Share.shareXFiles([XFile(f.path, mimeType: mime)]);
          }

          String csvCell(Object? v) {
            final s = '${v ?? ''}'.replaceAll('"', '""');
            return '"$s"';
          }

          String buildCsv() {
            final rows = <List<Object?>>[
              ['شخص', 'عنوان', 'نوع', 'مبلغ اولیه', 'پرداخت‌شده', 'مانده', 'تاریخ ثبت', 'سررسید', 'وضعیت']
            ];
            for (final a in store.accs) {
              rows.add([
                a.who,
                a.title,
                a.isRec ? 'طلب' : 'بدهی',
                a.principal,
                a.paid,
                a.remaining,
                a.opened == null ? '' : ymd(a.opened!),
                a.due == null ? '' : ymd(a.due!),
                a.settled ? 'تسویه‌شده' : 'باز',
              ]);
            }
            return '\uFEFF${rows.map((r) => r.map(csvCell).join(',')).join('\n')}';
          }

          class BackupPage extends StatefulWidget {
            const BackupPage({super.key});
            @override
            State<BackupPage> createState() => _BackupPageState();
          }

          class _BackupPageState extends State<BackupPage> {
            late Future<List<Map<String, dynamic>>> recs = _recs();
            bool busy = false, auto = false;

            Future<List<Map<String, dynamic>>> _recs() async {
              final r = await sb.from('backup_records').select().order('created_at', ascending: false).limit(50);
              return List<Map<String, dynamic>>.from(r);
            }

            @override
            void initState() {
              super.initState();
              SharedPreferences.getInstance().then((p) {
                if (mounted) setState(() => auto = p.getBool('auto_backup') ?? false);
              });
            }

            Future<void> create() async {
              setState(() => busy = true);
              final ok = await run(context, () async {
                await createBackup();
                await pruneBackups(30);
              }, reload: false);
              if (!mounted) return;
              setState(() {
                busy = false;
                recs = _recs();
              });
              if (ok) toast(context, 'نسخه پشتیبان ابری ساخته شد');
            }

            Future<void> restore(Map<String, dynamic> r) async {
              setState(() => busy = true);
              Map<String, dynamic>? j;
              try {
                j = await readBackup(r['storage_path'] as String);
              } catch (e) {
                if (mounted) toast(context, e is String ? e : 'دریافت نسخه پشتیبان ناموفق بود');
              }
              if (!mounted) return;
              setState(() => busy = false);
              if (j == null) return;
              final d = j['data'] as Map<String, dynamic>;
              final ok = await confirm(
                  context,
                  'بازیابی نسخه پشتیبان',
                  'تاریخ: ${fmtDate(DateTime.parse(j['created_at'] as String).toLocal())}\n'
                      'اشخاص: ${faDigits('${(d['contacts'] as List).length}')}  |  '
                      'حساب‌ها: ${faDigits('${(d['accounts'] as List).length}')}  |  '
                      'پرداخت‌ها: ${faDigits('${(d['transactions'] as List).length}')}\n\n'
                      'داده‌های فعلی شما با این نسخه جایگزین می‌شود. پیش از آن یک نسخهٔ پشتیبان از وضعیت فعلی ساخته می‌شود.',
                  ok: 'جایگزین کن');
              if (!ok || !mounted) return;
              setState(() => busy = true);
              final done = await run(context, () async {
                await createBackup();
                await sb.rpc('restore_user_data', params: {'payload': d});
              });
              if (!mounted) return;
              setState(() {
                busy = false;
                recs = _recs();
              });
              if (done) toast(context, 'بازیابی انجام شد');
            }

            Future<void> remove(Map<String, dynamic> r) async {
              if (!await confirm(context, 'حذف نسخه پشتیبان', 'این نسخه برای همیشه حذف می‌شود.', ok: 'حذف')) return;
              if (!mounted) return;
              await run(context, () async {
                await sb.storage.from('backups').remove([r['storage_path'] as String]);
                await sb.from('backup_records').delete().eq('id', r['id']);
              }, reload: false);
              if (mounted) setState(() => recs = _recs());
            }

            @override
            Widget build(BuildContext context) {
              final tt = Theme.of(context).textTheme;
              return ListView(padding: const EdgeInsets.fromLTRB(16, 16, 16, 100), children: [
                Text('پشتیبان‌گیری و خروجی', style: tt.titleLarge?.copyWith(fontWeight: FontWeight.bold)),
                const SizedBox(height: 12),
                card(
                    context,
                    Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                      const Text('نسخهٔ ابری در فضای خصوصی شما ذخیره می‌شود و فقط خودتان به آن دسترسی دارید.'),
                      const SizedBox(height: 12),
                      SizedBox(
                          width: double.infinity,
                          height: 50,
                          child: FilledButton.icon(
                              onPressed: busy ? null : create,
                              icon: const Icon(Icons.cloud_upload_outlined),
                              label: const Text('ایجاد نسخه پشتیبان ابری'))),
                      SwitchListTile(
                        contentPadding: EdgeInsets.zero,
                        title: const Text('پشتیبان خودکار روزانه'),
                        subtitle: const Text('هنگام باز کردن برنامه، اگر بیش از ۲۴ ساعت از آخرین نسخه گذشته باشد؛ ۱۰ نسخه نگه داشته می‌شود'),
                        value: auto,
                        onChanged: (v) async {
                          final p = await SharedPreferences.getInstance();
                          await p.setBool('auto_backup', v);
                          setState(() => auto = v);
                        },
                      ),
                    ])),
                card(
                    context,
                    Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                      const Text('خروجی قابل حمل (رمزگذاری‌نشده است؛ با احتیاط به اشتراک بگذارید)'),
                      const SizedBox(height: 8),
                      Wrap(spacing: 8, children: [
                        OutlinedButton.icon(
                            onPressed: busy
                                ? null
                                : () async {
                                    await run(context, () async {
                                      final snap = await snapshot();
                                      await shareFile('hesabyar_backup.json', jsonEncode(snap), 'application/json');
                                    }, reload: false);
                                  },
                            icon: const Icon(Icons.data_object),
                            label: const Text('JSON')),
                        OutlinedButton.icon(
                            onPressed: busy
                                ? null
                                : () => run(context, () => shareFile('hesabyar_report.csv', buildCsv(), 'text/csv'), reload: false),
                            icon: const Icon(Icons.table_chart_outlined),
                            label: const Text('CSV (اکسل)')),
                      ]),
                    ])),
                if (busy) const LinearProgressIndicator(),
                sec(context, 'نسخه‌های ابری'),
                FutureBuilder<List<Map<String, dynamic>>>(
                  future: recs,
                  builder: (c, s) {
                    if (s.connectionState != ConnectionState.done) {
                      return const Padding(padding: EdgeInsets.all(24), child: Center(child: CircularProgressIndicator()));
                    }
                    if (s.hasError) return emptyBox('دریافت فهرست نسخه‌ها ممکن نشد (اتصال را بررسی کنید)');
                    final list = s.data ?? [];
                    if (list.isEmpty) return emptyBox('هنوز نسخه پشتیبانی ساخته نشده است');
                    return Column(
                        children: list.map((r) {
                      final kb = ((r['file_size'] as num?) ?? 0) / 1024;
                      return card(
                        c,
                        Row(children: [
                          const Icon(Icons.backup_outlined),
                          const SizedBox(width: 12),
                          Expanded(
                              child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                            Text(fmtDate(DateTime.parse(r['created_at'] as String).toLocal()),
                                style: const TextStyle(fontWeight: FontWeight.bold)),
                            Text('${faDigits(kb.toStringAsFixed(1))} کیلوبایت', style: tt.bodySmall),
                          ])),
                          PopupMenuButton<String>(
                            onSelected: (v) => v == 'restore' ? restore(r) : remove(r),
                            itemBuilder: (_) => const [
                              PopupMenuItem(value: 'restore', child: Text('بازیابی')),
                              PopupMenuItem(value: 'delete', child: Text('حذف')),
                            ],
                          ),
                        ]),
                      );
                    }).toList());
                  },
                ),
              ]);
            }
          }

